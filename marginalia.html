als ‘Alea jacta est’). Dit zou Julius Caesar in het jaar 49 voor Christus hebben gezegd. Hij zei dat op het moment dat hij de beslissing nam de rivier de Rubicon (in het Latijn: Rubico) over te steken.", "note": null, "title": "de teerling is geworpen (herkomst en betekenis) | Genootschap Onze Taal", "author": null, "url": "https://onzetaal.nl/schatkamer/lezen/uitdrukkingen/alea-iacta-est-de-teerling-is-geworpen", "created_at": "2026-05-12T21:35:58", "color": null}, {"id": "insta-26971517", "source": "instapaper", "text": "De teerling is geworpen’ betekent: ‘het besluit is genomen en het heeft waarschijnlijk grote gevolgen, maar dat moeten we accepteren", "note": null, "title": "de teerling is geworpen (herkomst en betekenis) | Genootschap Onze Taal", "author": null, "url": "https://onzetaal.nl/schatkamer/lezen/uitdrukkingen/alea-iacta-est-de-teerling-is-geworpen", "created_at": "2026-05-12T21:35:16", "color": null}, {"id": "kobo-annot-1641b4070a751a5a", "source": "kobo", "text": "Ik wilde de geschiedenis van de Stocksterhorn optekenen als een vast punt in de draaikolk van gebeurtenissen die het Oldambt de afgelopen eeuw had beroerd. In die gebeurtenissen zag je haarscherp de eeuwig opspelende strijd tussen boeren en arbeiders, vooruitgang en traditie, natuur en cultuur, stad en platteland.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-11T20:26:55Z", "color": null}, {"id": "kobo-fdf6b397-a3a6-4a46-a06f-4011b78e6769", "source": "kobo", "text": "Ik wilde de geschiedenis van de Stocksterhorn optekenen als een vast punt in de draaikolk van gebeurtenissen die het Oldambt de afgelopen eeuw had beroerd. In die gebeurtenissen zag je haarscherp de eeuwig opspelende strijd tussen boeren en arbeiders, vooruitgang en traditie, natuur en cultuur, stad en platteland.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-11T20:26:55.000", "color": 4}, {"id": "kobo-annot-075534989d431bb4", "source": "kobo", "text": "Als een scharensliep om half een ’s middags bij een zandboer aanklopt, dan eet hij mee. Een kleiboer jaagt hem van zijn erf.’", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-11T20:15:45Z", "color": null}, {"id": "kobo-58f9249d-f07b-41ab-9a90-097385cbaea8", "source": "kobo", "text": "Als een scharensliep om half een ’s middags bij een zandboer aanklopt, dan eet hij mee. Een kleiboer jaagt hem van zijn erf.’", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-11T20:15:45.000", "color": 4}, {"id": "kobo-annot-245fdb3e65d8b58d", "source": "kobo", "text": "‘Het Oldambt,’ zei ik. ‘Het land van edelman en bedelman,’ zei hij. ‘Er woont daar een ander type mens.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-11T20:15:17Z", "color": null}, {"id": "kobo-2c5e8cd7-0048-4075-abf0-df284abbc9ea", "source": "kobo", "text": "‘Het Oldambt,’ zei ik. \n ‘Het land van edelman en bedelman,’ zei hij. ‘Er woont daar een ander type mens.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-11T20:15:17.000", "color": 4}, {"id": "kobo-annot-b810a1f7b8794997", "source": "kobo", "text": "Een paar kilometer noordwaarts begint de klei. De beklinkerde dorpsstraat van Meeden markeert de grens:", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-11T20:15:09Z", "color": null}, {"id": "kobo-4063ab26-11c6-4b90-b923-7c2ed772f035", "source": "kobo", "text": "Een paar kilometer noordwaarts begint de klei. De beklinkerde dorpsstraat van Meeden markeert de grens:", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-11T20:15:09.000", "color": 4}, {"id": "kobo-annot-d4dd83c2d8abf236", "source": "kobo", "text": "Het gas, de uitbuiting, Groningen als voetveeg van de rest van Nederland. Zelfs de herenboeren, merkte ik op, voelen zich tekortgedaan door de provincie, het rijk, Europa.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-11T20:11:02Z", "color": null}, {"id": "kobo-150f1b04-6b4e-4bd0-9a7b-b273e4e94843", "source": "kobo", "text": "Het gas, de uitbuiting, Groningen als voetveeg van de rest van Nederland. Zelfs de herenboeren, merkte ik op, voelen zich tekortgedaan door de provincie, het rijk, Europa.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-11T20:11:02.000", "color": 4}, {"id": "kobo-annot-7299dec7d8bf983f", "source": "kobo", "text": ". Maar de genadeslag kwam tien jaar geleden toen de ptt de kostbare koperkabels uit de grond trok en op houten haspels wikkelde. Daarna was de restbebouwing door caterpillars van de Heidemij omver geschoven, in het kader van de ruilverkaveling.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-11T20:08:41Z", "color": null}, {"id": "kobo-00908805-7df4-463b-941f-f4e3b7a33f14", "source": "kobo", "text": ". Maar de genadeslag kwam tien jaar geleden toen de ptt de kostbare koperkabels uit de grond trok en op houten haspels wikkelde. Daarna was de restbebouwing door caterpillars van de Heidemij omver geschoven, in het kader van de ruilverkaveling.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-11T20:08:41.000", "color": 4}, {"id": "kobo-annot-afce7a4ef032bc68", "source": "kobo", "text": "Het dorp was dus niet verlaten, maar verdwenen?", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-11T20:07:40Z", "color": null}, {"id": "kobo-69fe5e7f-25f9-4ab4-b989-aff1ce09af1c", "source": "kobo", "text": "Het dorp was dus niet verlaten, maar verdwenen?", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-11T20:07:40.000", "color": 4}, {"id": "kobo-annot-56076bb47032690e", "source": "kobo", "text": "Hoornderveen was in de negentiende eeuw gesticht als een nederzetting van turfstekers, die – toen het veen eenmaal was afgegraven – stukje bij beetje was opgeslokt door landhongerige boeren aan de rand van het ontgonnen moeras.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-11T20:07:31Z", "color": null}, {"id": "kobo-ebe60ff3-6acf-4aa0-89af-756a437d43b1", "source": "kobo", "text": "Hoornderveen was in de negentiende eeuw gesticht als een nederzetting van turfstekers, die – toen het veen eenmaal was afgegraven – stukje bij beetje was opgeslokt door landhongerige boeren aan de rand van het ontgonnen moeras.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-11T20:07:31.000", "color": 4}, {"id": "kobo-annot-d19a1b504fe213fd", "source": "kobo", "text": "en dat het leven leuker en meer bevredigend is als je niet in je", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-10T20:41:44Z", "color": null}, {"id": "kobo-0a61b2bd-cd76-47ca-9f5a-b95f7756870a", "source": "kobo", "text": "en dat het leven leuker en meer bevredigend is als je niet in je", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-10T20:41:44.000", "color": 4}, {"id": "kobo-annot-19117c94054f335d", "source": "kobo", "text": "‘Laat ze’ is slechts de eerste helft van het totaal. Je kunt het niet daarbij laten. De theorie kent een tweede, cruciaal deel: let me (laat me).", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-10T20:41:07Z", "color": null}, {"id": "kobo-0ccc9766-3efa-4973-8499-3b7f5e2b467a", "source": "kobo", "text": "‘Laat ze’ is slechts de eerste helft van het totaal. Je kunt het niet daarbij laten. De theorie kent een tweede, cruciaal deel: let me (laat me).", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-10T20:41:07.000", "color": 4}, {"id": "kobo-annot-091687beeec34293", "source": "kobo", "text": "als je alleen maar ‘laat ze’ zegt, eindig je zonder veel vrienden, zonder veel sociale plannen en je afvragend waarom de theorie ‘niet werkt’ in jouw voordeel.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-10T20:40:37Z", "color": null}, {"id": "kobo-a26bd73b-6448-4139-b41d-5f7786944479", "source": "kobo", "text": "als je alleen maar ‘laat ze’ zegt, eindig je zonder veel vrienden, zonder veel sociale plannen en je afvragend waarom de theorie ‘niet werkt’ in jouw voordeel.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-10T20:40:37.000", "color": 4}, {"id": "kobo-annot-3c0799060ad2643e", "source": "kobo", "text": "‘Laat ze’ zeggen verlost je simpelweg van de pijn die je voelt… maar slechts voor even. Het voelt heerlijk andere mensen de schuld te geven en je beter te voelen dan anderen.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-10T20:39:50Z", "color": null}, {"id": "kobo-92eae30e-bde7-4555-9baa-1d71e215449f", "source": "kobo", "text": "‘Laat ze’ zeggen verlost je simpelweg van de pijn die je voelt… maar slechts voor even. Het voelt heerlijk andere mensen de schuld te geven en je beter te voelen dan anderen.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-10T20:39:50.000", "color": 4}, {"id": "kobo-annot-1a07e55a59521c45", "source": "kobo", "text": "andere mensen hebben geen echte macht over je, tenzij je hun die macht geeft. En steeds als je zegt ‘laat ze’, kies je ervoor die terug te pakken.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-10T20:32:55Z", "color": null}, {"id": "kobo-937214e9-cffc-411f-861a-ea782c25aa57", "source": "kobo", "text": "andere mensen hebben geen echte macht over je, tenzij je hun die macht geeft. En steeds als je zegt ‘laat ze’, kies je ervoor die terug te pakken.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-10T20:32:55.000", "color": 4}, {"id": "kobo-annot-ecd6eccad7bffbce", "source": "kobo", "text": "Careful preparations and defenses can never guarantee victory. However, ignoring these precautions is an almost certain recipe for defeat.", "note": null, "title": "Dune: Legends, Heroes, Schools: (The Butlerian Jihad, The Machine Crusade, The Battle of Corrin, Paul of Dune, The Winds of Dune, Sisterhood of Dune, Mentats of Dune, Navigators of Dune)", "author": "Brian Herbert", "url": null, "created_at": "2026-05-08T14:03:29Z", "color": null}, {"id": "kobo-789dc9e9-53ca-4171-9bb1-72802e898406", "source": "kobo", "text": "Careful preparations and defenses can never guarantee victory. However, ignoring these precautions is an almost certain recipe for defeat.", "note": null, "title": "Dune: Legends, Heroes, Schools: (The Butlerian Jihad, The Machine Crusade, The Battle of Corrin, Paul of Dune, The Winds of Dune, Sisterhood of Dune, Mentats of Dune, Navigators of Dune)", "author": "Brian Herbert", "url": null, "created_at": "2026-05-08T14:03:29.000", "color": 4}, {"id": "insta-26952382", "source": "instapaper", "text": "Zo kan een ondernemer die wil extensiveren de aankoop van grond niet terugverdienen uit de bedrijfsvoering, wat de omschakeling naar bijvoorbeeld regeneratieve of biologische landbouw bemoeilijkt (zie Biodiversity in Business, 2025)", "note": null, "title": "Grondmobiliteit blijft laag en vormt knelpunt voor grondmarkt", "author": null, "url": "https://www.kadaster.nl/documents/d/kadaster.nl/themabericht-2026q1-grondmobiliteit-1", "created_at": "2026-05-08T08:58:16", "color": null}, {"id": "insta-26952360", "source": "instapaper", "text": "Agrimatie", "note": null, "title": "Grondmobiliteit blijft laag en vormt knelpunt voor grondmarkt", "author": null, "url": "https://www.kadaster.nl/documents/d/kadaster.nl/themabericht-2026q1-grondmobiliteit-1", "created_at": "2026-05-08T08:55:09", "color": null}, {"id": "insta-26952353", "source": "instapaper", "text": "In bijna alle regio’s ligt het aandeel ondernemers van 51 jaar en ouder tussen de 65% en 75%. Het aandeel bedrijven zonder opvolging ligt vaak tussen de 30% en 45%", "note": null, "title": "Grondmobiliteit blijft laag en vormt knelpunt voor grondmarkt", "author": null, "url": "https://www.kadaster.nl/documents/d/kadaster.nl/themabericht-2026q1-grondmobiliteit-1", "created_at": "2026-05-08T08:54:53", "color": null}, {"id": "insta-26952343", "source": "instapaper", "text": "Daarnaast spelen fiscale factoren een rol: het kan aantrekkelijk zijn om verkoop uit te stellen om directe belastingheffing over stille reserves (zoals de waardestijging van grond) te voorkomen, of om gebruik te maken van fiscale regelingen bij bedrijfsbeëindiging en bedrijfsoverdracht, zoals doorschuifregelingen binnen de familie (zie ook Altes, 2005 en RLI, 2026)", "note": null, "title": "Grondmobiliteit blijft laag en vormt knelpunt voor grondmarkt", "author": null, "url": "https://www.kadaster.nl/documents/d/kadaster.nl/themabericht-2026q1-grondmobiliteit-1", "created_at": "2026-05-08T08:54:04", "color": null}, {"id": "insta-26952339", "source": "instapaper", "text": "Een groot deel van de grond blijft binnen de familie, bijvoorbeeld via bedrijfsopvolging", "note": null, "title": "Grondmobiliteit blijft laag en vormt knelpunt voor grondmarkt", "author": null, "url": "https://www.kadaster.nl/documents/d/kadaster.nl/themabericht-2026q1-grondmobiliteit-1", "created_at": "2026-05-08T08:53:52", "color": null}, {"id": "insta-26952331", "source": "instapaper", "text": "Zo lijkt de relatief lage mobiliteit in grootschalige akkerbouwgebieden in NoordNederland en de polders samen te hangen met grotere, kapitaalintensieve bedrijven en een beperkte uitstroom, terwijl de hogere mobiliteit in delen van Zuid- en Oost-Nederland mogelijk verband houdt met een kleinschaligere en meer dynamische bedrijfsstructuur, frequenter voorkomende bedrijfsbeëindiging of bedrijfsverplaatsing en mogelijk ook een grotere druk vanuit concurrerende functies zoals wonen en infrastructuur.", "note": null, "title": "Grondmobiliteit blijft laag en vormt knelpunt voor grondmarkt", "author": null, "url": "https://www.kadaster.nl/documents/d/kadaster.nl/themabericht-2026q1-grondmobiliteit-1", "created_at": "2026-05-08T08:53:19", "color": null}, {"id": "insta-26952311", "source": "instapaper", "text": "De in 2025 verhandelde 33.900 hectare komt, afgezet tegen het totale areaal landbouwgrond van 1,804 miljoen hectare (zie CBS, 2026), neer op een (relatieve) grondmobiliteit van ongeveer 1,9%. Jaarlijks wisselt dus minder dan 2% van de landbouwgrond van eigenaar", "note": null, "title": "Grondmobiliteit blijft laag en vormt knelpunt voor grondmarkt", "author": null, "url": "https://www.kadaster.nl/documents/d/kadaster.nl/themabericht-2026q1-grondmobiliteit-1", "created_at": "2026-05-08T08:50:06", "color": null}, {"id": "insta-26952310", "source": "instapaper", "text": "In het afgelopen decennium varieerde het jaarlijks verhandelde areaal grofweg tussen de 30.000 en 40.000 hectare, met een duidelijke uitschieter naar beneden in 2023 (27.400 hectare). Na deze dip herstelde de mobiliteit weer richting het langjarig gemiddelde.", "note": null, "title": "Grondmobiliteit blijft laag en vormt knelpunt voor grondmarkt", "author": null, "url": "https://www.kadaster.nl/documents/d/kadaster.nl/themabericht-2026q1-grondmobiliteit-1", "created_at": "2026-05-08T08:49:52", "color": null}, {"id": "insta-26952298", "source": "instapaper", "text": "Tegelijkertijd blijft de vraag naar grond hoog. Vergrijzing en het ontbreken van opvolging creëren wel potentieel aanbod, maar leiden slechts beperkt tot extra transacties op de grondmarkt.", "note": null, "title": "Grondmobiliteit blijft laag en vormt knelpunt voor grondmarkt", "author": null, "url": "https://www.kadaster.nl/documents/d/kadaster.nl/themabericht-2026q1-grondmobiliteit-1", "created_at": "2026-05-08T08:48:55", "color": null}, {"id": "insta-26952211", "source": "instapaper", "text": "Key ingredients in delegation are a) confidence in the skills of the person, and b) confidence in their ability to work independently of you in a way that is aligned with your intentions", "note": null, "title": "Import AI 455: AI systems are about to start building themselves.", "author": null, "url": "https://importai.substack.com/p/import-ai-455-automating-ai-research?_bhlid=4ad60f98e4d53fc8e5b50cb09553501f8142d875&utm_campaign=zo-voorkom-je-dat-je-tegen-claudes-gebruikerslimieten-aanloopt&utm_medium=newsletter&utm_source=www.aireport.nl", "created_at": "2026-05-08T08:39:29", "color": null}, {"id": "kobo-annot-32b43cbd31b92878", "source": "kobo", "text": "Door afstand te nemen kun je mentaal waarnemen wat er gebeurt zonder dat je emoties de overhand krijgen. Dit betekent niet dat je je gevoelens moet onderdrukken of negeren; het gaat er meer om dat je ze erkent zonder je reacties erdoor te laten bepalen. Op die manier helpt de Let Them-theorie je om kalm te blijven, helder na te denken en je gedrag onder controle te houden, wat er ook om je heen gebeurt.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-06T21:21:23Z", "color": null}, {"id": "kobo-4fe59a5c-97b5-4ed6-82b6-4155ca7a1902", "source": "kobo", "text": "Door afstand te nemen kun je mentaal waarnemen wat er gebeurt zonder dat je emoties de overhand krijgen. Dit betekent niet dat je je gevoelens moet onderdrukken of negeren; het gaat er meer om dat je ze erkent zonder je reacties erdoor te laten bepalen. Op die manier helpt de Let Them-theorie je om kalm te blijven, helder na te denken en je gedrag onder controle te houden, wat er ook om je heen gebeurt.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-06T21:21:23.000", "color": 4}, {"id": "kobo-annot-d9bba8a9262578fe", "source": "kobo", "text": "door ‘laat ze’ als tool te gebruiken, pak je je macht terug, niet door controle te hebben over anderen maar door controle te hebben over hoe je op hen reageert. En vaak zul je ervoor kiezen niet te reageren omdat je keer op keer zult zien dat het je tijd en energie niet waard is. Laat ze.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-06T21:18:59Z", "color": null}, {"id": "kobo-97b8243f-9cc1-4098-a90e-9b23f1891502", "source": "kobo", "text": "door ‘laat ze’ als tool te gebruiken, pak je je macht terug, niet door controle te hebben over anderen maar door controle te hebben over hoe je op hen reageert. En vaak zul je ervoor kiezen niet te reageren omdat je keer op keer zult zien dat het je tijd en energie niet waard is. Laat ze.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-06T21:18:59.000", "color": 4}, {"id": "kobo-annot-01ddf44a95c207dd", "source": "kobo", "text": "En bovendien beoefen je met ‘laat ze’ een vorm van radicale acceptatie, een concept uit de moderne psychologie dat stamt uit het boeddhisme. Een van de basisprincipes is dat ons lijden ontstaat doordat we willen dat dingen anders zijn dan ze zijn.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-06T21:16:48Z", "color": null}, {"id": "kobo-1592f05a-41b0-4031-960d-3664fe17d33e", "source": "kobo", "text": "En bovendien beoefen je met ‘laat ze’ een vorm van radicale acceptatie, een concept uit de moderne psychologie dat stamt uit het boeddhisme. Een van de basisprincipes is dat ons lijden ontstaat doordat we willen dat dingen anders zijn dan ze zijn.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-06T21:16:48.000", "color": 4}, {"id": "kobo-annot-8c12d8888336a355", "source": "kobo", "text": "Een van de kernprincipes van het stoïcisme, een oude filosofie die mensen wilde helpen om te gaan met de uitdagingen van het leven, is de gedachte dat we alleen controle kunnen hebben over onze eigen daden en gedachten, niet over die van anderen.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-06T21:16:13Z", "color": null}, {"id": "kobo-64295b26-4b87-4a4f-a638-4e786a2123be", "source": "kobo", "text": "Een van de kernprincipes van het stoïcisme, een oude filosofie die mensen wilde helpen om te gaan met de uitdagingen van het leven, is de gedachte dat we alleen controle kunnen hebben over onze eigen daden en gedachten, niet over die van anderen.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-06T21:16:13.000", "color": 4}, {"id": "kobo-annot-20c6295a83eee04c", "source": "kobo", "text": "Als je ‘laat ze’ zegt, geef je het niet op en loop je niet weg. Je bevrijdt jezelf. Je laat de drang los om te bepalen hoe dingen zouden moeten gaan en laat die zich ontwikkelen zoals ze willen.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-06T21:15:24Z", "color": null}, {"id": "kobo-4e189fd1-6345-4351-be30-92c6ebed2ca1", "source": "kobo", "text": "Als je ‘laat ze’ zegt, geef je het niet op en loop je niet weg. Je bevrijdt jezelf. Je laat de drang los om te bepalen hoe dingen zouden moeten gaan en laat die zich ontwikkelen zoals ze willen.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-06T21:15:24.000", "color": 4}, {"id": "kobo-annot-4cb506b93c0b4877", "source": "kobo", "text": "Als ik ‘laat ze’ zeg, kies ik ervoor om mensen hun eigen keuzen te laten maken en hun leven te laten leiden en daarmee eis ik mijn macht op. Het verlost me van de controle die ik nooit echt had.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-06T21:14:56Z", "color": null}, {"id": "kobo-c3e6a976-451b-4166-8dba-5ae6d473086f", "source": "kobo", "text": "Als ik ‘laat ze’ zeg, kies ik ervoor om mensen hun eigen keuzen te laten maken en hun leven te laten leiden en daarmee eis ik mijn macht op. Het verlost me van de controle die ik nooit echt had.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-06T21:14:56.000", "color": 4}, {"id": "insta-26944979", "source": "instapaper", "text": "Inzicht #4: De markt voor je productief voelen is vele malen groter dan de markt voor daadwerkelijk productief zijn. Op LinkedIn of X zie ik geregeld mensen vertellen over zelfgebouwde AI-tools die in feite niets meer doen dan complexiteit toevoegen aan hun AI-gebruik. Daarom herinner ik mezelf er telkens aan: dien ik nu de technologie of dient de technologie mij?", "note": null, "title": "12 inzichten die je helpen AI te gebruiken zonder je denkvermogen uit handen te geven", "author": null, "url": "https://motivatiemails.intentioneelleven.nl/p/12-inzichten-die-je-helpen-ai-te", "created_at": "2026-05-06T08:57:16", "color": null}, {"id": "insta-26944973", "source": "instapaper", "text": "Ezra Klein haalde in The New York Times recent dit klassieke media-aforisme van stal: ‘We shape our tools and thereafter they shape us’.", "note": null, "title": "12 inzichten die je helpen AI te gebruiken zonder je denkvermogen uit handen te geven", "author": null, "url": "https://motivatiemails.intentioneelleven.nl/p/12-inzichten-die-je-helpen-ai-te", "created_at": "2026-05-06T08:53:23", "color": null}, {"id": "kobo-annot-9182c56c7eb76b68", "source": "kobo", "text": "Laat ze’ is een bewuste keuze om die oerbehoefte aan controle los te laten", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-05T20:54:33Z", "color": null}, {"id": "kobo-f24f3c80-a7e1-403d-b962-ccc80504da9a", "source": "kobo", "text": "Laat ze’ is een bewuste keuze om die oerbehoefte aan controle los te laten", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-05T20:54:33.000", "color": 4}, {"id": "kobo-annot-605e3fa4f2ecc7c2", "source": "kobo", "text": ". En laten we eerlijk zijn, controle schept de illusie van veiligheid.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-05T20:51:50Z", "color": null}, {"id": "kobo-150d8b42-838b-481a-b6de-fa5854fd0e9c", "source": "kobo", "text": ". En laten we eerlijk zijn, controle schept de illusie van veiligheid.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-05T20:51:50.000", "color": 4}, {"id": "kobo-annot-57755c780910d764", "source": "kobo", "text": "In het begin voelden die woorden als een afwijzing. Alsof ik toegaf. Maar toen besefte ik iets belangrijks: ‘laat ze’ ging niet over toegeven. Het ging over mezelf bevrijden van de controle die ik sowieso nooit had.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-05T20:44:10Z", "color": null}, {"id": "kobo-03fe5eab-3338-448a-b9c4-5b0cbde4bc7e", "source": "kobo", "text": "In het begin voelden die woorden als een afwijzing. Alsof ik toegaf. Maar toen besefte ik iets belangrijks: ‘laat ze’ ging niet over toegeven. Het ging over mezelf bevrijden van de controle die ik sowieso nooit had.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-05T20:44:10.000", "color": 4}, {"id": "kobo-annot-028ea925a6c2e493", "source": "kobo", "text": "Deze theorie kent een tweede, nog belangrijker stap: laat me.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-05T20:35:52Z", "color": null}, {"id": "kobo-e63fbdd6-2ebf-4ecc-842e-d8fdce5367dd", "source": "kobo", "text": "Deze theorie kent een tweede, nog belangrijker stap: laat me.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-05T20:35:52.000", "color": 4}, {"id": "kobo-annot-d90622e00754a9ca", "source": "kobo", "text": "Maar in werkelijkheid is er één ding waarover je nooit controle zult hebben. Hoe hard je het ook probeert, je zult nooit in staat zijn controle te hebben over een ander mens. Je hebt alleen controle over jezelf. Over je gedachten, je gedrag en je gevoelens.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-04T20:46:56Z", "color": null}, {"id": "kobo-58d882ef-5836-42d8-aa23-b2cb22826574", "source": "kobo", "text": "Maar in werkelijkheid is er één ding waarover je nooit controle zult hebben. Hoe hard je het ook probeert, je zult nooit in staat zijn controle te hebben over een ander mens. Je hebt alleen controle over jezelf. Over je gedachten, je gedrag en je gevoelens.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-04T20:46:56.000", "color": 4}, {"id": "kobo-annot-0d1be604ba7ada0a", "source": "kobo", "text": "De theorie is gebaseerd op een fundamentele wet van de menselijke natuur: elk menselijk wezen heeft een aangeboren behoefte aan controle.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-04T20:45:55Z", "color": null}, {"id": "kobo-8c8a0c98-975d-4502-9c14-9e4bacd745ce", "source": "kobo", "text": "De theorie is gebaseerd op een fundamentele wet van de menselijke natuur: elk menselijk wezen heeft een aangeboren behoefte aan controle.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-04T20:45:55.000", "color": 4}, {"id": "kobo-annot-8dfe01ad4f5cfac4", "source": "kobo", "text": "En waarom het werkt? Als je stopt met je pogingen controle te krijgen over dingen die niet thuishoren bij jou, verspil je je energie niet langer. Je eist je tijd, je gemoedsrust en je focus weer op. Je beseft dat jouw geluk afhangt van wat jij doet, niet van wat een ander doet, denkt of voelt.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-04T20:27:21Z", "color": null}, {"id": "kobo-3731595c-f45f-4650-9ff9-9b48d705f30f", "source": "kobo", "text": "En waarom het werkt? Als je stopt met je pogingen controle te krijgen over dingen die niet thuishoren bij jou, verspil je je energie niet langer. Je eist je tijd, je gemoedsrust en je focus weer op. Je beseft dat jouw geluk afhangt van wat jij doet, niet van wat een ander doet, denkt of voelt.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-04T20:27:21.000", "color": 4}, {"id": "kobo-annot-8b3c9d084891f415", "source": "kobo", "text": "je eigen leven. Niet langer reageren, maar gaan leven. Toen ik leerde volwassenen volwassenen te laten zijn, veranderde dat mijn leven. En dat zal ook gelden voor jou. Maak jezelf niet langer gek door te proberen met andere mensen te dealen of het ze naar de zin te maken, maar leer gewoon ze te laten begaan.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-04T20:26:19Z", "color": null}, {"id": "kobo-62c92092-f959-49c2-91a2-d9c67c084e3b", "source": "kobo", "text": "je eigen leven. Niet langer reageren, maar gaan leven.\n Toen ik leerde volwassenen volwassenen te laten zijn, veranderde dat mijn leven. En dat zal ook gelden voor jou. Maak jezelf niet langer gek door te proberen met andere mensen te dealen of het ze naar de zin te maken, maar leer gewoon ze te laten begaan.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-04T20:26:19.000", "color": 4}, {"id": "kobo-annot-b6046108b7831aeb", "source": "kobo", "text": "Als je je niet langer druk maakt om wat anderen denken, zeggen of doen, heb je eindelijk genoeg energie om je te focussen op je eigen leven. Niet langer reageren, maar gaan leven.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-04T20:25:46Z", "color": null}, {"id": "kobo-6f3bd62f-1a9c-4b54-85a7-55acfbaf764f", "source": "kobo", "text": "Als je je niet langer druk maakt om wat anderen denken, zeggen of doen, heb je eindelijk genoeg energie om je te focussen op je eigen leven. Niet langer reageren, maar gaan leven.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-04T20:25:46.000", "color": 4}, {"id": "kobo-annot-34e943c2d854af4a", "source": "kobo", "text": "De Let Them-theorie gaat over vrijheid.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-04T20:25:22Z", "color": null}, {"id": "kobo-d98bd006-99a8-486c-8a58-c2c9d9f9b3b4", "source": "kobo", "text": "De Let Them-theorie gaat over vrijheid.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-04T20:25:22.000", "color": 4}, {"id": "kobo-annot-4e3d1e62dd8288ce", "source": "kobo", "text": "De 5-seconderegel werkt omdat die je helpt de innerlijke strijd te winnen die je met jezelf voert. Maar hij kan niets doen tegen je dagelijkse strijd met de buitenwereld.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-04T20:13:21Z", "color": null}, {"id": "kobo-2545bb3d-09bb-493f-a6c2-f73caeed09a7", "source": "kobo", "text": "De 5-seconderegel werkt omdat die je helpt de innerlijke strijd te winnen die je met jezelf voert. Maar hij kan niets doen tegen je dagelijkse strijd met de buitenwereld.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-04T20:13:21.000", "color": 4}, {"id": "kobo-annot-e0e10e5405f518c5", "source": "kobo", "text": "Je vindt meer informatie over mijn mediaproductiebedrijf, de podcast, onze nieuwsbrief en onze cursussen op www.melrobbins.com.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-03T20:31:26Z", "color": null}, {"id": "kobo-7182e69d-76f7-49e4-8e9b-522bc6ecd15b", "source": "kobo", "text": "Je vindt meer informatie over mijn mediaproductiebedrijf, de podcast, onze nieuwsbrief en onze cursussen op www.melrobbins.com.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-03T20:31:26.000", "color": 4}, {"id": "kobo-annot-7ef5c83010aeff4a", "source": "kobo", "text": "Jezelf dwingen actie te ondernemen terwijl je vol angsten of twijfels zit of allerlei uitvluchten bedenkt, is een vaardigheid die je kunt leren. Heb je die eenmaal onder de knie, dan begrijp je dat je alles kunt bereiken met kleine, consequente stappen voorwaarts.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-03T20:25:39Z", "color": null}, {"id": "kobo-cc1d6316-4948-4efd-97cb-c580dd00ab80", "source": "kobo", "text": "Jezelf dwingen actie te ondernemen terwijl je vol angsten of twijfels zit of allerlei uitvluchten bedenkt, is een vaardigheid die je kunt leren. Heb je die eenmaal onder de knie, dan begrijp je dat je alles kunt bereiken met kleine, consequente stappen voorwaarts.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-03T20:25:39.000", "color": 4}, {"id": "kobo-annot-59502a75fc76e427", "source": "kobo", "text": "Het probleem met wachten is dat er niemand langskomt. Je hebt alleen toestemming nodig van jezelf.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-03T20:23:57Z", "color": null}, {"id": "kobo-1e3a3a27-7bd7-4952-9c6c-75cc89b8305a", "source": "kobo", "text": "Het probleem met wachten is dat er niemand langskomt. Je hebt alleen toestemming nodig van jezelf.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-03T20:23:57.000", "color": 4}, {"id": "kobo-annot-3428788eb6cc7ff6", "source": "kobo", "text": "kleine, consequente stappen veranderen alles.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-03T20:22:48Z", "color": null}, {"id": "kobo-f63da30d-fce8-4305-9b2a-f58271453480", "source": "kobo", "text": "kleine, consequente stappen veranderen alles.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-03T20:22:48.000", "color": 4}, {"id": "kobo-annot-5a0ba69a1557186e", "source": "kobo", "text": "De 5-seconderegel leerde me dat actie cruciaal is. Je lost je problemen niet op door erover na te denken. Als je afwacht tot je zin hebt om iets te doen, zul je nooit in actie komen. Ik leerde dat niemand je komt redden. Je moet jezelf redden van jezelf. Je moet jezelf dwingen dag na dag kleine stappen te zetten, vooral als je daar geen zin in hebt.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-03T20:17:23Z", "color": null}, {"id": "kobo-b09dad7c-4b7b-4596-a49f-6dd625fd786d", "source": "kobo", "text": "De 5-seconderegel leerde me dat actie cruciaal is. Je lost je problemen niet op door erover na te denken. Als je afwacht tot je zin hebt om iets te doen, zul je nooit in actie komen. Ik leerde dat niemand je komt redden. Je moet jezelf redden van jezelf. Je moet jezelf dwingen dag na dag kleine stappen te zetten, vooral als je daar geen zin in hebt.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-03T20:17:23.000", "color": 4}, {"id": "kobo-annot-536cfba98dda0402", "source": "kobo", "text": "Net zoals het niet veilig is voedsel op de grond te laten liggen, is het ook niet veilig een gedachte in je hoofd te laten rondhangen. Maar als je binnen vijf seconden in actie komt, heb je geen tijd voor twijfel. Geen tijd voor uitstelgedrag. Geen tijd voor uitvluchten. 5-4-3-2-1: actie.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-03T20:15:33Z", "color": null}, {"id": "kobo-5f5ddb03-02d5-4239-9e50-dce0964d9c01", "source": "kobo", "text": "Net zoals het niet veilig is voedsel op de grond te laten liggen, is het ook niet veilig een gedachte in je hoofd te laten rondhangen. Maar als je binnen vijf seconden in actie komt, heb je geen tijd voor twijfel. Geen tijd voor uitstelgedrag. Geen tijd voor uitvluchten. 5-4-3-2-1: actie.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-03T20:15:33.000", "color": 4}, {"id": "kobo-annot-07bc9d976336af24", "source": "kobo", "text": "Ik begon het de ‘5-seconderegel’ te noemen omdat ik besefte dat mijn brein die tijd nodig had om een idee te verpesten.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-03T20:14:48Z", "color": null}, {"id": "kobo-519c5020-608a-433f-ba41-c3bc824385b2", "source": "kobo", "text": "Ik begon het de ‘5-seconderegel’ te noemen omdat ik besefte dat mijn brein die tijd nodig had om een idee te verpesten.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-03T20:14:48.000", "color": 4}, {"id": "kobo-annot-a0d57b225d3cd6d5", "source": "kobo", "text": "Tel gewoon af van 5 tot 1 en sta dan op.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-03T20:13:54Z", "color": null}, {"id": "kobo-0a6e26a6-4114-42cd-9883-3dccd9fa3a15", "source": "kobo", "text": "Tel gewoon af van 5 tot 1 en sta dan op.", "note": null, "title": "The Let Them Theory", "author": "Mel Robbins", "url": null, "created_at": "2026-05-03T20:13:54.000", "color": 4}, {"id": "insta-26924655", "source": "instapaper", "text": "Ik bedoel de term duurzaam in de oorspronkelijke betekenis, zoals door de Verenigde Naties beschreven: ontwikkeling die voorziet in de behoeften van de huidige generatie zonder de mogelijkheden van toekomstige generaties om in hun behoeften te voorzien in gevaar te brengen. Vertaald in drie kernideeën betekent dit: er zijn grenzen aan onze grondstoffen; rechtvaardigheid tussen generaties en tussen landen en samenhang tussen economie en milieu", "note": null, "title": "‘Landbouw is cultuur en ons erfgoed’ - Nieuwe Oogst", "author": null, "url": "https://www.nieuweoogst.nl/nieuws/2026/04/27/landbouw-is-cultuur-en-ons-erfgoed", "created_at": "2026-05-01T11:41:14", "color": null}, {"id": "insta-26924608", "source": "instapaper", "text": "We besteden steeds minder tijd aan het lezen van boeken. De Britse schrijver James Marriott stelde in een zwaar aangezet hit-essay zelfs dat er een post-geletterde samenleving ontstaat", "note": null, "title": "Dit vind ik één van de mooiste Europese uitvindingen", "author": null, "url": "https://substack.pfauth.com/p/dit-vind-ik-een-van-de-mooiste-europese", "created_at": "2026-05-01T11:30:30", "color": null}, {"id": "insta-26924603", "source": "instapaper", "text": "werkzame leven véél efficiënter aan het inrichten ben met AI agents - dit mooie citaat van Milan Kundera:\n\n“Je kunt de mens terecht verwijten dat hij in zijn leven van alledag blind is voor dergelijke toevalligheden, waardoor zijn leven de dimensie van schoonheid verliest", "note": null, "title": "Dit vind ik één van de mooiste Europese uitvindingen", "author": null, "url": "https://substack.pfauth.com/p/dit-vind-ik-een-van-de-mooiste-europese", "created_at": "2026-05-01T11:29:41", "color": null}, {"id": "kobo-annot-5f86507bfb764c0f", "source": "kobo", "text": "www.binformedia.nl/wetenschap-en-technologie/nieuwe-technologie-laat-mensen-communiceren-met-dieren", "note": null, "title": "Heimwee moet je koesteren", "author": "Floortje Dessing", "url": null, "created_at": "2026-05-01T06:38:10Z", "color": null}, {"id": "kobo-cba2dc77-5a81-4bf1-aa93-ee518c3d1623", "source": "kobo", "text": "www.binformedia.nl/wetenschap-en-technologie/nieuwe-technologie-laat-mensen-communiceren-met-dieren", "note": null, "title": "Heimwee moet je koesteren", "author": "Floortje Dessing", "url": null, "created_at": "2026-05-01T06:38:10.000", "color": 4}, {"id": "kobo-annot-cbe34b2003660c6d", "source": "kobo", "text": ". Of wij nou wel of niet bestaan, het maakt niets uit voor het ecosysteem. Als een vlinder, of een bij, of een tijger wordt uitgeroeid en dus uit het ecosysteem verdwijnt, dan heeft dat een impact op de directe omgeving in het ecosysteem waar dat dier leeft. Omdat het een voedselketen onderbreekt bijvoorbeeld. Maar dat geldt niet voor ons als mens: wij hebben als enige op aarde geen functie in het ecosysteem. Wij maken alleen dingen kapot. Misschien dat we, omdat we geen rol spelen in het ecosysteem, onszelf wel boven alle anderen dieren hebben gezet om te laten zien dat we toch belangrijk zijn en een functie hebben. Wie weet.’", "note": null, "title": "Heimwee moet je koesteren", "author": "Floortje Dessing", "url": null, "created_at": "2026-05-01T06:34:06Z", "color": null}, {"id": "kobo-8e0cd78e-23c5-4737-9178-6a307f43481c", "source": "kobo", "text": ". Of wij nou wel of niet bestaan, het maakt niets uit voor het ecosysteem. Als een vlinder, of een bij, of een tijger wordt uitgeroeid en dus uit het ecosysteem verdwijnt, dan heeft dat een impact op de directe omgeving in het ecosysteem waar dat dier leeft. Omdat het een voedselketen onderbreekt bijvoorbeeld. Maar dat geldt niet voor ons als mens: wij hebben als enige op aarde geen functie in het ecosysteem. Wij maken alleen dingen kapot. Misschien dat we, omdat we geen rol spelen in het ecosysteem, onszelf wel boven alle anderen dieren hebben gezet om te laten zien dat we toch belangrijk zijn en een functie hebben. Wie weet.’", "note": null, "title": "Heimwee moet je koesteren", "author": "Floortje Dessing", "url": null, "created_at": "2026-05-01T06:34:06.000", "color": 4}, {"id": "kobo-annot-0beb7500c99926be", "source": "kobo", "text": "elkaar tot slaaf maakten; daarover werden ook geen vragen gesteld. Hoe was het mogelijk dat de ene mens dit de andere mens kon aandoen? Gewoon, wederom omdat het kon. De een was sterker dan de ander en daar maakte je gebruik van.", "note": null, "title": "Heimwee moet je koesteren", "author": "Floortje Dessing", "url": null, "created_at": "2026-05-01T06:31:49Z", "color": null}, {"id": "kobo-3ab4bce5-af02-4a94-82ab-960999355a47", "source": "kobo", "text": "elkaar tot slaaf maakten; daarover werden ook geen vragen gesteld. Hoe was het mogelijk dat de ene mens dit de andere mens kon aandoen? Gewoon, wederom omdat het kon. De een was sterker dan de ander en daar maakte je gebruik van.", "note": null, "title": "Heimwee moet je koesteren", "author": "Floortje Dessing", "url": null, "created_at": "2026-05-01T06:31:49.000", "color": 4}, {"id": "kobo-annot-ea9c2bd3678670f2", "source": "kobo", "text": ". Die is gebaseerd op een filosofie: als vrouwen of minderheden niet vrij zijn, dan is niemand vrij.", "note": null, "title": "Heimwee moet je koesteren", "author": "Floortje Dessing", "url": null, "created_at": "2026-04-27T21:41:07Z", "color": null}, {"id": "kobo-9da1a866-e7d8-435d-b5c0-5da3ae763519", "source": "kobo", "text": ". Die is gebaseerd op een filosofie: als vrouwen of minderheden niet vrij zijn, dan is niemand vrij.", "note": null, "title": "Heimwee moet je koesteren", "author": "Floortje Dessing", "url": null, "created_at": "2026-04-27T21:41:07.000", "color": 4}, {"id": "kobo-annot-2813b3ee63f56715", "source": "kobo", "text": "Nog iets om niet te vergeten: pak altijd één set kleding voor je bestemming in je handbagage. Zodat je dus, behalve de kleding die je in het vliegtuig aanhebt, altijd iets bij je hebt waar je op je bestemming echt wat aan hebt.", "note": null, "title": "Heimwee moet je koesteren", "author": "Floortje Dessing", "url": null, "created_at": "2026-04-27T20:44:58Z", "color": null}, {"id": "kobo-1150e164-68e5-4a7f-a0d5-83f8b980e31b", "source": "kobo", "text": "Nog iets om niet te vergeten: pak altijd één set kleding voor je bestemming in je handbagage. Zodat je dus, behalve de kleding die je in het vliegtuig aanhebt, altijd iets bij je hebt waar je op je bestemming echt wat aan hebt.", "note": null, "title": "Heimwee moet je koesteren", "author": "Floortje Dessing", "url": null, "created_at": "2026-04-27T20:44:58.000", "color": 4}, {"id": "kobo-annot-f6fc0cf6934b72d0", "source": "kobo", "text": "Degenen die het berglandschap in gingen, ontdekten een nieuwe dimensie, die de geologische vraagstukken oversteeg. Het was het gevoel ‘van fysieke vreugde en verrukking’, als gevolg van risico’s nemen. ‘Genietbare angst’ noemt Macfarlane dat. Op de grens van het gevaar probeerde de mens zich te meten met de natuur.", "note": null, "title": "Heimwee moet je koesteren", "author": "Floortje Dessing", "url": null, "created_at": "2026-04-27T20:16:05Z", "color": null}, {"id": "kobo-2f49fc78-7978-4612-9708-c71434656dd5", "source": "kobo", "text": "Degenen die het berglandschap in gingen, ontdekten een nieuwe dimensie, die de geologische vraagstukken oversteeg. Het was het gevoel ‘van fysieke vreugde en verrukking’, als gevolg van risico’s nemen. ‘Genietbare angst’ noemt Macfarlane dat. Op de grens van het gevaar probeerde de mens zich te meten met de natuur.", "note": null, "title": "Heimwee moet je koesteren", "author": "Floortje Dessing", "url": null, "created_at": "2026-04-27T20:16:05.000", "color": 4}, {"id": "kobo-annot-3381be5184478e15", "source": "kobo", "text": "Die vraag waarom mensen naar de top willen, hield ook de befaamde Engelse natuur- en landschapsschrijver Robert Macfarlane bezig. Deze professor aan het Emmanuel College in Cambridge schreef er een boek over: Mountains of the Mind, dat in het Nederlands verscheen als Hoogtekoorts, het raadselachtige verlangen naar de hoogste top. In zijn boek probeert hij ons niet-bergbeklimmers iets te laten begrijpen van de reden dat mensen zo graag omhoog willen.", "note": null, "title": "Heimwee moet je koesteren", "author": "Floortje Dessing", "url": null, "created_at": "2026-04-27T20:12:03Z", "color": null}, {"id": "kobo-c54dfdb4-0205-4543-9c00-da200cecbf22", "source": "kobo", "text": "Die vraag waarom mensen naar de top willen, hield ook de befaamde Engelse natuur- en landschapsschrijver Robert Macfarlane bezig. Deze professor aan het Emmanuel College in Cambridge schreef er een boek over: Mountains of the Mind, dat in het Nederlands verscheen als Hoogtekoorts, het raadselachtige verlangen naar de hoogste top. In zijn boek probeert hij ons niet-bergbeklimmers iets te laten begrijpen van de reden dat mensen zo graag omhoog willen.", "note": null, "title": "Heimwee moet je koesteren", "author": "Floortje Dessing", "url": null, "created_at": "2026-04-27T20:12:03.000", "color": 4}, {"id": "kobo-annot-4ad6f9ead6830546", "source": "kobo", "text": "Eric Arnold, een Nederlandse bergbeklimmer die me inzicht gaf in de beweegredenen van iemand die voor zijn passie de gevaren niet uit de weg ging.", "note": null, "title": "Heimwee moet je koesteren", "author": "Floortje Dessing", "url": null, "created_at": "2026-04-27T20:11:10Z", "color": null}, {"id": "kobo-83ed0bca-ddfd-45aa-abd4-0083e7cba34b", "source": "kobo", "text": "Eric Arnold, een Nederlandse bergbeklimmer die me inzicht gaf in de beweegredenen van iemand die voor zijn passie de gevaren niet uit de weg ging.", "note": null, "title": "Heimwee moet je koesteren", "author": "Floortje Dessing", "url": null, "created_at": "2026-04-27T20:11:10.000", "color": 4}, {"id": "kobo-annot-75c2c07a68deea75", "source": "kobo", "text": "Het is geen doodsverlangen, maar wel een soort levensdrift. Voor mij ligt dat in de bergen. En blijkbaar iets dichter naar de rand van het leven toe, wordt voor mij het leven ook steeds mooier.", "note": null, "title": "Heimwee moet je koesteren", "author": "Floortje Dessing", "url": null, "created_at": "2026-04-27T20:08:16Z", "color": null}, {"id": "kobo-24cbcab5-baed-42df-bd4e-20865200f619", "source": "kobo", "text": "Het is geen doodsverlangen, maar wel een soort levensdrift. Voor mij ligt dat in de bergen. En blijkbaar iets dichter naar de rand van het leven toe, wordt voor mij het leven ook steeds mooier.", "note": null, "title": "Heimwee moet je koesteren", "author": "Floortje Dessing", "url": null, "created_at": "2026-04-27T20:08:16.000", "color": 4}, {"id": "kobo-annot-e8ed41417b2db3a9", "source": "kobo", "text": "legendarische zenmeester Kobo Daishi,", "note": null, "title": "Heimwee moet je koesteren", "author": "Floortje Dessing", "url": null, "created_at": "2026-04-26T20:57:53Z", "color": null}, {"id": "kobo-b5840c3b-082f-4218-8b24-0ef3157af8b3", "source": "kobo", "text": "legendarische zenmeester Kobo Daishi,", "note": null, "title": "Heimwee moet je koesteren", "author": "Floortje Dessing", "url": null, "created_at": "2026-04-26T20:57:53.000", "color": 4}, {"id": "kobo-annot-ad1e981c5fe9b19f", "source": "kobo", "text": "Ik kan me vergissen, maar ik denk dat er maar weinig mensen zijn die het gegeven van ‘altijd samen’ wel eens tegen het licht houden en zich serieus afvragen of ze niet eens alleen op pad zouden moeten gaan.", "note": null, "title": "Heimwee moet je koesteren", "author": "Floortje Dessing", "url": null, "created_at": "2026-04-26T20:53:34Z", "color": null}, {"id": "kobo-b7852663-f81a-43eb-a553-99b01a63281f", "source": "kobo", "text": "Ik kan me vergissen, maar ik denk dat er maar weinig mensen zijn die het gegeven van ‘altijd samen’ wel eens tegen het licht houden en zich serieus afvragen of ze niet eens alleen op pad zouden moeten gaan.", "note": null, "title": "Heimwee moet je koesteren", "author": "Floortje Dessing", "url": null, "created_at": "2026-04-26T20:53:34.000", "color": 4}, {"id": "kobo-annot-51e384ddf38eb689", "source": "kobo", "text": "Het geheim is natuurlijk dat je van dingen afscheid moet durven nemen, omdat er anders niets nieuws gebeurt. Dat deden al die mensen aan het einde van de wereld die ik sprak voor mijn programma ook. Die durfden dingen af te sluiten om vervolgens aan een nieuw hoofdstuk te beginnen. Die simpele wetenschap is eigenlijk de sleutel naar verandering.", "note": null, "title": "Heimwee moet je koesteren", "author": "Floortje Dessing", "url": null, "created_at": "2026-04-26T20:44:52Z", "color": null}, {"id": "kobo-60015d31-018c-4e7a-8431-a086e40aef69", "source": "kobo", "text": "Het geheim is natuurlijk dat je van dingen afscheid moet durven nemen, omdat er anders niets nieuws gebeurt. Dat deden al die mensen aan het einde van de wereld die ik sprak voor mijn programma ook. Die durfden dingen af te sluiten om vervolgens aan een nieuw hoofdstuk te beginnen. Die simpele wetenschap is eigenlijk de sleutel naar verandering.", "note": null, "title": "Heimwee moet je koesteren", "author": "Floortje Dessing", "url": null, "created_at": "2026-04-26T20:44:52.000", "color": 4}, {"id": "kobo-annot-f10b50e5216242ae", "source": "kobo", "text": "Die pijn werd veroorzaakt doordat mensen niet langer energie kregen van hun werk of er zelfs stress van kregen. Het kon ook dat ze niet langer voldoening haalden uit het leven dat ze leidden door de plek waar ze woonden of uit de relatie die ze hadden.", "note": null, "title": "Heimwee moet je koesteren", "author": "Floortje Dessing", "url": null, "created_at": "2026-04-26T20:38:26Z", "color": null}, {"id": "kobo-64dde433-9d4e-4e5e-990b-0483528b3cb5", "source": "kobo", "text": "Die pijn werd veroorzaakt doordat mensen niet langer energie kregen van hun werk of er zelfs stress van kregen. Het kon ook dat ze niet langer voldoening haalden uit het leven dat ze leidden door de plek waar ze woonden of uit de relatie die ze hadden.", "note": null, "title": "Heimwee moet je koesteren", "author": "Floortje Dessing", "url": null, "created_at": "2026-04-26T20:38:26.000", "color": 4}, {"id": "kobo-annot-646ff1dac0f99d48", "source": "kobo", "text": "Het tweede element dat er vervolgens bij kwam, was een soort sluimerende pijn. Meestal was die niet scherp of heftig, maar meer een soort steentje in je schoen waar je prima mee kon blijven rondlopen,", "note": null, "title": "Heimwee moet je koesteren", "author": "Floortje Dessing", "url": null, "created_at": "2026-04-26T20:38:01Z", "color": null}, {"id": "kobo-7e7bc08e-ff67-4492-9cdf-eec9981358a0", "source": "kobo", "text": "Het tweede element dat er vervolgens bij kwam, was een soort sluimerende pijn. Meestal was die niet scherp of heftig, maar meer een soort steentje in je schoen waar je prima mee kon blijven rondlopen,", "note": null, "title": "Heimwee moet je koesteren", "author": "Floortje Dessing", "url": null, "created_at": "2026-04-26T20:38:01.000", "color": 4}, {"id": "kobo-annot-9d9b4c3e6069baab", "source": "kobo", "text": ", om te achterhalen hoe ze dat mentaal hebben aangepakt. Zo kwam ik erachter dat het bij de meeste mensen vaak begon met een sluimerend verlangen dat ze al jaren voelden.", "note": null, "title": "Heimwee moet je koesteren", "author": "Floortje Dessing", "url": null, "created_at": "2026-04-26T20:37:22Z", "color": null}, {"id": "kobo-7208a221-a878-425b-b88c-23c0daeae3bd", "source": "kobo", "text": ", om te achterhalen hoe ze dat mentaal hebben aangepakt. Zo kwam ik erachter dat het bij de meeste mensen vaak begon met een sluimerend verlangen dat ze al jaren voelden.", "note": null, "title": "Heimwee moet je koesteren", "author": "Floortje Dessing", "url": null, "created_at": "2026-04-26T20:37:22.000", "color": 4}, {"id": "insta-26898079", "source": "instapaper", "text": "You wake up in a 3rd world jail cell. You’re only allowed to call one person you know to get you out of there. Who do you call", "note": null, "title": "High Agency in 30 Minutes - George Mack", "author": null, "url": "https://www.highagency.com", "created_at": "2026-04-25T10:53:45", "color": null}, {"id": "insta-26898078", "source": "instapaper", "text": "High agency is one of those “I know it when I see it” ideas. And once you see it – you can’t unsee it. Before I explain it, let’s see it", "note": null, "title": "High Agency in 30 Minutes - George Mack", "author": null, "url": "https://www.highagency.com", "created_at": "2026-04-25T10:53:34", "color": null}, {"id": "kobo-annot-3669b9af7a650c43", "source": "kobo", "text": ": zo lang als ik me kan herinneren heb ik een zwak voor afgelegen eilanden.", "note": null, "title": "Heimwee moet je koesteren", "author": "Floortje Dessing", "url": null, "created_at": "2026-04-23T21:02:33Z", "color": null}, {"id": "kobo-2fdd5b0b-7041-4bce-82f7-ec37f7e2c28b", "source": "kobo", "text": ": zo lang als ik me kan herinneren heb ik een zwak voor afgelegen eilanden.", "note": null, "title": "Heimwee moet je koesteren", "author": "Floortje Dessing", "url": null, "created_at": "2026-04-23T21:02:33.000", "color": 4}, {"id": "kobo-annot-5bdf77e7ce9cb67a", "source": "kobo", "text": "de Kerguelen,", "note": null, "title": "Heimwee moet je koesteren", "author": "Floortje Dessing", "url": null, "created_at": "2026-04-23T21:01:35Z", "color": null}, {"id": "kobo-66f52597-f249-453c-bef9-e2759761d889", "source": "kobo", "text": "de Kerguelen,", "note": null, "title": "Heimwee moet je koesteren", "author": "Floortje Dessing", "url": null, "created_at": "2026-04-23T21:01:35.000", "color": 4}, {"id": "kobo-annot-d2e93f29330de561", "source": "kobo", "text": "Hij keek me glimlachend aan. ‘Dan heb je de juiste keuzes gemaakt. Je hebt het beest in de ogen gekeken, hem erkend en vervolgens de rug toegekeerd. Uit het boekje.’", "note": null, "title": "Heimwee moet je koesteren", "author": "Floortje Dessing", "url": null, "created_at": "2026-04-23T21:00:09Z", "color": null}, {"id": "kobo-dd7d5200-5d6c-4fde-877e-8c22063de777", "source": "kobo", "text": "Hij keek me glimlachend aan. ‘Dan heb je de juiste keuzes gemaakt. Je hebt het beest in de ogen gekeken, hem erkend en vervolgens de rug toegekeerd. Uit het boekje.’", "note": null, "title": "Heimwee moet je koesteren", "author": "Floortje Dessing", "url": null, "created_at": "2026-04-23T21:00:09.000", "color": 4}, {"id": "kobo-annot-78ba2c26922a184f", "source": "kobo", "text": "Als je in een moeilijke situatie terechtkomt, beeld je dan in dat je in een snelstromende rivier valt,’ vertelde een van de instructeurs die me voor vertrek een ontvoeringstraining gaf. ‘Probeer niet tegen de rivier in te zwemmen, maar ga op je rug liggen en probeer stroomafwaarts mee te drijven. Dat betekent niet dat je weerloos bent, maar je moet ervoor zorgen dat je je geest rustig houdt en geen plaats maakt voor angst. Die angst beneemt je niet alleen het zicht op een goede oplossing, maar heeft ook geen nut. Angst is gezond om scherp te blijven en eventueel te kunnen ontsnappen aan gevaar, maar in een situatie als deze help je jezelf alleen maar door een oase van rust in je hoofd te creëren. Hoe moeilijk dat ook lijkt. Daar is angst niet tegen bestand: rust en acceptatie van de situatie.’", "note": null, "title": "Heimwee moet je koesteren", "author": "Floortje Dessing", "url": null, "created_at": "2026-04-23T20:55:42Z", "color": null}, {"id": "kobo-a250be28-06ea-4009-adbc-bff71e1ff1b9", "source": "kobo", "text": "Als je in een moeilijke situatie terechtkomt, beeld je dan in dat je in een snelstromende rivier valt,’ vertelde een van de instructeurs die me voor vertrek een ontvoeringstraining gaf. ‘Probeer niet tegen de rivier in te zwemmen, maar ga op je rug liggen en probeer stroomafwaarts mee te drijven. Dat betekent niet dat je weerloos bent, maar je moet ervoor zorgen dat je je geest rustig houdt en geen plaats maakt voor angst. Die angst beneemt je niet alleen het zicht op een goede oplossing, maar heeft ook geen nut. Angst is gezond om scherp te blijven en eventueel te kunnen ontsnappen aan gevaar, maar in een situatie als deze help je jezelf alleen maar door een oase van rust in je hoofd te creëren. Hoe moeilijk dat ook lijkt. Daar is angst niet tegen bestand: rust en acceptatie van de situatie.’", "note": null, "title": "Heimwee moet je koesteren", "author": "Floortje Dessing", "url": null, "created_at": "2026-04-23T20:55:42.000", "color": 4}, {"id": "kobo-annot-a4612a67ea5c68f9", "source": "kobo", "text": "Psycholoog Joseph Mikels zegt op maxvandaag.nl1 dat je voor complexe besluiten die snel gemaakt moeten worden beter kunt afgaan op je gevoel en voor simpelere dingen beter je ratio kunt gebruiken. Het onderbewustzijn kan heel veel complexe factoren tegelijk aan, iets wat het rationele denkvermogen een stuk minder goed kan.", "note": null, "title": "Heimwee moet je koesteren", "author": "Floortje Dessing", "url": null, "created_at": "2026-04-22T20:51:27Z", "color": null}, {"id": "kobo-16b678c5-aa3c-49b4-84c9-228773283889", "source": "kobo", "text": "Psycholoog Joseph Mikels zegt op maxvandaag.nl1 dat je voor complexe besluiten die snel gemaakt moeten worden beter kunt afgaan op je gevoel en voor simpelere dingen beter je ratio kunt gebruiken. Het onderbewustzijn kan heel veel complexe factoren tegelijk aan, iets wat het rationele denkvermogen een stuk minder goed kan.", "note": null, "title": "Heimwee moet je koesteren", "author": "Floortje Dessing", "url": null, "created_at": "2026-04-22T20:51:27.000", "color": 4}, {"id": "kobo-annot-9ed820440e0a461d", "source": "kobo", "text": "via nederlandwereldwijd.nl. Die kunnen je in heel veel gevallen goed helpen met allerhande vragen en adviezen.", "note": null, "title": "Heimwee moet je koesteren", "author": "Floortje Dessing", "url": null, "created_at": "2026-04-21T20:35:21Z", "color": null}, {"id": "kobo-bdd899e0-3f75-4592-86b4-32ef5a31de73", "source": "kobo", "text": "via nederlandwereldwijd.nl. Die kunnen je in heel veel gevallen goed helpen met allerhande vragen en adviezen.", "note": null, "title": "Heimwee moet je koesteren", "author": "Floortje Dessing", "url": null, "created_at": "2026-04-21T20:35:21.000", "color": 4}, {"id": "kobo-annot-e6fed8c262ec40f8", "source": "kobo", "text": "Koop die spullen, leg ze ergens in je voorraadkast en ga gewoon door met je leven. Geniet van een lekkere maaltijd, maak een lange wandeling door de natuur, drink met je vrienden een fles wijn en maak plannen voor later. Leef je leven en stap regelmatig uit je comfortzone. Blijf zo nieuwsgierig mogelijk en leer je hele leven nieuwe dingen. En met een beetje voorbereiding, en een dosis (aangeleerde) zelfredzaamheid, kun je dat leven aardig lang volhouden als het plotseling toch anders loopt.", "note": null, "title": "Heimwee moet je koesteren", "author": "Floortje Dessing", "url": null, "created_at": "2026-04-19T20:01:44Z", "color": null}, {"id": "kobo-2cdc3eb5-bab7-4a0a-8c9b-f7ab6c8145c6", "source": "kobo", "text": "Koop die spullen, leg ze ergens in je voorraadkast en ga gewoon door met je leven. Geniet van een lekkere maaltijd, maak een lange wandeling door de natuur, drink met je vrienden een fles wijn en maak plannen voor later. Leef je leven en stap regelmatig uit je comfortzone. Blijf zo nieuwsgierig mogelijk en leer je hele leven nieuwe dingen. En met een beetje voorbereiding, en een dosis (aangeleerde) zelfredzaamheid, kun je dat leven aardig lang volhouden als het plotseling toch anders loopt.", "note": null, "title": "Heimwee moet je koesteren", "author": "Floortje Dessing", "url": null, "created_at": "2026-04-19T20:01:44.000", "color": 4}, {"id": "kobo-annot-438e6f0bc1d212dc", "source": "kobo", "text": "Zolang ik me kan herinneren heb ik al een zwak voor eilanden. Als kind kon ik eindeloos over de wereldkaart gebogen zitten en alle kleine stipjes bestuderen.", "note": null, "title": "Heimwee moet je koesteren", "author": "Floortje Dessing", "url": null, "created_at": "2026-04-19T20:01:35Z", "color": null}, {"id": "kobo-500784a1-8702-43e5-ab82-9fc32e52acee", "source": "kobo", "text": "Zolang ik me kan herinneren heb ik al een zwak voor eilanden. Als kind kon ik eindeloos over de wereldkaart gebogen zitten en alle kleine stipjes bestuderen.", "note": null, "title": "Heimwee moet je koesteren", "author": "Floortje Dessing", "url": null, "created_at": "2026-04-19T20:01:35.000", "color": 4}, {"id": "kobo-annot-bb8c46f7ccf935f4", "source": "kobo", "text": ". Het zou heel mooi zijn als het onderwijspakket uitgebreid wordt met leerstof waar je als mens later wat aan hebt in de praktijk. Echt goede kennis over de productie van ons voedsel bijvoorbeeld, met praktijklessen in de buitenlucht. Daar heb je later zó veel aan. En kennis die betrekking heeft op zelfredzaamheid: een goede EHBO-cursus bijvoorbeeld, of een cursus zelfverdediging. We kunnen kinderen leren hoe ze zaken zelf kunnen repareren, of hoe ze aan de wolken kunnen zien wat voor weer het wordt. Of, nog verder door fantaserend, lessen in mindfulness om beter bestand te zijn tegen de onverwachte afslagen die het leven soms neemt.", "note": null, "title": "Heimwee moet je koesteren", "author": "Floortje Dessing", "url": null, "created_at": "2026-04-17T21:11:11Z", "color": null}, {"id": "kobo-cead5dcc-e438-4cf0-a4ce-689d6f12abf0", "source": "kobo", "text": ". Het zou heel mooi zijn als het onderwijspakket uitgebreid wordt met leerstof waar je als mens later wat aan hebt in de praktijk. Echt goede kennis over de productie van ons voedsel bijvoorbeeld, met praktijklessen in de buitenlucht. Daar heb je later zó veel aan. En kennis die betrekking heeft op zelfredzaamheid: een goede EHBO-cursus bijvoorbeeld, of een cursus zelfverdediging. We kunnen kinderen leren hoe ze zaken zelf kunnen repareren, of hoe ze aan de wolken kunnen zien wat voor weer het wordt. Of, nog verder door fantaserend, lessen in mindfulness om beter bestand te zijn tegen de onverwachte afslagen die het leven soms neemt.", "note": null, "title": "Heimwee moet je koesteren", "author": "Floortje Dessing", "url": null, "created_at": "2026-04-17T21:11:11.000", "color": 4}, {"id": "kobo-annot-9982ad8c035603c8", "source": "kobo", "text": "En heel belangrijk voor mij: het was een school waar enorm veel verhalen werden verteld. Over de aarde, de sterren, de mens en onze geschiedenis. Over verre volkeren en onbekende landen, maar ook sprookjes, mythen en sagen. Alles om de fantasie van het kind te ontwikkelen en de leerstof op een beeldende manier aan te bieden.", "note": null, "title": "Heimwee moet je koesteren", "author": "Floortje Dessing", "url": null, "created_at": "2026-04-13T20:31:42Z", "color": null}, {"id": "kobo-95ac2f4e-ac0b-4232-bc1d-9ceedfd156b7", "source": "kobo", "text": "En heel belangrijk voor mij: het was een school waar enorm veel verhalen werden verteld. Over de aarde, de sterren, de mens en onze geschiedenis. Over verre volkeren en onbekende landen, maar ook sprookjes, mythen en sagen. Alles om de fantasie van het kind te ontwikkelen en de leerstof op een beeldende manier aan te bieden.", "note": null, "title": "Heimwee moet je koesteren", "author": "Floortje Dessing", "url": null, "created_at": "2026-04-13T20:31:42.000", "color": 4}, {"id": "kobo-annot-0674c463694206d3", "source": "kobo", "text": "Any man who asks for greater authority does not deserve to have it.", "note": null, "title": "Dune: Legends, Heroes, Schools: (The Butlerian Jihad, The Machine Crusade, The Battle of Corrin, Paul of Dune, The Winds of Dune, Sisterhood of Dune, Mentats of Dune, Navigators of Dune)", "author": "Brian Herbert", "url": null, "created_at": "2026-04-05T20:59:57Z", "color": null}, {"id": "kobo-72705124-0c99-4ba1-ab35-4713f9417e54", "source": "kobo", "text": "Any man who asks for greater authority does not deserve to have it.", "note": null, "title": "Dune: Legends, Heroes, Schools: (The Butlerian Jihad, The Machine Crusade, The Battle of Corrin, Paul of Dune, The Winds of Dune, Sisterhood of Dune, Mentats of Dune, Navigators of Dune)", "author": "Brian Herbert", "url": null, "created_at": "2026-04-05T20:59:57.000", "color": 4}, {"id": "kobo-annot-331d2e0811da34ee", "source": "kobo", "text": "It seems like _________ is valuable to you. It seems like you don’t like _________. It seems like you value __________. It seems like _________ makes it easier. It seems like you’re reluctant to _________.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-20T22:18:08Z", "color": null}, {"id": "kobo-279f909c-8628-4029-80cd-39ab24bd3dfa", "source": "kobo", "text": "It seems like _________ is valuable to you.\n It seems like you don’t like _________.\n It seems like you value __________.\n It seems like _________ makes it easier.\n It seems like you’re reluctant to _________.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-20T22:18:08.528", "color": 4}, {"id": "kobo-annot-58d21ef04428bf39", "source": "kobo", "text": "I tell my clients that as part of their preparation they should think about the outcome extremes: best and worst. If you’ve got both ends covered, you’ll be ready for anything. So know what you cannot accept and have an idea about the best-case outcome,", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-19T21:28:28Z", "color": null}, {"id": "kobo-c29fc19e-6af2-48ac-a8d2-26a0b683e0a3", "source": "kobo", "text": "I tell my clients that as part of their preparation they should think about the outcome extremes: best and worst. If you’ve got both ends covered, you’ll be ready for anything. So know what you cannot accept and have an idea about the best-case outcome,", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-19T21:28:28.824", "color": 4}, {"id": "kobo-annot-ca7c4073a132828e", "source": "kobo", "text": "Remember, never be so sure of what you want that you wouldn’t take something better. Once you’ve got flexibility in the forefront of your mind you come into a negotiation with a winning mindset.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-19T21:28:02Z", "color": null}, {"id": "kobo-3cf23345-ff9a-4eb7-a425-abe1b7e3b6c8", "source": "kobo", "text": "Remember, never be so sure of what you want that you wouldn’t take something better. Once you’ve got flexibility in the forefront of your mind you come into a negotiation with a winning mindset.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-19T21:28:02.884", "color": 4}, {"id": "kobo-annot-b7161b7cfb0018a9", "source": "kobo", "text": "God knows aiming low is seductive. Self-esteem is a huge factor in negotiation, and many people set modest goals to protect it. It’s easier to claim victory when you aim low.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-19T21:26:12Z", "color": null}, {"id": "kobo-59bf191f-c037-4a20-ba26-2f3bc2a66a8d", "source": "kobo", "text": "God knows aiming low is seductive. Self-esteem is a huge factor in negotiation, and many people set modest goals to protect it. It’s easier to claim victory when you aim low.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-19T21:26:12.705", "color": 4}, {"id": "kobo-annot-7a568760be1f4c10", "source": "kobo", "text": "When the pressure is on, you don’t rise to the occasion—you fall to your highest level of preparation.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-19T21:19:31Z", "color": null}, {"id": "kobo-88dd5fd0-8e4b-4be9-a476-765ab6c53e76", "source": "kobo", "text": "When the pressure is on, you don’t rise to the occasion—you fall to your highest level of preparation.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-19T21:19:31.943", "color": 4}, {"id": "kobo-annot-c0c00dfd781ab691", "source": "kobo", "text": "■Let what you know—your known knowns—guide you but not blind you. Every case is new, so remain flexible and adaptable. Remember the Griffin bank crisis: no hostage-taker had killed a hostage on deadline, until he did.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-17T21:58:45Z", "color": null}, {"id": "kobo-17ee4424-eeb8-4194-83fc-e7bf9348ba0a", "source": "kobo", "text": "■Let what you know—your known knowns—guide you but not blind you. Every case is new, so remain flexible and adaptable. Remember the Griffin bank crisis: no hostage-taker had killed a hostage on deadline, until he did.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-17T21:58:45.249", "color": 4}, {"id": "kobo-annot-9b192d8a74828bc8", "source": "kobo", "text": "When you ask calibrated questions, yes, you are leading your counterpart to your goals. But you are also leading them to examine and articulate what they want and why and how they can achieve it. You are demanding creativity of them, and therefore pushing them toward a collaborative solution.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-17T21:55:50Z", "color": null}, {"id": "kobo-5b072ba8-7958-4ba7-b4e5-9b21bfce682e", "source": "kobo", "text": "When you ask calibrated questions, yes, you are leading your counterpart to your goals. But you are also leading them to examine and articulate what they want and why and how they can achieve it. You are demanding creativity of them, and therefore pushing them toward a collaborative solution.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-17T21:55:50.219", "color": 4}, {"id": "kobo-annot-41b382f8c5d94274", "source": "kobo", "text": "You’re going to have to embrace regular, thoughtful conflict as the basis of effective negotiation—and of life. Please remember that our emphasis throughout the book is that the adversary is the situation and that the person that you appear to be in conflict with is actually your partner.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-17T21:54:05Z", "color": null}, {"id": "kobo-a182530b-35bc-4500-990e-c0a49c55d7c4", "source": "kobo", "text": "You’re going to have to embrace regular, thoughtful conflict as the basis of effective negotiation—and of life. Please remember that our emphasis throughout the book is that the adversary is the situation and that the person that you appear to be in conflict with is actually your partner.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-17T21:54:05.183", "color": 4}, {"id": "kobo-annot-a4623da59316df2e", "source": "kobo", "text": "While you have to get face time, formal business meetings, structured encounters, and planned negotiating sessions are often the least revealing kinds of face time because these are the moments when people are at their most guarded.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-17T21:40:56Z", "color": null}, {"id": "kobo-77d215c6-5757-4a1a-86f3-deeb2dd185cf", "source": "kobo", "text": "While you have to get face time, formal business meetings, structured encounters, and planned negotiating sessions are often the least revealing kinds of face time because these are the moments when people are at their most guarded.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-17T21:40:56.316", "color": 4}, {"id": "kobo-annot-1a179e157cd89413", "source": "kobo", "text": ". So we told him to send a version of our classic email for nonresponders, the one that always works: “Have you given up on finalizing this deal this year?”", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-16T21:44:15Z", "color": null}, {"id": "kobo-38919ac8-e580-45a2-8685-6fdab47ee6d0", "source": "kobo", "text": ". So we told him to send a version of our classic email for nonresponders, the one that always works: “Have you given up on finalizing this deal this year?”", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-16T21:44:15.000", "color": 4}, {"id": "kobo-annot-6c1652b3f309f549", "source": "kobo", "text": "The clear point here is that people operating with incomplete information appear crazy to those who have different information. Your job when faced with someone like this in a negotiation is to discover what they do not know and supply that information.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-16T21:42:15Z", "color": null}, {"id": "kobo-1e8a0d87-54be-4d73-bd43-4f675097430c", "source": "kobo", "text": "The clear point here is that people operating with incomplete information appear crazy to those who have different information. Your job when faced with someone like this in a negotiation is to discover what they do not know and supply that information.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-16T21:42:15.000", "color": 4}, {"id": "kobo-annot-5665f144f08b5c2d", "source": "kobo", "text": "But the moment when we’re most ready to throw our hands up and declare “They’re crazy!” is often the best moment for discovering Black Swans that transform a negotiation. It is when we hear or see something that doesn’t make sense—something “crazy”—that a crucial fork in the road is presented: push forward, even more forcefully, into that which we initially can’t process; or take the other path, the one to guaranteed failure, in which we tell ourselves that negotiating was useless anyway.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-16T21:39:06Z", "color": null}, {"id": "kobo-3413b2f9-e668-47b1-8503-184c6809f5b2", "source": "kobo", "text": "But the moment when we’re most ready to throw our hands up and declare “They’re crazy!” is often the best moment for discovering Black Swans that transform a negotiation. It is when we hear or see something that doesn’t make sense—something “crazy”—that a crucial fork in the road is presented: push forward, even more forcefully, into that which we initially can’t process; or take the other path, the one to guaranteed failure, in which we tell ourselves that negotiating was useless anyway.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-16T21:39:06.000", "color": 4}, {"id": "kobo-annot-6fad981fddd10c7a", "source": "kobo", "text": "Research studies have shown that people respond favorably to requests made in a reasonable tone of voice and followed with a “because” reason.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-16T21:29:22Z", "color": null}, {"id": "kobo-d621c1ca-677f-46ab-ae32-52f467ce8f7b", "source": "kobo", "text": "Research studies have shown that people respond favorably to requests made in a reasonable tone of voice and followed with a “because” reason.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-16T21:29:22.000", "color": 4}, {"id": "kobo-annot-27cc1dbe41d443de", "source": "kobo", "text": "But when someone displays a passion for what we’ve always wanted and conveys a purposeful plan of how to get there, we allow our perceptions of what’s possible to change. We’re all hungry for a map to joy, and when someone is courageous enough to draw it for us, we naturally follow.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-16T21:27:38Z", "color": null}, {"id": "kobo-43fc118b-c275-45ff-b945-bb29fd10b3ba", "source": "kobo", "text": "But when someone displays a passion for what we’ve always wanted and conveys a purposeful plan of how to get there, we allow our perceptions of what’s possible to change. We’re all hungry for a map to joy, and when someone is courageous enough to draw it for us, we naturally follow.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-16T21:27:38.000", "color": 4}, {"id": "kobo-annot-14b6d6ec864468f9", "source": "kobo", "text": "People trust those who are in their in-group. Belonging is a primal instinct. And if you can trigger that instinct, that sense that, “Oh, we see the world the same way,” then you immediately gain influence.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-16T21:22:29Z", "color": null}, {"id": "kobo-667e95c9-2467-46bb-9738-f8dccb5e4a64", "source": "kobo", "text": "People trust those who are in their in-group. Belonging is a primal instinct. And if you can trigger that instinct, that sense that, “Oh, we see the world the same way,” then you immediately gain influence.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-16T21:22:29.000", "color": 4}, {"id
