ful word in negotiations is “Fair.” As human beings, we’re mightily swayed by how much we feel we have been respected. People comply with agreements if they feel they’ve been treated fairly and lash out if they don’t.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-28T11:47:50.000", "color": 4}, {"id": "kobo-annot-a5bebbbfec3a01d9", "source": "kobo", "text": "In other words, while we may use logic to reason ourselves toward a decision, the actual decision making is governed by emotion.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-28T11:42:30Z", "color": null}, {"id": "kobo-4c705282-d6e0-4d83-aa30-fb5784218b81", "source": "kobo", "text": "In other words, while we may use logic to reason ourselves toward a decision, the actual decision making is governed by emotion.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-28T11:42:30.000", "color": 4}, {"id": "kobo-annot-e66e5363ae45220a", "source": "kobo", "text": "This rocks my students’ view of themselves as rational actors. But they’re not. None of us are. We’re all irrational, all emotional. Emotion is a necessary element to decision making that we ignore at our own peril. Realizing that hits people hard between the eyes.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-28T11:41:41Z", "color": null}, {"id": "kobo-5dd574aa-45a7-4def-af1f-955eed77fba0", "source": "kobo", "text": "This rocks my students’ view of themselves as rational actors. But they’re not. None of us are. We’re all irrational, all emotional. Emotion is a necessary element to decision making that we ignore at our own peril. Realizing that hits people hard between the eyes.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-28T11:41:41.000", "color": 4}, {"id": "kobo-annot-5b4517b21f557629", "source": "kobo", "text": "If you approach a negotiation thinking that the other guy thinks like you, you’re wrong,” I say. “That’s not empathy; that’s projection.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-28T11:40:31Z", "color": null}, {"id": "kobo-4628aaa7-2bca-4b83-aaa3-d5cfacd067d9", "source": "kobo", "text": "If you approach a negotiation thinking that the other guy thinks like you, you’re wrong,” I say. “That’s not empathy; that’s projection.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-28T11:40:31.000", "color": 4}, {"id": "kobo-annot-8e29fd1a5c5b2b18", "source": "kobo", "text": "Moore discovered that when negotiators tell their counterparts about their deadline, they get better deals. It’s true. First, by revealing your cutoff you reduce the risk of impasse. And second, when an opponent knows your deadline, he’ll get to the real deal- and concession-making more quickly.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-28T11:35:40Z", "color": null}, {"id": "kobo-179e891b-c77b-478b-90c6-18b0770ebd76", "source": "kobo", "text": "Moore discovered that when negotiators tell their counterparts about their deadline, they get better deals. It’s true. First, by revealing your cutoff you reduce the risk of impasse. And second, when an opponent knows your deadline, he’ll get to the real deal- and concession-making more quickly.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-28T11:35:40.000", "color": 4}, {"id": "kobo-annot-b74e001624112abb", "source": "kobo", "text": "Allow me to let you in on a little secret: Cohen, and the herd of negotiation “experts” who follow his lead, are wrong. Deadlines cut both ways. Cohen may well have been nervous about what his boss would say if he left Japan without an agreement. But it’s also true that Cohen’s counterparts wouldn’t have won if he’d left without a deal. That’s the key: When the negotiation is over for one side, it’s over for the other too.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-28T11:33:13Z", "color": null}, {"id": "kobo-e12ec8f1-703e-49f0-88ef-b5747c9718e4", "source": "kobo", "text": "Allow me to let you in on a little secret: Cohen, and the herd of negotiation “experts” who follow his lead, are wrong. Deadlines cut both ways. Cohen may well have been nervous about what his boss would say if he left Japan without an agreement. But it’s also true that Cohen’s counterparts wouldn’t have won if he’d left without a deal. That’s the key: When the negotiation is over for one side, it’s over for the other too.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-28T11:33:13.000", "color": 4}, {"id": "kobo-annot-df0c9511efe0de32", "source": "kobo", "text": "It’s not just with hostage negotiations that deadlines can play into your hands. Car dealers are prone to give you the best price near the end of the month, when their transactions are assessed. And corporate salespeople work on a quarterly basis and are most vulnerable as the quarter comes to a close.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-28T11:30:42Z", "color": null}, {"id": "kobo-c25faf5c-ac97-4e0e-81d2-8804a7c09f04", "source": "kobo", "text": "It’s not just with hostage negotiations that deadlines can play into your hands. Car dealers are prone to give you the best price near the end of the month, when their transactions are assessed. And corporate salespeople work on a quarterly basis and are most vulnerable as the quarter comes to a close.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-28T11:30:42.000", "color": 4}, {"id": "kobo-annot-8275d298bea7c81b", "source": "kobo", "text": "Increasing specificity on threats in any type of negotiations indicates getting closer to real consequences at a real specified time. To gauge the level of a particular threat, we’d pay attention to how many of the four questions—What? Who? When? And how?—were addressed. When people issue threats, they consciously or subconsciously create ambiguities and loopholes they fully intend to exploit.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-28T11:29:15Z", "color": null}, {"id": "kobo-830e458d-2e8e-4af5-8245-a775de057257", "source": "kobo", "text": "Increasing specificity on threats in any type of negotiations indicates getting closer to real consequences at a real specified time. To gauge the level of a particular threat, we’d pay attention to how many of the four questions—What? Who? When? And how?—were addressed. When people issue threats, they consciously or subconsciously create ambiguities and loopholes they fully intend to exploit.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-28T11:29:15.000", "color": 4}, {"id": "kobo-annot-0623b22af82b9f2d", "source": "kobo", "text": "No deal is better than a bad deal.”", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-28T11:26:36Z", "color": null}, {"id": "kobo-5f938eae-0ddd-4423-bd8f-cec6dcdbfe2d", "source": "kobo", "text": "No deal is better than a bad deal.”", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-28T11:26:36.000", "color": 4}, {"id": "kobo-annot-51f8f06a46ec3a23", "source": "kobo", "text": "What is it about a deadline that causes pressure and anxiety? The answer is consequences; the perception of the loss we’ll incur in the future—“The deal is off!” our mind screams at us in some imaginary future scenario—should no resolution be achieved by a certain point in time.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-28T11:24:16Z", "color": null}, {"id": "kobo-066ca7b6-4778-44bc-9af4-3630ba4a9cf0", "source": "kobo", "text": "What is it about a deadline that causes pressure and anxiety? The answer is consequences; the perception of the loss we’ll incur in the future—“The deal is off!” our mind screams at us in some imaginary future scenario—should no resolution be achieved by a certain point in time.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-28T11:24:16.000", "color": 4}, {"id": "kobo-annot-3c17f8bde25cd7f0", "source": "kobo", "text": "I’m here to call bullshit on compromise right now. We don’t compromise because it’s right; we compromise because it is easy and because it saves face. We compromise in order to say that at least we got half the pie. Distilled to its essence, we compromise to be safe. Most people in a negotiation are driven by fear or by the desire to avoid pain. Too few are driven by their actual goals.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-28T11:21:49Z", "color": null}, {"id": "kobo-197c5376-2e03-435d-8343-62e341191be2", "source": "kobo", "text": "I’m here to call bullshit on compromise right now. We don’t compromise because it’s right; we compromise because it is easy and because it saves face. We compromise in order to say that at least we got half the pie. Distilled to its essence, we compromise to be safe. Most people in a negotiation are driven by fear or by the desire to avoid pain. Too few are driven by their actual goals.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-28T11:21:49.000", "color": 4}, {"id": "kobo-annot-e7162329f187bbfb", "source": "kobo", "text": "The real problem with compromise is that it has come to be known as this great concept, in relationships and politics and everything else. Compromise, we are told quite simply, is a sacred moral good.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-28T11:20:50Z", "color": null}, {"id": "kobo-00237ca2-c0c5-409e-a732-186cd9a99cc4", "source": "kobo", "text": "The real problem with compromise is that it has come to be known as this great concept, in relationships and politics and everything else. Compromise, we are told quite simply, is a sacred moral good.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-28T11:20:50.000", "color": 4}, {"id": "kobo-annot-104d3e4d01125b6e", "source": "kobo", "text": "To make my point on compromise, let me paint you an example: A woman wants her husband to wear black shoes with his suit. But her husband doesn’t want to; he prefers brown shoes. So what do they do? They compromise, they meet halfway. And, you guessed it, he wears one black and one brown shoe. Is this the best outcome? No! In fact, that’s the worst possible outcome. Either of the two other outcomes—black or brown—would be better than the compromise. Next time you want to compromise, remind yourself of those mismatched shoes.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-28T11:19:55Z", "color": null}, {"id": "kobo-fe931e25-f139-4a41-ba5f-5fa3546dcdc4", "source": "kobo", "text": "To make my point on compromise, let me paint you an example: A woman wants her husband to wear black shoes with his suit. But her husband doesn’t want to; he prefers brown shoes. So what do they do? They compromise, they meet halfway. And, you guessed it, he wears one black and one brown shoe. Is this the best outcome? No! In fact, that’s the worst possible outcome. Either of the two other outcomes—black or brown—would be better than the compromise.\n Next time you want to compromise, remind yourself of those mismatched shoes.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-28T11:19:55.000", "color": 4}, {"id": "kobo-annot-c6e1ad19fa0f57b1", "source": "kobo", "text": "But you have to get rid of that naïveté. Because compromise—“splitting the difference”—can lead to terrible outcomes. Compromise is often a “bad deal” and a key theme we’ll hit in this chapter is that “no deal is better than a bad deal.”", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-28T11:19:08Z", "color": null}, {"id": "kobo-0256f1d1-9ba0-4636-8045-9cdb9e6aacd7", "source": "kobo", "text": "But you have to get rid of that naïveté. Because compromise—“splitting the difference”—can lead to terrible outcomes. Compromise is often a “bad deal” and a key theme we’ll hit in this chapter is that “no deal is better than a bad deal.”", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-28T11:19:08.000", "color": 4}, {"id": "kobo-annot-d9629f17eebc586a", "source": "kobo", "text": "Use a summary to trigger a “that’s right.” The building blocks of a good summary are a label combined with paraphrasing. Identify, rearticulate, and emotionally affirm “the world according to . . .”", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-28T11:12:30Z", "color": null}, {"id": "kobo-2a11c3a9-83ce-439c-ad91-db76314e73bf", "source": "kobo", "text": "Use a summary to trigger a “that’s right.” The building blocks of a good summary are a label combined with paraphrasing. Identify, rearticulate, and emotionally affirm “the world according to . . .”", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-28T11:12:30.000", "color": 4}, {"id": "kobo-annot-08d154695b5b0501", "source": "kobo", "text": "That’s right” is better than “yes.” Strive for it. Reaching “that’s right” in a negotiation creates breakthroughs.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-28T11:12:20Z", "color": null}, {"id": "kobo-298f6cdb-c32a-4cfd-aacc-a54d64dd720f", "source": "kobo", "text": "That’s right” is better than “yes.” Strive for it. Reaching “that’s right” in a negotiation creates breakthroughs.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-28T11:12:20.000", "color": 4}, {"id": "kobo-annot-dc52cf6afd5e66b1", "source": "kobo", "text": "Creating unconditional positive regard opens the door to changing thoughts and behaviors. Humans have an innate urge toward socially constructive behavior. The more a person feels understood, and positively affirmed in that understanding, the more likely that urge for constructive behavior will take", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-28T11:11:22Z", "color": null}, {"id": "kobo-11671ee5-e74e-4859-bec8-f278be02eda9", "source": "kobo", "text": "Creating unconditional positive regard opens the door to changing thoughts and behaviors. Humans have an innate urge toward socially constructive behavior. The more a person feels understood, and positively affirmed in that understanding, the more likely that urge for constructive behavior will take", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-28T11:11:22.000", "color": 4}, {"id": "kobo-annot-375e22e0106ca5ed", "source": "kobo", "text": "“Sleeping in the same bed and dreaming different dreams” is an old Chinese expression that describes the intimacy of partnership (whether in marriage or in business) without the communication necessary to sustain it.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-27T20:43:58Z", "color": null}, {"id": "kobo-5e5577cd-8350-4cab-afb9-d8c3c57b8b60", "source": "kobo", "text": "“Sleeping in the same bed and dreaming different dreams” is an old Chinese expression that describes the intimacy of partnership (whether in marriage or in business) without the communication necessary to sustain it.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-27T20:43:58.000", "color": 4}, {"id": "kobo-annot-7cb5638444238163", "source": "kobo", "text": "Driving toward “that’s right” is a winning strategy in all negotiations. But hearing “you’re right” is a disaster.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-27T20:21:45Z", "color": null}, {"id": "kobo-a3756d56-83dd-4126-97f1-95c52f2fe447", "source": "kobo", "text": "Driving toward “that’s right” is a winning strategy in all negotiations. But hearing “you’re right” is a disaster.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-27T20:21:45.000", "color": 4}, {"id": "kobo-annot-c58602db613738f4", "source": "kobo", "text": "When your adversaries say, “That’s right,” they feel they have assessed what you’ve said and pronounced it as correct of their own free will. They embrace it.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-27T20:20:09Z", "color": null}, {"id": "kobo-a38d04ae-ba4b-4edd-90b9-334d4b52d82b", "source": "kobo", "text": "When your adversaries say, “That’s right,” they feel they have assessed what you’ve said and pronounced it as correct of their own free will. They embrace it.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-27T20:20:09.000", "color": 4}, {"id": "kobo-annot-04124ebeab669b73", "source": "kobo", "text": "“That’s right” signaled that negotiations could proceed from deadlock. It broke down a barrier that was impeding progress. It created a realization point with our adversary where he actually agreed on a point without the feeling of having given in.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-27T20:19:39Z", "color": null}, {"id": "kobo-2a27ddae-802d-4706-83cf-490603dd1554", "source": "kobo", "text": "“That’s right” signaled that negotiations could proceed from deadlock. It broke down a barrier that was impeding progress. It created a realization point with our adversary where he actually agreed on a point without the feeling of having given in.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-27T20:19:39.000", "color": 4}, {"id": "kobo-annot-2a31dcb7bec80128", "source": "kobo", "text": "This “negotiation” between Benjie and me was no different than any other negotiation between colleagues who disagree on a strategy. Before you convince them to see what you’re trying to accomplish, you have to say the things to them that will get them to say, “That’s right.” The “that’s right” breakthrough usually doesn’t come at the beginning of a negotiation. It’s invisible to the counterpart when it occurs, and they embrace what you’ve said. To them, it’s a subtle epiphany.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-27T20:12:13Z", "color": null}, {"id": "kobo-39bee74d-f12f-4ada-931f-6ffa3b490cbb", "source": "kobo", "text": "This “negotiation” between Benjie and me was no different than any other negotiation between colleagues who disagree on a strategy. Before you convince them to see what you’re trying to accomplish, you have to say the things to them that will get them to say, “That’s right.”\n The “that’s right” breakthrough usually doesn’t come at the beginning of a negotiation. It’s invisible to the counterpart when it occurs, and they embrace what you’ve said. To them, it’s a subtle epiphany.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-27T20:12:13.000", "color": 4}, {"id": "kobo-annot-03624de7c9766c64", "source": "kobo", "text": "As you’ll soon learn, the sweetest two words in any negotiation are actually “That’s right.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-27T19:01:11Z", "color": null}, {"id": "kobo-12d4ce2a-6c2a-4b8e-9a18-e0116cfc2ed0", "source": "kobo", "text": "As you’ll soon learn, the sweetest two words in any negotiation are actually “That’s right.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-27T19:01:11.000", "color": 4}, {"id": "kobo-annot-3e50c6dc96ef8be1", "source": "kobo", "text": "American psychologist Carl Rogers, who proposed that real change can only come when a therapist accepts the client as he or she is—an approach known as unconditional positive regard. The vast majority of us, however, as Rogers explained, come to expect that love, praise, and approval are dependent on saying and doing the things people (initially, our parents) consider correct. That is, because for most of us the positive regard we experience is conditional, we develop a habit of hiding who we really are and what we really think, instead calibrating our words to gain approval but disclosing little.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-26T21:16:27Z", "color": null}, {"id": "kobo-500cd5ac-4d61-413f-8586-2fad5ab959b7", "source": "kobo", "text": "American psychologist Carl Rogers, who proposed that real change can only come when a therapist accepts the client as he or she is—an approach known as unconditional positive regard. The vast majority of us, however, as Rogers explained, come to expect that love, praise, and approval are dependent on saying and doing the things people (initially, our parents) consider correct. That is, because for most of us the positive regard we experience is conditional, we develop a habit of hiding who we really are and what we really think, instead calibrating our words to gain approval but disclosing little.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-26T21:16:27.000", "color": 4}, {"id": "kobo-annot-475ab729e111165f", "source": "kobo", "text": "■Negotiate in their world. Persuasion is not about how bright or smooth or forceful you are. It’s about the other party convincing themselves that the solution you want is their own idea. So don’t beat them with logic or brute force. Ask them questions that open paths to your goals. It’s not about you.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-26T21:12:45Z", "color": null}, {"id": "kobo-f424255f-6825-4e5d-a74e-18751a5e1a06", "source": "kobo", "text": "■Negotiate in their world. Persuasion is not about how bright or smooth or forceful you are. It’s about the other party convincing themselves that the solution you want is their own idea. So don’t beat them with logic or brute force. Ask them questions that open paths to your goals. It’s not about you.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-26T21:12:45.000", "color": 4}, {"id": "kobo-annot-b789aeb06a63836a", "source": "kobo", "text": "Triggering “No” peels away the plastic falsehood of “Yes” and gets you to what’s really at stake.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-26T21:10:48Z", "color": null}, {"id": "kobo-2c5dfc00-edff-44b2-a55b-c4daf0e80cb4", "source": "kobo", "text": "Triggering “No” peels away the plastic falsehood of “Yes” and gets you to what’s really at stake.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-26T21:10:48.000", "color": 4}, {"id": "kobo-annot-2d369ccc97f7bb1a", "source": "kobo", "text": "“No”—or the lack thereof—also serves as a warning, the canary in the coal mine. If despite all your efforts, the other party won’t say “No,” you’re dealing with people who are indecisive or confused or who have a hidden agenda. In cases like that you have to end the negotiation and walk away. Think of it like this: No “No” means no go.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-26T21:05:43Z", "color": null}, {"id": "kobo-df8a4dda-32b6-4fef-a25f-8c476f2ea20a", "source": "kobo", "text": "“No”—or the lack thereof—also serves as a warning, the canary in the coal mine. If despite all your efforts, the other party won’t say “No,” you’re dealing with people who are indecisive or confused or who have a hidden agenda. In cases like that you have to end the negotiation and walk away.\n Think of it like this: No “No” means no go.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-26T21:05:43.000", "color": 4}, {"id": "kobo-annot-87624424837d171b", "source": "kobo", "text": "Today, I coach my students to learn to see “No” for what it is. Rather than harming them or those they negotiate with, “No” protects and benefits all parties in an exchange. “No” creates safety, security, and the feeling of control. It’s a requirement to implementable success. It’s a pause, a nudge, and a chance for the speaker to articulate what they do want.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-26T20:58:30Z", "color": null}, {"id": "kobo-af15ecc3-f3c3-474e-b9ae-598eeef77f2f", "source": "kobo", "text": "Today, I coach my students to learn to see “No” for what it is. Rather than harming them or those they negotiate with, “No” protects and benefits all parties in an exchange. “No” creates safety, security, and the feeling of control. It’s a requirement to implementable success. It’s a pause, a nudge, and a chance for the speaker to articulate what they do want.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-26T20:58:30.000", "color": 4}, {"id": "kobo-annot-1e1fb3329b8b2372", "source": "kobo", "text": "In fact, “No” often opens the discussion up. The sooner you say “No,” the sooner you’re willing to see options and opportunities that you were blind to previously. Saying “No” often spurs people to action because they feel they’ve protected themselves and now see an opportunity slipping away.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-26T20:56:44Z", "color": null}, {"id": "kobo-ad5887fa-77ca-469b-8d67-6375a2799f41", "source": "kobo", "text": "In fact, “No” often opens the discussion up. The sooner you say “No,” the sooner you’re willing to see options and opportunities that you were blind to previously. Saying “No” often spurs people to action because they feel they’ve protected themselves and now see an opportunity slipping away.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-26T20:56:44.000", "color": 4}, {"id": "kobo-annot-578a8c4a1a180db4", "source": "kobo", "text": "Though the intensity may differ from person to person, you can be sure that everyone you meet is driven by two primal urges: the need to feel safe and secure, and the need to feel in control. If you satisfy those drives, you’re in the door.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-26T20:46:58Z", "color": null}, {"id": "kobo-ebfc1143-7174-4002-a554-1327b768ae45", "source": "kobo", "text": "Though the intensity may differ from person to person, you can be sure that everyone you meet is driven by two primal urges: the need to feel safe and secure, and the need to feel in control. If you satisfy those drives, you’re in the door.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-26T20:46:58.000", "color": 4}, {"id": "kobo-annot-ff04108485cdc5b1", "source": "kobo", "text": "Got it, you say. It’s not about me. We need to persuade from their perspective, not ours. But how? By starting with their most basic wants.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-26T20:45:30Z", "color": null}, {"id": "kobo-7494553c-54b1-4e33-a4d4-1c393e9c506c", "source": "kobo", "text": "Got it, you say. It’s not about me. We need to persuade from their perspective, not ours. But how?\n By starting with their most basic wants.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-26T20:45:30.000", "color": 4}, {"id": "kobo-annot-0f2905cdb0a5cc2e", "source": "kobo", "text": "It comes down to the deep and universal human need for autonomy. People need to feel in control. When you preserve a person’s autonomy by clearly giving them permission to say “No” to your ideas, the emotions calm, the effectiveness of the decisions go up, and the other party can really look at your proposal.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-26T20:31:13Z", "color": null}, {"id": "kobo-ea1bed1d-611d-4036-ab08-f649e689fbea", "source": "kobo", "text": "It comes down to the deep and universal human need for autonomy. People need to feel in control. When you preserve a person’s autonomy by clearly giving them permission to say “No” to your ideas, the emotions calm, the effectiveness of the decisions go up, and the other party can really look at your proposal.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-26T20:31:13.000", "color": 4}, {"id": "kobo-annot-021570c3d384baf6", "source": "kobo", "text": "We have it backward. For good negotiators, “No” is pure gold. That negative provides a great opportunity for you and the other party to clarify what you really want by eliminating what you don’t want. “No” is a safe choice that maintains the status quo; it provides a temporary oasis of control.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-26T16:37:56Z", "color": null}, {"id": "kobo-0b0e89b0-c653-4c0a-ba48-cd32fe862764", "source": "kobo", "text": "We have it backward. For good negotiators, “No” is pure gold. That negative provides a great opportunity for you and the other party to clarify what you really want by eliminating what you don’t want. “No” is a safe choice that maintains the status quo; it provides a temporary oasis of control.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-26T16:37:56.000", "color": 4}, {"id": "kobo-annot-995634399d9a2c30", "source": "kobo", "text": "Imagine yourself in your counterpart’s situation. The beauty of empathy is that it doesn’t demand that you agree with the other", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-25T22:54:14Z", "color": null}, {"id": "kobo-1d10ea2b-68d6-4851-b85f-d9296adef360", "source": "kobo", "text": "Imagine yourself in your counterpart’s situation. The beauty of empathy is that it doesn’t demand that you agree with the other", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-25T22:54:14.000", "color": 4}, {"id": "kobo-annot-90d761038489ad4c", "source": "kobo", "text": "They will help you connect and create more meaningful and warm relationships. That they might help you extract what you want is a bonus; human connection is the first goal.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-25T22:51:39Z", "color": null}, {"id": "kobo-1920ff35-55a6-42be-b605-61128d1624c0", "source": "kobo", "text": "They will help you connect and create more meaningful and warm relationships. That they might help you extract what you want is a bonus; human connection is the first goal.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-25T22:51:39.000", "color": 4}, {"id": "kobo-annot-4932b4a0d01cd415", "source": "kobo", "text": "And when I make a mistake—something that happens a lot—I always acknowledge the other person’s anger. I’ve found the phrase “Look, I’m an asshole” to be an amazingly effective way to make problems go away. That approach has never failed me.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-25T22:13:32Z", "color": null}, {"id": "kobo-acde3dbf-b65e-4cba-9a12-3f0aabf43a5a", "source": "kobo", "text": "And when I make a mistake—something that happens a lot—I always acknowledge the other person’s anger. I’ve found the phrase “Look, I’m an asshole” to be an amazingly effective way to make problems go away.\n That approach has never failed me.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-25T22:13:32.000", "color": 4}, {"id": "kobo-annot-74bc069a1acc1725", "source": "kobo", "text": "First, let’s talk a little human psychology. In basic terms, people’s emotions have two levels: the “presenting” behavior is the part above the surface you can see and hear; beneath, the “underlying” feeling is what motivates the behavior.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-25T22:07:04Z", "color": null}, {"id": "kobo-a82bfb48-ac6a-419b-955b-dcf3e99f40a9", "source": "kobo", "text": "First, let’s talk a little human psychology. In basic terms, people’s emotions have two levels: the “presenting” behavior is the part above the surface you can see and hear; beneath, the “underlying” feeling is what motivates the behavior.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-25T22:07:04.000", "color": 4}, {"id": "kobo-annot-c5e0928c44cc66c8", "source": "kobo", "text": "The last rule of labeling is silence. Once you’ve thrown out a label, be quiet and listen. We all have a tendency to expand on what we’ve said, to finish, “It seems like you like the way that shirt looks,” with a specific question like “Where did you get it?” But a label’s power is that it invites the other person to reveal himself.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-25T22:05:38Z", "color": null}, {"id": "kobo-de8df890-fe1d-49b0-8628-084645d8bfd9", "source": "kobo", "text": "The last rule of labeling is silence. Once you’ve thrown out a label, be quiet and listen. We all have a tendency to expand on what we’ve said, to finish, “It seems like you like the way that shirt looks,” with a specific question like “Where did you get it?” But a label’s power is that it invites the other person to reveal himself.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-25T22:05:38.000", "color": 4}, {"id": "kobo-annot-ac79090562465f45", "source": "kobo", "text": "Notice we said “It sounds like . . .” and not “I’m hearing that . . .” That’s because the word “I” gets people’s guard up. When you say “I,” it says you’re more interested in yourself than the other person, and it makes you take personal responsibility for the words that follow—and the offense they might cause.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-25T22:03:40Z", "color": null}, {"id": "kobo-e05a614d-458b-40ec-8b61-12accd10fe3e", "source": "kobo", "text": "Notice we said “It sounds like . . .” and not “I’m hearing that . . .” That’s because the word “I” gets people’s guard up. When you say “I,” it says you’re more interested in yourself than the other person, and it makes you take personal responsibility for the words that follow—and the offense they might cause.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-25T22:03:40.000", "color": 4}, {"id": "kobo-annot-a431d2cb10265903", "source": "kobo", "text": "Labeling is a way of validating someone’s emotion by acknowledging it. Give someone’s emotion a name and you show you identify with how that person feels. It gets you close to someone without asking about external factors you know nothing about (“How’s your family?”). Think of labeling as a shortcut to intimacy, a time-saving emotional hack.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-25T21:58:01Z", "color": null}, {"id": "kobo-95ebc744-0a77-4b19-92bb-40ead56bcbc4", "source": "kobo", "text": "Labeling is a way of validating someone’s emotion by acknowledging it. Give someone’s emotion a name and you show you identify with how that person feels. It gets you close to someone without asking about external factors you know nothing about (“How’s your family?”). Think of labeling as a shortcut to intimacy, a time-saving emotional hack.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-25T21:58:01.000", "color": 4}, {"id": "kobo-annot-517ec15972221ee2", "source": "kobo", "text": "Empathy is a classic “soft” communication skill, but it has a physical basis. When we closely observe a person’s face, gestures, and tone of voice, our brain begins to align with theirs in a process called neural resonance, and that lets us know more fully what they think and feel.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-25T21:52:28Z", "color": null}, {"id": "kobo-8239bb15-5fb9-45fb-b08f-3b379f2b6f1a", "source": "kobo", "text": "Empathy is a classic “soft” communication skill, but it has a physical basis. When we closely observe a person’s face, gestures, and tone of voice, our brain begins to align with theirs in a process called neural resonance, and that lets us know more fully what they think and feel.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-25T21:52:28.000", "color": 4}, {"id": "kobo-annot-e97f38a5e42b6368", "source": "kobo", "text": "Tactical empathy is understanding the feelings and mindset of another in the moment and also hearing what is behind those feelings so you increase your influence in all the moments that follow. It’s bringing our attention to both the emotional obstacles and the potential pathways to getting an agreement done.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-25T21:49:40Z", "color": null}, {"id": "kobo-0ebe4a21-e519-488d-b86d-b6035747f35f", "source": "kobo", "text": "Tactical empathy is understanding the feelings and mindset of another in the moment and also hearing what is behind those feelings so you increase your influence in all the moments that follow. It’s bringing our attention to both the emotional obstacles and the potential pathways to getting an agreement done.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-25T21:49:40.000", "color": 4}, {"id": "kobo-annot-88f8c1dc51cefd0d", "source": "kobo", "text": "Notice I didn’t say anything about agreeing with the other person’s values and beliefs or giving out hugs. That’s sympathy. What I’m talking about is trying to understand a situation from another person’s perspective.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-25T21:49:29Z", "color": null}, {"id": "kobo-8f473c02-cadd-4e5b-b0b6-1fd3cac438b6", "source": "kobo", "text": "Notice I didn’t say anything about agreeing with the other person’s values and beliefs or giving out hugs. That’s sympathy. What I’m talking about is trying to understand a situation from another person’s perspective.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-25T21:49:29.000", "color": 4}, {"id": "kobo-annot-2341905e96c90191", "source": "kobo", "text": "Most of us enter verbal combat unlikely to persuade anyone of anything because we only know and care about our own goals and perspective.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-25T17:39:52Z", "color": null}, {"id": "kobo-b4ff1dfe-7f22-40f2-b671-a840ae6f1217", "source": "kobo", "text": "Most of us enter verbal combat unlikely to persuade anyone of anything because we only know and care about our own goals and perspective.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-25T17:39:52.000", "color": 4}, {"id": "kobo-annot-58f7240d4a42bd4d", "source": "kobo", "text": "There is nothing more frustrating or disruptive to any negotiation than to get the feeling you are talking to someone who isn’t listening. Playing dumb is a valid negotiating technique, and “I don’t understand” is a legitimate response. But ignoring the other party’s position only builds up frustration and makes them less likely to do what you want.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-25T17:30:08Z", "color": null}, {"id": "kobo-9917102e-fcd8-446b-a7bd-ac624859dfc9", "source": "kobo", "text": "There is nothing more frustrating or disruptive to any negotiation than to get the feeling you are talking to someone who isn’t listening. Playing dumb is a valid negotiating technique, and “I don’t understand” is a legitimate response. But ignoring the other party’s position only builds up frustration and makes them less likely to do what you want.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-25T17:30:08.000", "color": 4}, {"id": "kobo-annot-a80200c80c452375", "source": "kobo", "text": ". You can learn almost everything you need—and a lot more than other people would like you to know—simply by watching and listening, keeping your eyes peeled and your ears open, and your mouth shut.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-25T17:26:57Z", "color": null}, {"id": "kobo-a9bdff7d-d87a-4a14-a8af-f506a770f936", "source": "kobo", "text": ". You can learn almost everything you need—and a lot more than other people would like you to know—simply by watching and listening, keeping your eyes peeled and your ears open, and your mouth shut.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-25T17:26:57.000", "color": 4}, {"id": "kobo-annot-a6f5a9d9b5bca2e4", "source": "kobo", "text": "They are able to precisely label emotions, those of others and especially their own. And once they label the emotions they talk about them without getting wound up. For them, emotion is a tool.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-25T17:26:08Z", "color": null}, {"id": "kobo-a82fa536-f84c-4ec4-894e-b909a92ebbb2", "source": "kobo", "text": "They are able to precisely label emotions, those of others and especially their own. And once they label the emotions they talk about them without getting wound up. For them, emotion is a tool.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-25T17:26:08.000", "color": 4}, {"id": "kobo-annot-a1f5639b9ec02574", "source": "kobo", "text": "Mirrors work magic. Repeat the last three words (or the critical one to three words) of what someone has just said. We fear what’s different and are drawn to what’s similar. Mirroring is the art of insinuating similarity, which facilitates bonding. Use mirrors to encourage the other side to empathize and bond with you, keep people talking, buy your side time to regroup, and encourage your counterparts to reveal their strategy.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-24T14:38:07Z", "color": null}, {"id": "kobo-7aa49522-7d49-4bf1-b871-0e291fc630ab", "source": "kobo", "text": "Mirrors work magic. Repeat the last three words (or the critical one to three words) of what someone has just said. We fear what’s different and are drawn to what’s similar. Mirroring is the art of insinuating similarity, which facilitates bonding. Use mirrors to encourage the other side to empathize and bond with you, keep people talking, buy your side time to regroup, and encourage your counterparts to reveal their strategy.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-24T14:38:07.000", "color": 4}, {"id": "kobo-annot-0f11a505f8fe38e1", "source": "kobo", "text": "The direct or assertive voice: Used rarely. Will cause problems and create pushback.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-24T14:38:00Z", "color": null}, {"id": "kobo-2742c8e3-25fa-4bff-8ef0-7bf015235a31", "source": "kobo", "text": "The direct or assertive voice: Used rarely. Will cause problems and create pushback.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-24T14:38:00.000", "color": 4}, {"id": "kobo-annot-ee3e7696341df922", "source": "kobo", "text": "2.The positive/playful voice: Should be your default voice. It’s the voice of an easygoing, good-natured person. Your attitude is light and encouraging. The key here is to relax and smile while you’re talking.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-24T14:37:47Z", "color": null}, {"id": "kobo-2f446cb2-004a-4b0d-9f92-05abfb70ca35", "source": "kobo", "text": "2.The positive/playful voice: Should be your default voice. It’s the voice of an easygoing, good-natured person. Your attitude is light and encouraging. The key here is to relax and smile while you’re talking.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-24T14:37:47.000", "color": 4}, {"id": "kobo-annot-0ced99bae32c6105", "source": "kobo", "text": "1.The late-night FM DJ voice: Use selectively to make a point. Inflect your voice downward, keeping it calm and slow. When done properly, you create an aura of authority and trustworthiness without triggering defensiveness.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-24T14:37:36Z", "color": null}, {"id": "kobo-e21487ff-6904-4a4f-977e-7e50edbeaf28", "source": "kobo", "text": "1.The late-night FM DJ voice: Use selectively to make a point. Inflect your voice downward, keeping it calm and slow. When done properly, you create an aura of authority and trustworthiness without triggering defensiveness.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-24T14:37:36.000", "color": 4}, {"id": "kobo-annot-aedfeeebeb426bb7", "source": "kobo", "text": "their head. Negotiation is not an act of battle; it’s a process of discovery. The goal is to uncover as much information as possible. ■To quiet the voices in your head, make your sole and all-encompassing focus the other person and what they have to say. ■Slow. It. Down. Going too fast is one of the mistakes all negotiators are prone to making. If we’re too much in a hurry, people can feel as if they’re not being heard. You risk undermining the rapport and trust you’ve built. ■Put a smile on your face. When people are in a positive frame of mind, they think more quickly, and are more likely to collaborate and problem-solve (instead of fight and resist). Positivity creates mental agility in both you and your counterpart.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-24T14:37:31Z", "color": null}, {"id": "kobo-1640dbf7-3884-4d23-b806-4068f2f88f80", "source": "kobo", "text": "their head. Negotiation is not an act of battle; it’s a process of discovery. The goal is to uncover as much information as possible.\n ■To quiet the voices in your head, make your sole and all-encompassing focus the other person and what they have to say.\n ■Slow. It. Down. Going too fast is one of the mistakes all negotiators are prone to making. If we’re too much in a hurry, people can feel as if they’re not being heard. You risk undermining the rapport and trust you’ve built.\n ■Put a smile on your face. When people are in a positive frame of mind, they think more quickly, and are more likely to collaborate and problem-solve (instead of fight and resist). Positivity creates mental agility in both you and your counterpart.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-24T14:37:31.000", "color": 4}, {"id": "kobo-annot-0698b8ad5aca8ac3", "source": "kobo", "text": "A good negotiator prepares, going in, to be ready for possible surprises; a great negotiator aims to use her skills to reveal the surprises she is certain to find. ■Don’t commit to assumptions; instead, view them as hypotheses and use the negotiation to test them rigorously. ■People who view negotiation as a battle of arguments become overwhelmed by the voices in", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-24T14:37:01Z", "color": null}, {"id": "kobo-48d4637e-f30f-457f-9e5b-6403c119ed68", "source": "kobo", "text": "A good negotiator prepares, going in, to be ready for possible surprises; a great negotiator aims to use her skills to reveal the surprises she is certain to find.\n ■Don’t commit to assumptions; instead, view them as hypotheses and use the negotiation to test them rigorously.\n ■People who view negotiation as a battle of arguments become overwhelmed by the voices in", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-24T14:37:01.000", "color": 4}, {"id": "kobo-annot-d450be1a10912264", "source": "kobo", "text": "Most of the time, you should be using the positive/playful voice. It’s the voice of an easygoing, good-natured person. Your attitude is light and encouraging. The key here is to relax and smile while you’re talking. A smile, even while talking on the phone, has an impact tonally that the other person will pick up on.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-24T13:58:05Z", "color": null}, {"id": "kobo-f5364500-f370-41d4-8a20-e9bdb47334f9", "source": "kobo", "text": "Most of the time, you should be using the positive/playful voice. It’s the voice of an easygoing, good-natured person. Your attitude is light and encouraging. The key here is to relax and smile while you’re talking. A smile, even while talking on the phone, has an impact tonally that the other person will pick up on.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-24T13:58:05.000", "color": 4}, {"id": "kobo-annot-79aeedbbdf3ffea6", "source": "kobo", "text": "On a mostly unconscious level, we can understand the minds of others not through any kind of thinking but through quite literally grasping what the other is feeling.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-24T13:18:36Z", "color": null}, {"id": "kobo-b98b9ce5-3a20-4d48-845a-479ecb45f09b", "source": "kobo", "text": "On a mostly unconscious level, we can understand the minds of others not through any kind of thinking but through quite literally grasping what the other is feeling.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-24T13:18:36.000", "color": 4}, {"id": "kobo-annot-df8f7aa95fa118cf", "source": "kobo", "text": "but it’s how we are (our general demeanor and delivery) that is both the easiest thing to enact and the most immediately effective mode of influence.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-24T13:18:07Z", "color": null}, {"id": "kobo-c3acda2f-bb8e-4a8d-b799-05c038b707e5", "source": "kobo", "text": "but it’s how we are (our general demeanor and delivery) that is both the easiest thing to enact and the most immediately effective mode of influence.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-24T13:18:07.000", "color": 4}, {"id": "kobo-annot-a5ea9df7fb8bd47f", "source": "kobo", "text": "There’s plenty of research that now validates the passage of time as one of the most important tools for a negotiator.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-23T21:51:10Z", "color": null}, {"id": "kobo-68a9ec42-c4de-4b56-8db9-a20d1f7e23aa", "source": "kobo", "text": "There’s plenty of research that now validates the passage of time as one of the most important tools for a negotiator.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-23T21:51:10.000", "color": 4}, {"id": "kobo-annot-9c87f49211ebdf93", "source": "kobo", "text": "Wants are easy to talk about, representing the aspiration of getting our way, and sustaining any illusion of control we have as we begin to negotiate; needs imply survival, the very minimum required to make us act, and so make us vulnerable. But neither wants nor needs are where we start; it begins with listening, making it about the other people, validating their emotions, and creating enough trust and safety for a real conversation to begin.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-23T21:44:46Z", "color": null}, {"id": "kobo-725d6bef-2c2e-4bb7-be75-b83071c2969d", "source": "kobo", "text": "Wants are easy to talk about, representing the aspiration of getting our way, and sustaining any illusion of control we have as we begin to negotiate; needs imply survival, the very minimum required to make us act, and so make us vulnerable. But neither wants nor needs are where we start; it begins with listening, making it about the other people, validating their emotions, and creating enough trust and safety for a real conversation to begin.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-23T21:44:46.000", "color": 4}, {"id": "kobo-annot-5974dd87263802fd", "source": "kobo", "text": "There’s one powerful way to quiet the voice in your head and the voice in their head at the same time: treat two schizophrenics with just one pill. Instead of prioritizing your argument—in fact, instead of doing any thinking at all in the early goings about what you’re going to say—make your sole and all-encompassing focus the other person and what they have to say. In that mode of true active listening", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-23T20:22:54Z", "color": null}, {"id": "kobo-5857d7a2-42d8-40dd-852b-0f5968bf1e14", "source": "kobo", "text": "There’s one powerful way to quiet the voice in your head and the voice in their head at the same time: treat two schizophrenics with just one pill. Instead of prioritizing your argument—in fact, instead of doing any thinking at all in the early goings about what you’re going to say—make your sole and all-encompassing focus the other person and what they have to say. In that mode of true active listening", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-23T20:22:54.000", "color": 4}, {"id": "kobo-annot-66a25a711ae0c50f", "source": "kobo", "text": "George A. Miller persuasively put forth the idea that we can process only about seven pieces of information in our conscious mind at any given moment. In other words, we are easily overwhelmed.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-23T20:21:27Z", "color": null}, {"id": "kobo-c6e34160-7ca3-4a0e-a856-a25d2a023efe", "source": "kobo", "text": "George A. Miller persuasively put forth the idea that we can process only about seven pieces of information in our conscious mind at any given moment. In other words, we are easily overwhelmed.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-23T20:21:27.000", "color": 4}, {"id": "kobo-annot-0f6fa42e470838cf", "source": "kobo", "text": "Just remember, to successfully negotiate it is critical to prepare.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-23T20:02:18Z", "color": null}, {"id": "kobo-97107658-b3c5-4dbd-83d5-b0bf3e925546", "source": "kobo", "text": "Just remember, to successfully negotiate it is critical to prepare.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-23T20:02:18.000", "color": 4}, {"id": "kobo-annot-d0a938fcf3d441ee", "source": "kobo", "text": "Negotiation as you’ll learn it here is nothing more than communication with results. Getting what you want out of life is all about getting what you want from—and with—other people. Conflict between two parties is inevitable in all relationships. So it’s useful—crucial, even—to know how to engage in that conflict to get what you want without inflicting damage.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-23T19:46:11Z", "color": null}, {"id": "kobo-8ad424c7-dd00-4d04-9ba5-7100a7ba3d52", "source": "kobo", "text": "Negotiation as you’ll learn it here is nothing more than communication with results. Getting what you want out of life is all about getting what you want from—and with—other people. Conflict between two parties is inevitable in all relationships. So it’s useful—crucial, even—to know how to engage in that conflict to get what you want without inflicting damage.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-23T19:46:11.000", "color": 4}, {"id": "kobo-annot-7ff9fb9cdb69a3ca", "source": "kobo", "text": "Psychotherapy research shows that when individuals feel listened to, they tend to listen to themselves more carefully and to openly evaluate and clarify their own thoughts and feelings. In addition, they tend to become less defensive and oppositional and more willing to listen to other points of view, which gets them to the calm and logical place where they can be good Getting to Yes problem solvers.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-23T19:42:59Z", "color": null}, {"id": "kobo-b0c99025-0e03-4463-93cd-d78a203b97e7", "source": "kobo", "text": "Psychotherapy research shows that when individuals feel listened to, they tend to listen to themselves more carefully and to openly evaluate and clarify their own thoughts and feelings. In addition, they tend to become less defensive and oppositional and more willing to listen to other points of view, which gets them to the calm and logical place where they can be good Getting to Yes problem solvers.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-23T19:42:59.000", "color": 4}, {"id": "kobo-annot-bf05601d44342e93", "source": "kobo", "text": "It all starts with the universally applicable premise that people want to be understood and accepted. Listening is the cheapest, yet most effective concession we can make to get there.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-23T19:41:45Z", "color": null}, {"id": "kobo-5ee40646-fd71-4858-a092-6782a4e5d738", "source": "kobo", "text": "It all starts with the universally applicable premise that people want to be understood and accepted. Listening is the cheapest, yet most effective concession we can make to get there.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-23T19:41:45.000", "color": 4}, {"id": "kobo-annot-c141fee3169089a0", "source": "kobo", "text": "System 1’s inchoate beliefs, feelings, and impressions are the main sources of the explicit beliefs and deliberate choices of System 2. They’re the spring that feeds the river. We react emotionally (System 1) to a suggestion or question. Then that System 1 reaction informs and in effect creates the System 2 answer.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-23T19:33:28Z", "color": null}, {"id": "kobo-81cbca48-9aec-4c31-af10-51c8bffa4654", "source": "kobo", "text": "System 1’s inchoate beliefs, feelings, and impressions are the main sources of the explicit beliefs and deliberate choices of System 2. They’re the spring that feeds the river. We react emotionally (System 1) to a suggestion or question. Then that System 1 reaction informs and in effect creates the System 2 answer.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-23T19:33:28.000", "color": 4}, {"id": "kobo-annot-f07fa0ba6df63ccd", "source": "kobo", "text": "Kahneman later codified his research in the 2011 bestseller Thinking, Fast and Slow.3 Man, he wrote, has two systems of thought: System 1, our animal mind, is fast, instinctive, and emotional; System 2 is slow, deliberative, and logical. And System 1 is far more influential. In fact, it guides and steers our rational thoughts.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-23T19:32:47Z", "color": null}, {"id": "kobo-2383e0ad-bddb-40a9-b9ba-69eef0e80251", "source": "kobo", "text": "Kahneman later codified his research in the 2011 bestseller Thinking, Fast and Slow.3 Man, he wrote, has two systems of thought: System 1, our animal mind, is fast, instinctive, and emotional; System 2 is slow, deliberative, and logical. And System 1 is far more influential. In fact, it guides and steers our rational thoughts.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-23T19:32:47.000", "color": 4}, {"id": "kobo-annot-ba2763c4389fa039", "source": "kobo", "text": "humans all suffer from Cognitive Bias, that is, unconscious—and irrational—brain processes that literally distort the way we see the world. Kahneman and Tversky discovered more than 150 of them.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-23T19:28:47Z", "color": null}, {"id": "kobo-eb1ce32b-451f-4c74-b063-7b4dfd84a45f", "source": "kobo", "text": "humans all suffer from Cognitive Bias, that is, unconscious—and irrational—brain processes that literally distort the way we see the world. Kahneman and Tversky discovered more than 150 of them.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-23T19:28:47.000", "color": 4}, {"id": "kobo-annot-13b7cc995f5376ba", "source": "kobo", "text": "This mentality baffled Kahneman, who from years in psychology knew that, in his words, “[I]t is self-evident that people are neither fully rational nor completely selfish, and that their tastes are anything but stable.”", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-23T19:27:57Z", "color": null}, {"id": "kobo-bad2a259-6165-455f-b7e3-dbe392f518f4", "source": "kobo", "text": "This mentality baffled Kahneman, who from years in psychology knew that, in his words, “[I]t is self-evident that people are neither fully rational nor completely selfish, and that their tastes are anything but stable.”", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-23T19:27:57.000", "color": 4}, {"id": "kobo-annot-fcbaadc7fbeeb2fa", "source": "kobo", "text": "Feeling, they discovered, is a form of thinking.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-23T19:26:39Z", "color": null}, {"id": "kobo-57762266-921e-4b2d-936c-f48a19985389", "source": "kobo", "text": "Feeling, they discovered, is a form of thinking.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-23T19:26:39.000", "color": 4}, {"id": "kobo-annot-361437ad1d74a765", "source": "kobo", "text": "Their system was easy to follow and seductive, with four basic tenets. One, separate the person—the emotion—from the problem; two, don’t get wrapped up in the other side’s position (what they’re asking for) but instead focus on their interests (why they’re asking for it) so that you can find what they really want; three, work cooperatively to generate win-win options; and, four, establish mutually agreed-upon standards for evaluating those possible solutions. It was a brilliant, rational, and profound synthesis of the most advanced game theory and legal thinking of the day. For years after that book came out, everybody—including the FBI and the NYPD—focused on a problem-solving approach to bargaining interactions. It just seemed so modern and smart.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-23T19:25:01Z", "color": null}, {"id": "kobo-4bc77823-4046-4904-940c-f388792acf4e", "source": "kobo", "text": "Their system was easy to follow and seductive, with four basic tenets. One, separate the person—the emotion—from the problem; two, don’t get wrapped up in the other side’s position (what they’re asking for) but instead focus on their interests (why they’re asking for it) so that you can find what they really want; three, work cooperatively to generate win-win options; and, four, establish mutually agreed-upon standards for evaluating those possible solutions.\n It was a brilliant, rational, and profound synthesis of the most advanced game theory and legal thinking of the day. For years after that book came out, everybody—including the FBI and the NYPD—focused on a problem-solving approach to bargaining interactions. It just seemed so modern and smart.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-23T19:25:01.000", "color": 4}, {"id": "kobo-annot-e029656ababa703d", "source": "kobo", "text": "Fisher and Ury’s approach was basically to systematize problem solving so that negotiating parties could reach a mutually beneficial deal—the getting to “Yes” in the title. Their core assumption was that the emotional brain—that animalistic, unreliable, and irrational beast—could be overcome through a more rational, joint problem-solving mindset.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-23T19:24:34Z", "color": null}, {"id": "kobo-0ceb0d96-051b-4681-8dc5-82354ab6af1b", "source": "kobo", "text": "Fisher and Ury’s approach was basically to systematize problem solving so that negotiating parties could reach a mutually beneficial deal—the getting to “Yes” in the title. Their core assumption was that the emotional brain—that animalistic, unreliable, and irrational beast—could be overcome through a more rational, joint problem-solving mindset.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-23T19:24:34.000", "color": 4}, {"id": "kobo-annot-e00c37f1493d5283", "source": "kobo", "text": "Two years later, Roger Fisher and William Ury—cofounders of the project—came out with Getting to Yes,2 a groundbreaking treatise on negotiation that totally changed the way practitioners thought about the field.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-23T19:24:15Z", "color": null}, {"id": "kobo-b0247b14-7e90-40ce-9731-b34dbfbc3767", "source": "kobo", "text": "Two years later, Roger Fisher and William Ury—cofounders of the project—came out with Getting to Yes,2 a groundbreaking treatise on negotiation that totally changed the way practitioners thought about the field.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-23T19:24:15.000", "color": 4}, {"id": "kobo-annot-7ebaffad9bc6ff69", "source": "kobo", "text": "I was employing what had become one of the FBI’s most potent negotiating tools: the open-ended question.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-23T19:19:35Z", "color": null}, {"id": "kobo-2329a656-92f2-4b9a-975d-8a32691bfd76", "source": "kobo", "text": "I was employing what had become one of the FBI’s most potent negotiating tools: the open-ended question.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-23T19:19:35.000", "color": 4}, {"id": "kobo-annot-356d840f6c912e7b", "source": "kobo", "text": "“I’m just asking questions,” I said. “It’s a passive-aggressive approach. I just ask the same three or four open-ended questions over and over and over and over. They get worn out answering and give me everything I want.” Andy jumped in his seat as if he’d been stung by a bee. “Damn!” he said. “That’s what happened. I had no idea.”", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-23T19:16:31Z", "color": null}, {"id": "kobo-5f021592-3588-4a47-9c80-3b5bc20a666e", "source": "kobo", "text": "“I’m just asking questions,” I said. “It’s a passive-aggressive approach. I just ask the same three or four open-ended questions over and over and over and over. They get worn out answering and give me everything I want.”\n Andy jumped in his seat as if he’d been stung by a bee.\n “Damn!” he said. “That’s what happened. I had no idea.”", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-23T19:16:31.000", "color": 4}, {"id": "kobo-annot-7951c86f653498ba", "source": "kobo", "text": "Everything that happens once can never happen again. But everything that happens twice will surely happen a third time.", "note": null, "title": "The Alchemist", "author": "Paolo Coelho", "url": null, "created_at": "2026-01-19T21:34:58Z", "color": null}, {"id": "kobo-8b6fc8ae-adb7-415f-91ac-43ddfb2e8b61", "source": "kobo", "text": "Everything that happens once can never happen again. But everything that happens twice will surely happen a third time.", "note": null, "title": "The Alchemist", "author": "Paolo Coelho", "url": null, "created_at": "2026-01-19T21:34:58.000", "color": 4}, {"id": "kobo-annot-96c45364cad064a4", "source": "kobo", "text": "There is only one thing that makes a dream impossible to achieve: the fear of failure.", "note": null, "title": "The Alchemist", "author": "Paolo Coelho", "url": null, "created_at": "2026-01-19T21:03:33Z", "color": null}, {"id": "kobo-06ef00fd-ad42-48a6-b20a-3c3d97994320", "source": "kobo", "text": "There is only one thing that makes a dream impossible to achieve: the fear of failure.", "note": null, "title": "The Alchemist", "author": "Paolo Coelho", "url": null, "created_at": "2026-01-19T21:03:33.000", "color": 4}, {"id": "kobo-annot-4fbb42282989c355", "source": "kobo", "text": ". There was no need to imprison them: the Arabs simply confiscated their horses. So, once again, the world had demonstrated its many languages: the desert only moments ago had been endless and free, and now it was an impenetrable wall. \"", "note": null, "title": "The Alchemist", "author": "Paolo Coelho", "url": null, "created_at": "2026-01-19T21:01:50Z", "color": null}, {"id": "kobo-ce49ccaa-5a60-40ce-b36c-c94514acbfc5", "source": "kobo", "text": ". There was no need to imprison them: the Arabs simply confiscated their horses. So, once again, the world had demonstrated its many languages: the desert only moments ago had been endless and free, and now it was an impenetrable wall. \"", "note": null, "title": "The Alchemist", "author": "Paolo Coelho", "url": null, "created_at": "2026-01-19T21:01:50.000", "color": 4}, {"id": "kobo-annot-7905f3d4044b7616", "source": "kobo", "text": "\"Treason is a blow that comes unexpectedly. If you know your heart well, it will never be able to do that to you. Because you'll know its dreams and wishes, and will know how to deal with them.", "note": null, "title": "The Alchemist", "author": "Paolo Coelho", "url": null, "created_at": "2026-01-15T21:43:37Z", "color": null}, {"id": "kobo-27d09cbe-0d46-49bd-8a30-07d9e962257e", "source": "kobo", "text": "\"Treason is a blow that comes unexpectedly. If you know your heart well, it will never be able to do that to you. Because you'll know its dreams and wishes, and will know how to deal with them.", "note": null, "title": "The Alchemist", "author": "Paolo Coelho", "url": null, "created_at": "2026-01-15T21:43:37.000", "color": 4}, {"id": "kobo-annot-8bd8e9617a6df7e5", "source": "kobo", "text": "There is only one way to learn,\" the alchemist answered. \"It's through action. Everything you need to know you have learned through your journey. You need to learn only one thing more.", "note": null, "title": "The Alchemist", "author": "Paolo Coelho", "url": null, "created_at": "2026-01-15T21:36:06Z", "color": null}, {"id": "kobo-f0247b1b-a9cd-4892-8bec-7b55b45823b5", "source": "kobo", "text": "There is only one way to learn,\" the alchemist answered. \"It's through action. Everything you need to know you have learned through your journey. You need to learn only one thing more.", "note": null, "title": "The Alchemist", "author": "Paolo Coelho", "url": null, "created_at": "2026-01-15T21:36:06.000", "color": 4}, {"id": "kobo-annot-f875ca1f39693647", "source": "kobo", "text": ". And, as the camel driver had said, to die tomorrow was no worse than dying on any other day. Every day was there to be lived or to mark one's departure from this world. Everything depended on one word: \"Maktub.", "note": null, "title": "The Alchemist", "author": "Paolo Coelho", "url": null, "created_at": "2026-01-15T21:06:38Z", "color": null}, {"id": "kobo-b8468a91-d5d1-480d-965e-f7691b166f2f", "source": "kobo", "text": ". And, as the camel driver had said, to die tomorrow was no worse than dying on any other day. Every day was there to be lived or to mark one's departure from this world. Everything depended on one word: \"Maktub.", "note": null, "title": "The Alchemist", "author": "Paolo Coelho", "url": null, "created_at": "2026-01-15T21:06:38.000", "color": 4}, {"id": "kobo-annot-3732bd1f6c2b4bbe", "source": "kobo", "text": "If you pay attention to the present, you can improve upon it. And, if you improve on the present, what comes later will also be better. Forget about the future, and live each day according to the teachings, confident that God loves his children. Each day, in itself, brings with it an eternity.", "note": null, "title": "The Alchemist", "author": "Paolo Coelho", "url": null, "created_at": "2026-01-15T20:56:46Z", "color": null}, {"id": "kobo-b8a2aafb-fc0b-43d1-9b05-8de9d82e583e", "source": "kobo", "text": "If you pay attention to the present, you can improve upon it. And, if you improve on the present, what comes later will also be better. Forget about the future, and live each day according to the teachings, confident that God loves his children. Each day, in itself, brings with it an eternity.", "note": null, "title": "The Alchemist", "author": "Paolo Coelho", "url": null, "created_at": "2026-01-15T20:56:46.000", "color": 4}, {"id": "kobo-annot-373f32af06b60fb4", "source": "kobo", "text": "Don't be impatient,\" he repeated to himself. \"It's like the camel driver said: 'Eat when it's time to eat. And move along when it's time to move along.'", "note": null, "title": "The Alchemist", "author": "Paolo Coelho", "url": null, "created_at": "2026-01-14T19:20:35Z", "color": null}, {"id": "kobo-1a163261-2321-4a1a-9fe5-66ccdbfb66c9", "source": "kobo", "text": "Don't be impatient,\" he repeated to himself. \"It's like the camel driver said: 'Eat when it's time to eat. And move along when it's time to move along.'", "note": null, "title": "The Alchemist", "author": "Paolo Coelho", "url": null, "created_at": "2026-01-14T19:20:35.000", "color": 4}, {"id": "kobo-annot-835b0c50f076fbbf", "source": "kobo", "text": "Life will be a party for you, a grand festival, because life is the moment we're living right now.", "note": null, "title": "The Alchemist", "author": "Paolo Coelho", "url": null, "created_at": "2026-01-14T19:08:33Z", "color": null}, {"id": "kobo-1c411afa-c3c6-4e8b-bc7d-471589a32393", "source": "kobo", "text": "Life will be a party for you, a grand festival, because life is the moment we're living right now.", "note": null, "title": "The Alchemist", "author": "Paolo Coelho", "url": null, "created_at": "2026-01-14T19:08:33.000", "color": 4}, {"id": "kobo-annot-9e3f11dc2bfce040", "source": "kobo", "text": ". If you can concentrate always on the present, you'll be a happy man.", "note": null, "title": "The Alchemist", "author": "Paolo Coelho", "url": null, "created_at": "2026-01-14T19:07:17Z", "color": null}, {"id": "kobo-7d1a51ba-e135-4de4-ae49-83c21a4f1097", "source": "kobo", "text": ". If you can concentrate always on the present, you'll be a happy man.", "note": null, "title": "The Alchemist", "author": "Paolo Coelho", "url": null, "created_at": "2026-01-14T19:07:17.000", "color": 4}, {"id": "kobo-annot-b1e7043b304618f7", "source": "kobo", "text": "Once you get into the desert, there's no going back,\" said the camel driver. \"And, when you can't go back, you have to worry only about the best way of moving forward.", "note": null, "title": "The Alchemist", "author": "Paolo Coelho", "url": null, "created_at": "2026-01-13T21:18:21Z", "color": null}, {"id": "kobo-e8ed07b3-a6a4-4913-ab95-92f3e524e544", "source": "kobo", "text": "Once you get into the desert, there's no going back,\" said the camel driver. \"And, when you can't go back, you have to worry only about the best way of moving forward.", "note": null, "title": "The Alchemist", "author": "Paolo Coelho", "url": null, "created_at": "2026-01-13T21:18:21.000", "color": 4}, {"id": "kobo-annot-45305c9ed6b2820b", "sourc
