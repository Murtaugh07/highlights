<style>
  /* ---------- design tokens ---------- */
  :root{
    --paper:        #f3ecdb;
    --paper-deep:   #ebe2cc;
    --paper-edge:   #d9cfb3;
    --ink:          #1a1612;
    --ink-soft:     #4a423a;
    --ink-muted:    #7a6f63;
    --accent:       #8b3a2f;        /* oxblood */
    --accent-soft:  #c97962;
    --rule:         #cfc4a8;
    --shadow:       0 1px 0 rgba(26,22,18,.04), 0 18px 40px -28px rgba(26,22,18,.35);
    --serif:        "Newsreader", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --mono:         "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  *,*::before,*::after{box-sizing:border-box}

  html,body{margin:0;padding:0}
  body{
    font-family: var(--serif);
    color: var(--ink);
    background: var(--paper);
    /* subtle paper grain via layered gradients */
    background-image:
      radial-gradient(ellipse at 20% 10%, rgba(255,247,225,.6), transparent 50%),
      radial-gradient(ellipse at 90% 80%, rgba(190,165,120,.18), transparent 55%),
      repeating-linear-gradient(0deg, rgba(120,90,40,.018) 0 1px, transparent 1px 3px);
    font-feature-settings: "kern", "liga", "onum";
    font-optical-sizing: auto;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  /* ---------- layout ---------- */
  .wrap{ max-width: 760px; margin: 0 auto; padding: 28px 22px 120px; }

  header.masthead{
    display:flex; align-items:baseline; justify-content:space-between;
    gap: 16px; flex-wrap: wrap;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 14px; margin-bottom: 28px;
  }
  .brand{ display:flex; align-items:baseline; gap:10px; }
  .brand h1{
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(28px, 5vw, 38px);
    margin:0; letter-spacing: -0.01em;
    font-style: italic;
  }
  .brand .dot{
    width:8px;height:8px;border-radius:50%;
    background: var(--accent); display:inline-block;
    transform: translateY(-4px);
  }
  .meta{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-muted);
    text-transform: uppercase;
    letter-spacing: .08em;
  }

  nav.tabs{
    display:flex; gap: 24px; margin-bottom: 24px;
    border-bottom: 1px solid var(--rule);
  }
  nav.tabs button{
    background:none;border:0;padding: 10px 0 12px;
    font-family: var(--serif); font-size: 16px; font-weight: 500;
    color: var(--ink-muted); cursor:pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    letter-spacing: .01em;
    transition: color .15s ease;
  }
  nav.tabs button:hover{ color: var(--ink) }
  nav.tabs button.active{ color: var(--ink); border-bottom-color: var(--accent); }

  /* ---------- highlight card ---------- */
  article.hl{
    background: var(--paper-deep);
    border: 1px solid var(--paper-edge);
    border-radius: 6px;
    padding: 24px 26px 20px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
    position:relative;
    transition: transform .25s ease, box-shadow .25s ease;
  }
  article.hl:hover{ transform: translateY(-1px); }

  article.hl .text{
    font-size: clamp(17px, 2.2vw, 19px);
    line-height: 1.6;
    color: var(--ink);
    margin: 0 0 14px;
    /* large hanging quote */
  }
  article.hl .text::first-letter{ font-style: italic }

  article.hl .note{
    font-size: 14px;
    color: var(--ink-soft);
    border-left: 2px solid var(--accent-soft);
    padding: 4px 0 4px 12px;
    margin: 12px 0 14px;
    font-style: italic;
  }
  article.hl .note::before{
    content: "Aantekening — ";
    font-style: normal;
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .12em;
    color: var(--ink-muted);
    margin-right: 4px;
  }

  article.hl footer{
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap: wrap; gap: 10px;
    border-top: 1px dotted var(--rule);
    padding-top: 12px;
    font-size: 13px;
    color: var(--ink-muted);
  }
  article.hl .src{
    display:flex; align-items:baseline; gap:8px;
    min-width: 0;
  }
  article.hl .src .title{
    color: var(--ink-soft); font-style: italic; font-weight: 500;
    text-overflow: ellipsis; overflow:hidden; white-space:nowrap;
    max-width: 100%;
  }
  article.hl .src .author::before{ content: " — "; }
  article.hl .src a{
    color: var(--ink-soft);
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }
  article.hl .src a:hover{ border-bottom-color: var(--accent) }

  .badge{
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: .14em;
    text-transform: uppercase;
    padding: 3px 7px 2px;
    border-radius: 2px;
    background: var(--paper);
    border: 1px solid var(--rule);
    color: var(--ink-muted);
    flex-shrink: 0;
  }
  .badge.kobo{ color: #2c5563; border-color: #b7c8cc; background: #e7eef0; }
  .badge.instapaper{ color: var(--accent); border-color: #dabeb6; background: #f5e6e1; }

  .actions{ display:flex; gap: 14px; }
  .actions button{
    background:none; border:0; padding: 6px 2px;
    font-family: var(--mono);
    font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink-muted); cursor: pointer;
    min-height: 32px;
  }
  .actions button:hover{ color: var(--ink) }
  .actions button.fav.on{ color: var(--accent) }

  /* ---------- mobile tweaks ---------- */
  @media (max-width: 540px){
    .wrap{ padding: 18px 16px 100px }
    article.hl{ padding: 20px 20px 16px }
    .actions button{ padding: 10px 4px; min-height: 40px; font-size: 11px }
    .chip{ padding: 8px 13px; min-height: 36px }
    nav.tabs button{ padding: 12px 0 14px; font-size: 17px }
    nav.tabs{ gap: 18px }
    .footbar{ font-size: 12px }
    .footbar button{ padding: 6px 0; display: inline-block }
  }

  /* ---------- daily view ---------- */
  .daily-head{
    display:flex; align-items:baseline; justify-content: space-between;
    margin-bottom: 18px; flex-wrap: wrap; gap:12px;
  }
  .daily-head h2{
    font-weight: 400; margin:0;
    font-size: 22px; font-style: italic;
    color: var(--ink-soft);
  }
  .daily-head .reshuffle{
    background:none; border: 1px solid var(--rule);
    padding: 6px 12px; border-radius: 3px;
    font-family: var(--mono); font-size: 10.5px;
    letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink-soft); cursor: pointer;
  }
  .daily-head .reshuffle:hover{ background: var(--paper-deep); color: var(--ink) }

  /* ---------- browse view ---------- */
  .browse-head{
    display:flex; flex-direction: column; gap: 12px; margin-bottom: 22px;
  }
  .search{
    display:flex; align-items:center; gap: 10px;
    background: var(--paper-deep);
    border: 1px solid var(--paper-edge);
    border-radius: 4px;
    padding: 8px 14px;
  }
  .search input{
    flex:1; background: transparent; border: 0; outline: none;
    font-family: var(--serif); font-size: 15px;
    color: var(--ink);
  }
  .search .count{
    font-family: var(--mono); font-size: 11px;
    color: var(--ink-muted);
  }

  .filters{ display:flex; gap: 8px; flex-wrap: wrap }
  .chip{
    background: transparent;
    border: 1px solid var(--rule);
    padding: 5px 11px; border-radius: 999px;
    font-family: var(--mono); font-size: 10.5px;
    letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink-muted); cursor:pointer;
  }
  .chip:hover{ color: var(--ink) }
  .chip.active{
    background: var(--ink); color: var(--paper);
    border-color: var(--ink);
  }

  details.book{
    margin-bottom: 20px;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 12px;
  }
  details.book summary{
    cursor: pointer; list-style: none;
    padding: 8px 0;
    display:flex; align-items:baseline; gap: 12px;
  }
  details.book summary::-webkit-details-marker{ display:none }
  details.book summary::before{
    content: "›";
    font-size: 18px;
    color: var(--ink-muted);
    transition: transform .2s ease;
    display: inline-block;
    line-height: 1;
  }
  details.book[open] summary::before{ transform: rotate(90deg) }
  details.book .booktitle{
    font-style: italic; font-size: 18px; color: var(--ink);
    flex: 1;
  }
  details.book .bookauthor{
    color: var(--ink-muted); font-size: 14px;
  }
  details.book .bookcount{
    font-family: var(--mono); font-size: 11px; color: var(--ink-muted);
    letter-spacing: .08em;
  }
  details.book .book-items{ padding-top: 8px }

  /* ---------- empty / loader ---------- */
  .empty{
    text-align: center; padding: 60px 20px;
    color: var(--ink-muted); font-style: italic;
  }
  .loader{
    border: 1px dashed var(--rule);
    border-radius: 6px;
    padding: 36px 28px;
    text-align: center;
    background: rgba(255,255,255,.3);
  }
  .loader h2{
    font-weight: 500; font-style: italic;
    margin: 0 0 8px; font-size: 22px;
  }
  .loader p{ color: var(--ink-soft); margin: 0 0 18px }
  .loader.drag{ background: var(--paper-deep); border-color: var(--accent); }
  .filebtn{
    display:inline-block;
    background: var(--ink); color: var(--paper);
    padding: 9px 18px; border-radius: 3px;
    font-family: var(--mono); font-size: 11px;
    letter-spacing: .14em; text-transform: uppercase;
    cursor: pointer; border:0;
  }
  .filebtn:hover{ background: var(--accent) }

  /* ---------- footer / data controls ---------- */
  .footbar{
    margin-top: 40px; padding-top: 16px;
    border-top: 1px solid var(--rule);
    display:flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 10px;
    font-family: var(--mono); font-size: 11px;
    color: var(--ink-muted); letter-spacing: .04em;
  }
  .footbar button{
    background:none; border:0; cursor:pointer;
    color: var(--ink-muted);
    font-family: var(--mono); font-size: 11px;
    text-decoration: underline; text-decoration-color: var(--rule);
    text-underline-offset: 3px;
  }
  .footbar button:hover{ color: var(--accent) }

  /* ---------- mark highlights for search ---------- */
  mark{
    background: rgba(201, 121, 98, .25);
    color: inherit;
    padding: 0 2px; border-radius: 2px;
  }

  /* ---------- subtle entrance ---------- */
  @keyframes rise{
    from{ opacity:0; transform: translateY(6px) }
    to  { opacity:1; transform: translateY(0)   }
  }
  article.hl{ animation: rise .4s ease both }
  article.hl:nth-child(2){ animation-delay: .05s }
  article.hl:nth-child(3){ animation-delay: .10s }
  article.hl:nth-child(4){ animation-delay: .15s }
  article.hl:nth-child(5){ animation-delay: .20s }
</style>
</head>

</div>

iën zou ontsmetten. Daar paste hij voor. \n Zijn vakgenoten spoten het loof zonder pardon dood en injecteerden de grond met gif, de wettelijke verplichting om een op drie te mogen verbouwen.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-12T21:15:00.000", "color": 4}, {"id": "kobo-annot-8d25f3ef1ea6f1a7", "source": "kobo", "text": "In 1972 keert hij het heersende denkbeeld binnenstebuiten: natuurland kan waardevoller zijn dan cultuurland.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-12T20:53:10Z", "color": null}, {"id": "kobo-2ac92018-3f04-4743-9d9a-c48a59e5d7e1", "source": "kobo", "text": "In 1972 keert hij het heersende denkbeeld binnenstebuiten: natuurland kan waardevoller zijn dan cultuurland.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-12T20:53:10.000", "color": 4}, {"id": "kobo-annot-a21842058b5da2f1", "source": "kobo", "text": "Ook de natuurbeleving van de romantische wandelaar (of wadloper), die zich in de vrije natuur waagt om er gelouterd en overweldigd uit terug te keren, is aan revisie toe.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-12T20:52:22Z", "color": null}, {"id": "kobo-59663f02-cb2b-4ab5-b094-e5b5d8bd12dd", "source": "kobo", "text": "Ook de natuurbeleving van de romantische wandelaar (of wadloper), die zich in de vrije natuur waagt om er gelouterd en overweldigd uit terug te keren, is aan revisie toe.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-12T20:52:22.000", "color": 4}, {"id": "kobo-annot-a33150eb883e3149", "source": "kobo", "text": "Het gangbare idee van de Verlichting, dat wetenschap en techniek de mens ten dienste staan om de natuur te onderwerpen, is sleets geraakt.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-12T20:49:38Z", "color": null}, {"id": "kobo-67e75812-314d-4cc9-b16a-37388770b9b2", "source": "kobo", "text": "Het gangbare idee van de Verlichting, dat wetenschap en techniek de mens ten dienste staan om de natuur te onderwerpen, is sleets geraakt.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-12T20:49:38.000", "color": 4}, {"id": "kobo-annot-6e43dc46c0ff662e", "source": "kobo", "text": "Er zwermden grote groepen voorlichters over het platteland uit om de kleine boeren hun failliet aan te zeggen. ‘Houdt u er maar mee op,’ zeiden ze. ‘Verkoop de boedel liever aan een ander.’ Op bedrijven als De Waarden en de Stocksterhorn, die voorlopig aan de veilige kant van de lijn zaten, luidde hun boodschap: ‘Groeien of wegwezen.’ Wie er niet in slaagde zijn areaal uit te breiden, zou worden opgeslokt door zijn buren.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-11T21:08:24Z", "color": null}, {"id": "kobo-777995dc-e84d-4eec-b1bb-760cd8adcb04", "source": "kobo", "text": "Er zwermden grote groepen voorlichters over het platteland uit om de kleine boeren hun failliet aan te zeggen. ‘Houdt u er maar mee op,’ zeiden ze. ‘Verkoop de boedel liever aan een ander.’ Op bedrijven als De Waarden en de Stocksterhorn, die voorlopig aan de veilige kant van de lijn zaten, luidde hun boodschap: ‘Groeien of wegwezen.’ Wie er niet in slaagde zijn areaal uit te breiden, zou worden opgeslokt door zijn buren.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-11T21:08:24.000", "color": 4}, {"id": "kobo-annot-c4396dab9ce0426b", "source": "kobo", "text": "De stedeling, vooral diegene die al geprofiteerd had van de nieuwe welvaart, stond als eerste stil bij de waarde van de ongerepte natuur. Waar was die nog te vinden? De laatste snipper oerbos was in 1871 bij Beekbergen gekapt, het hoogveen was ontgonnen en de Drentse hei was wel mooi, maar niet natuurlijk.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-11T20:44:59Z", "color": null}, {"id": "kobo-46356e95-999d-4e56-a276-4078b089212e", "source": "kobo", "text": "De stedeling, vooral diegene die al geprofiteerd had van de nieuwe welvaart, stond als eerste stil bij de waarde van de ongerepte natuur. Waar was die nog te vinden? De laatste snipper oerbos was in 1871 bij Beekbergen gekapt, het hoogveen was ontgonnen en de Drentse hei was wel mooi, maar niet natuurlijk.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-11T20:44:59.000", "color": 4}, {"id": "kobo-annot-3a85dd4ce5e24e34", "source": "kobo", "text": "Dat een handvol ornithologen de Dollardwerken wist op te houden door aan de rem te trekken van het inspraak- en beroepsrecht was in de woorden van de ingenieurs ‘een uitwas van de democratie", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-11T20:42:54Z", "color": null}, {"id": "kobo-df36c010-2191-4802-8ac0-bc91fdabdebf", "source": "kobo", "text": "Dat een handvol ornithologen de Dollardwerken wist op te houden door aan de rem te trekken van het inspraak- en beroepsrecht was in de woorden van de ingenieurs ‘een uitwas van de democratie", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-11T20:42:54.000", "color": 4}, {"id": "kobo-annot-56b0fcca1ecf6c59", "source": "kobo", "text": "Een van hun pleitbezorgers was Jan Abrahamse, ‘de uitvinder van het wadlopen", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-11T20:38:57Z", "color": null}, {"id": "kobo-121e7395-7a85-466d-a87d-69df6ffca8f8", "source": "kobo", "text": "Een van hun pleitbezorgers was Jan Abrahamse, ‘de uitvinder van het wadlopen", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-11T20:38:57.000", "color": 4}, {"id": "kobo-annot-b5c633aac768808c", "source": "kobo", "text": "Maar Mansholt wilde niet zomaar de boerenstand uitdunnen. Hij stelde schaalvergrotingen in het vooruitzicht tot productie-eenheden van vierhonderd koeien in de veehouderij en tot agro-industriële ondernemingen van vijfhonderd tot duizend hectare in de akkerbouw.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-10T20:55:41Z", "color": null}, {"id": "kobo-1c734c0b-4a21-4ed7-92e4-04a056af25de", "source": "kobo", "text": "Maar Mansholt wilde niet zomaar de boerenstand uitdunnen. Hij stelde schaalvergrotingen in het vooruitzicht tot productie-eenheden van vierhonderd koeien in de veehouderij en tot agro-industriële ondernemingen van vijfhonderd tot duizend hectare in de akkerbouw.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-10T20:55:41.000", "color": 4}, {"id": "kobo-annot-882e4610d1c13b54", "source": "kobo", "text": "Machiavelli over het menselijk onvermogen om vastgeroeste standpunten te laten varen en ongelijk toe te geven.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-09T20:26:21Z", "color": null}, {"id": "kobo-3f4d4f81-6538-4828-8984-b088802e0db2", "source": "kobo", "text": "Machiavelli over het menselijk onvermogen om vastgeroeste standpunten te laten varen en ongelijk toe te geven.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-09T20:26:21.000", "color": 4}, {"id": "kobo-annot-adbc4de2bd3d7191", "source": "kobo", "text": "boeren in zwarte gewaden werd weggevoerd.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-09T20:21:24Z", "color": null}, {"id": "kobo-41e8261b-2f10-4e57-b2b9-3f0254da300a", "source": "kobo", "text": "boeren in zwarte gewaden werd weggevoerd.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-09T20:21:24.000", "color": 4}, {"id": "kobo-annot-50b8f35b728d0400", "source": "kobo", "text": "Waartoe waren de boeren in staat? Mansholt voelde aan den lijve wat er gebeurde als je aan de grondslag van het boerenbestaan morrelde. Wie een boer van zijn erf probeerde te slepen, maakte oerkrachten los – daar was geen ontkomen aan.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-09T20:21:09Z", "color": null}, {"id": "kobo-f9cfc24a-e449-425c-a803-7c5766ff313b", "source": "kobo", "text": "Waartoe waren de boeren in staat? Mansholt voelde aan den lijve wat er gebeurde als je aan de grondslag van het boerenbestaan morrelde. Wie een boer van zijn erf probeerde te slepen, maakte oerkrachten los – daar was geen ontkomen aan.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-09T20:21:09.000", "color": 4}, {"id": "kobo-annot-5adf64416cf766fa", "source": "kobo", "text": "Een rem op de productie door het areaal cultuurgrond in te krimpen, gelijk met een afvloeiingsregeling voor de helft van alle Europese boeren – op die twee pijlers rustte het Plan Mansholt.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-09T20:18:02Z", "color": null}, {"id": "kobo-7c36aee3-e5f7-43c4-93e6-53940b0d5b11", "source": "kobo", "text": "Een rem op de productie door het areaal cultuurgrond in te krimpen, gelijk met een afvloeiingsregeling voor de helft van alle Europese boeren – op die twee pijlers rustte het Plan Mansholt.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-09T20:18:02.000", "color": 4}, {"id": "kobo-annot-8533484b66c2e001", "source": "kobo", "text": ". Door de stofkam door het pittoreske platteland te halen, net zo lang tot de helft van de agrariërs verdwenen was, wilde hij de boerenstand eens en voor altijd van sentiment ontdoen.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-09T20:16:09Z", "color": null}, {"id": "kobo-591dacb7-f699-4837-9851-6ffd9ec9bf9b", "source": "kobo", "text": ". Door de stofkam door het pittoreske platteland te halen, net zo lang tot de helft van de agrariërs verdwenen was, wilde hij de boerenstand eens en voor altijd van sentiment ontdoen.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-09T20:16:09.000", "color": 4}, {"id": "kobo-annot-7131f2870e572d91", "source": "kobo", "text": "zijn tienjarenplan, het Memorandum ter Hervorming van de Landbouw in de Europese Economische Gemeenschap, dat met bijlagen en al vijfhonderd pagina’s gaat tellen. Dit magnum opus uit 1969, het Plan Mansholt, laat zich in een haast bijbelse spreuk samenvatten: ‘Nog voor het volgende decennium voorbij is, zullen er van de tien miljoen boeren nog vijf miljoen over zijn.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-09T20:14:45Z", "color": null}, {"id": "kobo-28aa99b8-fbc6-4890-9475-4ba7026790a4", "source": "kobo", "text": "zijn tienjarenplan, het Memorandum ter Hervorming van de Landbouw in de Europese Economische Gemeenschap, dat met bijlagen en al vijfhonderd pagina’s gaat tellen. Dit magnum opus uit 1969, het Plan Mansholt, laat zich in een haast bijbelse spreuk samenvatten: ‘Nog voor het volgende decennium voorbij is, zullen er van de tien miljoen boeren nog vijf miljoen over zijn.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-09T20:14:45.000", "color": 4}, {"id": "kobo-annot-07547773ba3563e9", "source": "kobo", "text": "John F. Kennedy. In juni 1963 verschijnt hij op het balkon van het stadhuis in West-Berlijn, en kijkt uit over de gespleten stad. ‘Vrijheid is ondeelbaar,’ zegt de Amerikaanse president, ‘en wanneer er ook maar één mens in slavernij leeft, is niemand vrij.’ Het gejuich en gejoel op het plein beneden is nog maar half verstomd als hij nog een slotzin uitspreekt: ‘Alle vrije mensen, waar zij ook mogen wonen, zijn inwoners van Berlijn, en daarom, als een vrij man, ben ik trots om te zeggen: Ich bin ein Berliner.’", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-08T21:07:31Z", "color": null}, {"id": "kobo-7ae159cb-403b-4fe2-9738-9cb9b9f4734a", "source": "kobo", "text": "John F. Kennedy. \n In juni 1963 verschijnt hij op het balkon van het stadhuis in West-Berlijn, en kijkt uit over de gespleten stad. \n ‘Vrijheid is ondeelbaar,’ zegt de Amerikaanse president, ‘en wanneer er ook maar één mens in slavernij leeft, is niemand vrij.’ \n Het gejuich en gejoel op het plein beneden is nog maar half verstomd als hij nog een slotzin uitspreekt: ‘Alle vrije mensen, waar zij ook mogen wonen, zijn inwoners van Berlijn, en daarom, als een vrij man, ben ik trots om te zeggen: Ich bin ein Berliner.’", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-08T21:07:31.000", "color": 4}, {"id": "kobo-annot-7b2ad908c0361ac1", "source": "kobo", "text": "Sicco laat de kalender op 31-12-1962 hangen. Veertien etmalen en vele sessies later, om half drie ’s nachts, kliedert hij zijn laatste tableau vol. Pijltjes, haakjes, procenttekens. ‘Mijne heren, dit is het slot. Er is geen debat meer mogelijk. Eén woord van u en ik trek mijn voorstel in.’ Er stijgt gemor op, maar de rood aangelopen koppen zijn te moe of te murw om zich nog te verzetten. Sicco leest zijn laatste bod hardop en zonder haperingen voor, dan gaat hij het rondje af. Aan minister Schwarz van Duitsland is te zien dat hij aarzelt. Vijf landen zeggen ‘ja’. Schwarz doet zijn mond open, hij wil iets zeggen over de gevolgde procedure, maar wordt afgekapt. ‘Herr Minister! Ja oder nein?’", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-08T21:03:33Z", "color": null}, {"id": "kobo-7d079680-cfcd-48e0-b705-a66b1df02f59", "source": "kobo", "text": "Sicco laat de kalender op 31-12-1962 hangen. Veertien etmalen en vele sessies later, om half drie ’s nachts, kliedert hij zijn laatste tableau vol. Pijltjes, haakjes, procenttekens. ‘Mijne heren, dit is het slot. Er is geen debat meer mogelijk. Eén woord van u en ik trek mijn voorstel in.’ Er stijgt gemor op, maar de rood aangelopen koppen zijn te moe of te murw om zich nog te verzetten. Sicco leest zijn laatste bod hardop en zonder haperingen voor, dan gaat hij het rondje af. Aan minister Schwarz van Duitsland is te zien dat hij aarzelt. Vijf landen zeggen ‘ja’. Schwarz doet zijn mond open, hij wil iets zeggen over de gevolgde procedure, maar wordt afgekapt. ‘Herr Minister! Ja oder nein?’", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-08T21:03:33.000", "color": 4}, {"id": "kobo-annot-8e1962785a0e5c7a", "source": "kobo", "text": "De rode boer Sicco Mansholt had in Nederland een Landwirtschaftswunder tot stand gebracht. De loftuiting ten spijt was Adenauer van mening dat Mansholt maar genoegen moest nemen met het vice-voorzitterschap.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-08T20:58:12Z", "color": null}, {"id": "kobo-c7da44ea-acb4-4c50-9370-429460c4ca7f", "source": "kobo", "text": "De rode boer Sicco Mansholt had in Nederland een Landwirtschaftswunder tot stand gebracht. \n De loftuiting ten spijt was Adenauer van mening dat Mansholt maar genoegen moest nemen met het vice-voorzitterschap.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-08T20:58:12.000", "color": 4}, {"id": "kobo-annot-020bd745aca53460", "source": "kobo", "text": "‘Wie is die Mansholt toch?’ ‘Hij is een socialist en hij is boer,’ legde Mozer uit.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-08T20:57:37Z", "color": null}, {"id": "kobo-9dfebace-16ad-4058-8185-89e098cae980", "source": "kobo", "text": "‘Wie is die Mansholt toch?’ \n ‘Hij is een socialist en hij is boer,’ legde Mozer uit.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-08T20:57:37.000", "color": 4}, {"id": "kobo-annot-5cefd162ab1bf1a9", "source": "kobo", "text": "Maar die beriepen zich op Marx zelf. Beloon je de boer, zo haalden ze de meester aan, dan betaalt de arbeider het gelag. Brood hoorde zo goedkoop mogelijk te zijn, of de graanteler daar nu onder leed of niet. Het leerstuk van de familie Mansholt, dat de hoogte van de broodprijs het beschavingspeil aangeeft, stak daarbij als bourgeois af.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-08T20:54:41Z", "color": null}, {"id": "kobo-a02a4944-6fe1-4bc9-9b89-d5654a7d1b8c", "source": "kobo", "text": "Maar die beriepen zich op Marx zelf. Beloon je de boer, zo haalden ze de meester aan, dan betaalt de arbeider het gelag. Brood hoorde zo goedkoop mogelijk te zijn, of de graanteler daar nu onder leed of niet. \n Het leerstuk van de familie Mansholt, dat de hoogte van de broodprijs het beschavingspeil aangeeft, stak daarbij als bourgeois af.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-08T20:54:41.000", "color": 4}, {"id": "kobo-annot-6659671e8ef7f63a", "source": "kobo", "text": "landbouw weten is dat er wel eens een grassprietje tussen de stoeptegels groeit.’", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-08T20:54:22Z", "color": null}, {"id": "kobo-cc5c3afe-f671-441a-87a2-4ae50e717e8a", "source": "kobo", "text": "landbouw weten is dat er wel eens een grassprietje tussen de stoeptegels groeit.’", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-08T20:54:22.000", "color": 4}, {"id": "kobo-annot-6e305eee342990f8", "source": "kobo", "text": "nota had hij de ministerraad overvallen.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-08T20:51:32Z", "color": null}, {"id": "kobo-c4c4cd3d-616d-4953-8131-1c14fe8d5b83", "source": "kobo", "text": "nota had hij de ministerraad overvallen.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-08T20:51:32.000", "color": 4}, {"id": "kobo-annot-86e5d22a4489c165", "source": "kobo", "text": "In 1953 ontstond de eerste boterberg. ‘De schaarste is veranderd in overvloed,’ constateerde Sicco tevreden – al moet hij toen al nattigheid hebben gevoeld. Het wegwerken van die voorraden, zonder dat de prijs inzakte, was een kostbare zaak.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-08T20:51:26Z", "color": null}, {"id": "kobo-e594d719-0b08-4e48-8ba5-75f70c0ccf23", "source": "kobo", "text": "In 1953 ontstond de eerste boterberg. ‘De schaarste is veranderd in overvloed,’ constateerde Sicco tevreden – al moet hij toen al nattigheid hebben gevoeld. \n Het wegwerken van die voorraden, zonder dat de prijs inzakte, was een kostbare zaak.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-08T20:51:26.000", "color": 4}, {"id": "kobo-annot-c20bed7ff5a8eb94", "source": "kobo", "text": "West-Europa moet samenwerken,’ zei hij in 1948. ‘Het gaat immers niet om het voortbestaan van nationale eenheden en soevereine staten; het gaat om het voortbestaan van West-Europa.’ Wat was het nut van het in stand houden van een lappendeken van landjes die elkaar om de zoveel tijd probeerden te overheersen? ‘West-Europa heeft een taak tussen de beide wereldmachten.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-08T20:49:16Z", "color": null}, {"id": "kobo-5d42ac14-bb4b-45dd-853f-59937ab20b6b", "source": "kobo", "text": "West-Europa moet samenwerken,’ zei hij in 1948. ‘Het gaat immers niet om het voortbestaan van nationale eenheden en soevereine staten; het gaat om het voortbestaan van West-Europa.’ Wat was het nut van het in stand houden van een lappendeken van landjes die elkaar om de zoveel tijd probeerden te overheersen? ‘West-Europa heeft een taak tussen de beide wereldmachten.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-08T20:49:16.000", "color": 4}, {"id": "kobo-annot-5e81a52223a3b58d", "source": "kobo", "text": "Mansholts politiek was uniek in de wereld. Geen kapitalisme en ook geen communisme. ‘De boer wordt arbeider,’ kondigde hij aan. Hij wilde de boerenstand laten opgaan in het proletariaat – zijn manier om de Agrarfrage op te lossen.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-08T20:48:10Z", "color": null}, {"id": "kobo-84a48f40-40f7-43cc-91ec-45d803f0bf13", "source": "kobo", "text": "Mansholts politiek was uniek in de wereld. Geen kapitalisme en ook geen communisme. ‘De boer wordt arbeider,’ kondigde hij aan. Hij wilde de boerenstand laten opgaan in het proletariaat – zijn manier om de Agrarfrage op te lossen.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-08T20:48:10.000", "color": 4}, {"id": "kobo-annot-3c142ef461bc9115", "source": "kobo", "text": "De stabiele, hoge graanprijs stuwde de productie op, maar had als bijwerking dat de kleine, niet-levensvatbare boertjes in leven bleven. Die ‘dwergbedrijfjes’, zoals Sicco ze noemde, waren een sta-in-de-weg voor schaalvergroting en mechanisatie. Met een noodwetje dwong hij ze hun landerijen samen te voegen tot bedrijven van vijf hectare minimaal.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-08T20:46:15Z", "color": null}, {"id": "kobo-a6bac206-dd34-4eef-a54c-ba8569f489b8", "source": "kobo", "text": "De stabiele, hoge graanprijs stuwde de productie op, maar had als bijwerking dat de kleine, niet-levensvatbare boertjes in leven bleven. Die ‘dwergbedrijfjes’, zoals Sicco ze noemde, waren een sta-in-de-weg voor schaalvergroting en mechanisatie. Met een noodwetje dwong hij ze hun landerijen samen te voegen tot bedrijven van vijf hectare minimaal.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-08T20:46:15.000", "color": 4}, {"id": "kobo-annot-b503a8354d62c359", "source": "kobo", "text": "Food and Agriculture Organisation van de Verenigde Naties. Daar klonk de voorspelling dat voor ieder ziek kind dat de artsen in Afrika wisten te redden, in de toekomst twee volwassenen van de honger zouden sterven. Sicco, geschokt door die cijfers, kwam er in zijn speech op terug: ‘Dat wordt dus een wedloop tussen de dokter en de boer en wij zullen zien dat wij die winnen.’", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-08T20:45:08Z", "color": null}, {"id": "kobo-d40a6ddd-2315-47a8-ad89-49d28ed475e6", "source": "kobo", "text": "Food and Agriculture Organisation van de Verenigde Naties. Daar klonk de voorspelling dat voor ieder ziek kind dat de artsen in Afrika wisten te redden, in de toekomst twee volwassenen van de honger zouden sterven. Sicco, geschokt door die cijfers, kwam er in zijn speech op terug: ‘Dat wordt dus een wedloop tussen de dokter en de boer en wij zullen zien dat wij die winnen.’", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-08T20:45:08.000", "color": 4}, {"id": "kobo-annot-47a0e9c33174ea5d", "source": "kobo", "text": ". Het doel: nooit meer hongerwinter. Uit de schriften van zijn grootvader had Sicco geleerd dat een land pas soeverein is als het zichzelf kan voeden. Zelfvoorziening in de landbouw, daar ging het om, met als toverwoorden: kwantiteit, bulk.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-08T20:43:48Z", "color": null}, {"id": "kobo-a4629f1a-a6fe-4bd7-be28-e7a0abf4b205", "source": "kobo", "text": ". Het doel: nooit meer hongerwinter. Uit de schriften van zijn grootvader had Sicco geleerd dat een land pas soeverein is als het zichzelf kan voeden. Zelfvoorziening in de landbouw, daar ging het om, met als toverwoorden: kwantiteit, bulk.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-08T20:43:48.000", "color": 4}, {"id": "kobo-annot-ae573e4ae048be37", "source": "kobo", "text": "U neemt de wederopbouw veel te letterlijk. Het gaat erom dat u als minister voorwaarden schept.’", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-08T20:42:57Z", "color": null}, {"id": "kobo-c0de7182-9c8d-4813-a34c-f2daf98a7d0f", "source": "kobo", "text": "U neemt de wederopbouw veel te letterlijk. Het gaat erom dat u als minister voorwaarden schept.’", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-08T20:42:57.000", "color": 4}, {"id": "kobo-annot-e6346ca7c01a943e", "source": "kobo", "text": "Heringa merkte dat Sicco je een sukkel vond als je hem naar de mond praatte. Als", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-08T20:42:23Z", "color": null}, {"id": "kobo-95759e67-78b8-4640-9c56-34da736e74b2", "source": "kobo", "text": "Heringa merkte dat Sicco je een sukkel vond als je hem naar de mond praatte. Als", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-08T20:42:23.000", "color": 4}, {"id": "kobo-annot-7f947a9b7119b050", "source": "kobo", "text": "Toen de boeren van de ondergelopen Wieringermeer hem vroegen: ‘En wij? Wat moeten wij doen?’ zei hij: ‘Pompen. En niet te veel kankeren.’", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-08T20:39:03Z", "color": null}, {"id": "kobo-638d80e9-7f5e-4815-bba7-17efc767cdca", "source": "kobo", "text": "Toen de boeren van de ondergelopen Wieringermeer hem vroegen: ‘En wij? Wat moeten wij doen?’ zei hij: ‘Pompen. En niet te veel kankeren.’", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-08T20:39:03.000", "color": 4}, {"id": "kobo-annot-38774a36200b2d52", "source": "kobo", "text": "En in 1963, door het Nieuwsblad uitgeroepen tot ‘het jaar van de gaskoorts’, blijkt er 1100 miljard kuub in de aardbodem te zitten.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-06T20:37:27Z", "color": null}, {"id": "kobo-c4fa5a0d-7bc7-47ca-86d5-d0dd88f9ec61", "source": "kobo", "text": "En in 1963, door het Nieuwsblad uitgeroepen tot ‘het jaar van de gaskoorts’, blijkt er 1100 miljard kuub in de aardbodem te zitten.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-06T20:37:27.000", "color": 4}, {"id": "kobo-annot-b2d38ef0dcb0ab46", "source": "kobo", "text": "grondrentetheorie,", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-06T20:30:05Z", "color": null}, {"id": "kobo-968a3027-c6b9-42c3-9633-7f07d23cfb92", "source": "kobo", "text": "grondrentetheorie,", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-06T20:30:05.000", "color": 4}, {"id": "kobo-annot-9bc0131050e4c29f", "source": "kobo", "text": "Churchills uitspraak: ‘Wie in zijn jonge jaren geen socialist is, heeft geen hart. Wie het op latere leeftijd nog steeds is, heeft geen hersenen.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-04T20:22:56Z", "color": null}, {"id": "kobo-e20414e6-183d-43e6-89b1-f79d7afac7c1", "source": "kobo", "text": "Churchills uitspraak: ‘Wie in zijn jonge jaren geen socialist is, heeft geen hart. Wie het op latere leeftijd nog steeds is, heeft geen hersenen.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-04T20:22:56.000", "color": 4}, {"id": "kobo-annot-49fde8533be30b54", "source": "kobo", "text": "In drie etmalen stroomt de polder vol met 750 miljoen kuub water. Een pachter en zijn onderduiker, die het evacuatiebevel negeren, houden een logboek bij. Om half negen de volgende ochtend stroomt het water hun boerderij binnen. ’s Middags bereikt het peil de vensterbank. ‘Het bloeiend koolzaad is nu overal verzwolgen,’ noteren ze. ‘De kippen die eerst nog op de drijvende strobalen zaten zijn verdwenen.’ Op de derde ochtend staat er dertig centimeter water op de slaapkamer boven. ‘Er waait een krachtige zuidwestenwind; we zien een noodwoning voorbijdrijven.’ Als er scheurtjes in de muren ontstaan besluiten de twee toch maar op het dak te klimmen en om hulp te zwaaien. Het water staat dan gemiddeld 3,75 meter diep.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-03T21:28:32Z", "color": null}, {"id": "kobo-8a8d9c94-f370-44ab-ae74-bd44127185c9", "source": "kobo", "text": "In drie etmalen stroomt de polder vol met 750 miljoen kuub water. Een pachter en zijn onderduiker, die het evacuatiebevel negeren, houden een logboek bij. Om half negen de volgende ochtend stroomt het water hun boerderij binnen. ’s Middags bereikt het peil de vensterbank. ‘Het bloeiend koolzaad is nu overal verzwolgen,’ noteren ze. ‘De kippen die eerst nog op de drijvende strobalen zaten zijn verdwenen.’ Op de derde ochtend staat er dertig centimeter water op de slaapkamer boven. ‘Er waait een krachtige zuidwestenwind; we zien een noodwoning voorbijdrijven.’ Als er scheurtjes in de muren ontstaan besluiten de twee toch maar op het dak te klimmen en om hulp te zwaaien. Het water staat dan gemiddeld 3,75 meter diep.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-03T21:28:32.000", "color": 4}, {"id": "kobo-annot-54cb21e17a4fde1a", "source": "kobo", "text": "Maar Londen antwoordt niet, en om twintig over twaalf hoort iedereen, Han, Henny, Sicco, en ook Adri, die zijn gezin helpt evacueren – het maakt niet uit waar zij zich bevinden twee daverende klappen, zo intens dat de lucht ervan trilt.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-03T21:27:20Z", "color": null}, {"id": "kobo-0b7ac717-e53d-42bf-b620-b7ad1f57261f", "source": "kobo", "text": "Maar Londen antwoordt niet, en om twintig over twaalf hoort iedereen, Han, Henny, Sicco, en ook Adri, die zijn gezin helpt evacueren – het maakt niet uit waar zij zich bevinden twee daverende klappen, zo intens dat de lucht ervan trilt.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-03T21:27:20.000", "color": 4}, {"id": "kobo-annot-c15b4613cd9266ac", "source": "kobo", "text": ". Maar nadat begin 1944 een van die transporten bij Rustenburg was onderschept, uitlopend op een veldslag met twintig doden, besloot de laadmeester het vervoer voortaan uit te voeren met de voedselschuiten van Sicco Mansholt.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-03T21:12:16Z", "color": null}, {"id": "kobo-fe16fb9f-13b0-460a-a733-bba643b012ec", "source": "kobo", "text": ". Maar nadat begin 1944 een van die transporten bij Rustenburg was onderschept, uitlopend op een veldslag met twintig doden, besloot de laadmeester het vervoer voortaan uit te voeren met de voedselschuiten van Sicco Mansholt.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-03T21:12:16.000", "color": 4}, {"id": "kobo-annot-5e6e0b220877b503", "source": "kobo", "text": "Roerend in zijn koffie formuleerde De Quay zijn voorstel: of Sicco in de Unie de boerenstand wilde vertegenwoordigen? Wat een naïeve man, dacht Mansholt. ‘Maakt u zich geen illusies, professor,’ antwoordde hij. ‘Elke politieke actie onder het toeziend oog van de bezetter loopt fout. Er is maar een keus: het verzet.’", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-03T21:07:48Z", "color": null}, {"id": "kobo-3e6fd254-94a9-446a-a0e7-a77883478c8c", "source": "kobo", "text": "Roerend in zijn koffie formuleerde De Quay zijn voorstel: of Sicco in de Unie de boerenstand wilde vertegenwoordigen? \n Wat een naïeve man, dacht Mansholt. ‘Maakt u zich geen illusies, professor,’ antwoordde hij. ‘Elke politieke actie onder het toeziend oog van de bezetter loopt fout. Er is maar een keus: het verzet.’", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-03T21:07:48.000", "color": 4}, {"id": "kobo-annot-857473452f43d79c", "source": "kobo", "text": "De bedachte, op de tekentafel ingetekende dorpen met namen als Middenmeer en Slootdorp kregen elk drie kerken, een katholieke, een gereformeerde, een hervormde.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-03T20:55:31Z", "color": null}, {"id": "kobo-c268bb98-d5b6-4efb-a69b-2db12ddbf65c", "source": "kobo", "text": "De bedachte, op de tekentafel ingetekende dorpen met namen als Middenmeer en Slootdorp kregen elk drie kerken, een katholieke, een gereformeerde, een hervormde.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-03T20:55:31.000", "color": 4}, {"id": "kobo-annot-65e88e42643a9f5a", "source": "kobo", "text": "De lege polder leek een paradijs voor akkerbouwers, maar na de eerste koolzaadoogst begon de zilte bodem – die zeewater gewend was, geen wind – te kruimelen en te stuiven. Er waren dagen dat er zulke stofwolken door de lucht joegen dat de vliegtuigjes van klm Aerocarto niet konden uitvliegen om de polder te fotograferen.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-03T20:51:08Z", "color": null}, {"id": "kobo-d87b20ef-ac84-44bb-8bdf-c3f665112dd9", "source": "kobo", "text": "De lege polder leek een paradijs voor akkerbouwers, maar na de eerste koolzaadoogst begon de zilte bodem – die zeewater gewend was, geen wind – te kruimelen en te stuiven. Er waren dagen dat er zulke stofwolken door de lucht joegen dat de vliegtuigjes van klm Aerocarto niet konden uitvliegen om de polder te fotograferen.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-03T20:51:08.000", "color": 4}, {"id": "kobo-annot-d9c021174dfbbdef", "source": "kobo", "text": "Wie tot de Wieringermeer wilde worden toegelaten, kon formulieren halen bij het Domeinkantoor in Nieuwe Niedorp. De eerste lichtingen bestonden uit ‘staatsboeren’ die een schop in handen gedrukt kregen om te bewijzen dat ze werken konden.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-03T20:48:36Z", "color": null}, {"id": "kobo-0c1469be-e3f1-4cd0-974e-52faa94cb6f4", "source": "kobo", "text": "Wie tot de Wieringermeer wilde worden toegelaten, kon formulieren halen bij het Domeinkantoor in Nieuwe Niedorp. De eerste lichtingen bestonden uit ‘staatsboeren’ die een schop in handen gedrukt kregen om te bewijzen dat ze werken konden.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-03T20:48:36.000", "color": 4}, {"id": "kobo-annot-1825e06ed23beaa3", "source": "kobo", "text": "Bij de inrichting van de Wieringermeer was de slinger doorgeslagen: de beheersneiging was totaal. Ter vervanging van het wrede survival of the fittest had Ter Veen ‘een economische en sociaal-biologische keuring der immigranten’ voorgesteld. De ingenieurs namen dat advies gretig over en beriepen zich op ‘vooraanstaande eugenetici’ die hadden aangetoond dat ‘de gunstige qualitatieve werking, die van den natuurlijken strijd om het bestaan uitgaat, eveneens bereikt kan worden door een rationeele selectie der individuen’.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-03T20:45:48Z", "color": null}, {"id": "kobo-35c32b01-9ba8-4746-a3d6-4ba9617d6c6d", "source": "kobo", "text": "Bij de inrichting van de Wieringermeer was de slinger doorgeslagen: de beheersneiging was totaal. Ter vervanging van het wrede survival of the fittest had Ter Veen ‘een economische en sociaal-biologische keuring der immigranten’ voorgesteld. De ingenieurs namen dat advies gretig over en beriepen zich op ‘vooraanstaande eugenetici’ die hadden aangetoond dat ‘de gunstige qualitatieve werking, die van den natuurlijken strijd om het bestaan uitgaat, eveneens bereikt kan worden door een rationeele selectie der individuen’.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-03T20:45:48.000", "color": 4}, {"id": "kobo-annot-88c0cc17b8cecc90", "source": "kobo", "text": "Dijkgraaf-rentmeester ir. Albert Ovinge wachtte niet op instructies van prins Bernhard – de bevelhebber in ballingschap. Hij liet de profieltekeningen verdwijnen en zei dat hij ze nergens kon vinden.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-02T20:50:54Z", "color": null}, {"id": "kobo-e23087c2-7436-4a0d-90c3-d6cda2c50b39", "source": "kobo", "text": "Dijkgraaf-rentmeester ir. Albert Ovinge wachtte niet op instructies van prins Bernhard – de bevelhebber in ballingschap. Hij liet de profieltekeningen verdwijnen en zei dat hij ze nergens kon vinden.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-02T20:50:54.000", "color": 4}, {"id": "kobo-annot-7e1eadd788951a82", "source": "kobo", "text": "Bij het ondermijnen van de dijk waren de Duitsers op een onbekend laagje Nederland gestuit. Onder het vernis van gemeenteraad en Tweede Kamer bleek een schaduwmacht te sluimeren van polderbestuur en waterschap. Deze waterstaat bleek een krachtige staat-in-een-staat die in crisissituaties geruisloos het roer overnam, of de koningin nu in het land was of niet. In de schaduw van elke burgemeester, zo ontdekten de Duitsers, stond een dijkgraaf. Die bleek een duurdere ambtsketen te dragen, meer te verdienen en als het erop aankwam: meer bevoegdheden te bezitten.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-02T20:50:16Z", "color": null}, {"id": "kobo-87dad7e1-7b67-4477-9be2-1787e78adc25", "source": "kobo", "text": "Bij het ondermijnen van de dijk waren de Duitsers op een onbekend laagje Nederland gestuit. Onder het vernis van gemeenteraad en Tweede Kamer bleek een schaduwmacht te sluimeren van polderbestuur en waterschap. Deze waterstaat bleek een krachtige staat-in-een-staat die in crisissituaties geruisloos het roer overnam, of de koningin nu in het land was of niet. In de schaduw van elke burgemeester, zo ontdekten de Duitsers, stond een dijkgraaf. Die bleek een duurdere ambtsketen te dragen, meer te verdienen en als het erop aankwam: meer bevoegdheden te bezitten.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-02T20:50:16.000", "color": 4}, {"id": "kobo-annot-61d67983a4e21c66", "source": "kobo", "text": "De wufte oppervlakkigheid van den Hollander komt er niet vaak voor. Men laat zijn sympathie wel wat laat merken. Gesloten. Iemand die men niet gaarne mag lijden zal men niet groeten en niet openlijk prijzen. Geen vleiers. Als een Groninger zegt: ‘Ik kom niet,’ dan is ook alle verdere moeite vergeefs.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-01T20:42:12Z", "color": null}, {"id": "kobo-37292d12-4eac-45a0-89f0-0a86c6595c20", "source": "kobo", "text": "De wufte oppervlakkigheid van den Hollander komt er niet vaak voor. Men laat zijn sympathie wel wat laat merken. \n Gesloten. Iemand die men niet gaarne mag lijden zal men niet groeten en niet openlijk prijzen. \n Geen vleiers. Als een Groninger zegt: ‘Ik kom niet,’ dan is ook alle verdere moeite vergeefs.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-06-01T20:42:12.000", "color": 4}, {"id": "kobo-annot-fef9dafc55eea805", "source": "kobo", "text": "Voor de boeren was 1929 al met al een goed jaar. ‘Groot is de betekenis van dit arbeidsconflict geweest op de ontwikkelingsgang van het landbouwbedrijf,’ concludeerde Fekko Ebels, een boer uit Nieuw-Beerta. ‘Er wordt thans doelbewust, systematisch en met voortvarendheid aan de mechanisatie gewerkt.’", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-30T10:13:19Z", "color": null}, {"id": "kobo-3130217a-660e-4b09-9dce-4ca5186f1468", "source": "kobo", "text": "Voor de boeren was 1929 al met al een goed jaar. ‘Groot is de betekenis van dit arbeidsconflict geweest op de ontwikkelingsgang van het landbouwbedrijf,’ concludeerde Fekko Ebels, een boer uit Nieuw-Beerta. ‘Er wordt thans doelbewust, systematisch en met voortvarendheid aan de mechanisatie gewerkt.’", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-30T10:13:19.000", "color": 4}, {"id": "kobo-annot-b5423ebfcb4e95b6", "source": "kobo", "text": ". De kloof tussen boer en arbeider bleef groeien; eigenlijk waren er twee werelden, een kleine en een grote. In de dorpen stonden op korte afstand van elkaar de krappe arbeiderswoninkjes, waar amper ruimte was om te spelen of te ademen. Lang niet alle kinderen pasten in de bedstee; de oudsten sliepen in een kooi naast het varkenshok. Op hun dertiende, na de lagere school, gingen ze werken bij de boer. Dan stonden ze om half vijf op, wasten zich bij de regenton en liepen in een lange sliert over paadjes van aangestampte aarde, langs moestuintjes met ui en lof, naar de afgelegen hoeves in het open veld. Ze stapten uit de dorpskom, en betraden de onmetelijke ruimte van de boeren.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-30T09:54:13Z", "color": null}, {"id": "kobo-b4d87d3a-b724-41fc-870d-900a02fd4e0f", "source": "kobo", "text": ". De kloof tussen boer en arbeider bleef groeien; eigenlijk waren er twee werelden, een kleine en een grote. In de dorpen stonden op korte afstand van elkaar de krappe arbeiderswoninkjes, waar amper ruimte was om te spelen of te ademen. Lang niet alle kinderen pasten in de bedstee; de oudsten sliepen in een kooi naast het varkenshok. Op hun dertiende, na de lagere school, gingen ze werken bij de boer. Dan stonden ze om half vijf op, wasten zich bij de regenton en liepen in een lange sliert over paadjes van aangestampte aarde, langs moestuintjes met ui en lof, naar de afgelegen hoeves in het open veld. Ze stapten uit de dorpskom, en betraden de onmetelijke ruimte van de boeren.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-30T09:54:13.000", "color": 4}, {"id": "kobo-annot-ea87f0446d763323", "source": "kobo", "text": "Grondbezit was sinds de Eerste Wereldoorlog ‘een der meest spekulatieve bezitsvormen’, schreef Bertus, en alleen al daarom moest het worden afgeschaft.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-30T09:19:22Z", "color": null}, {"id": "kobo-4a05a14e-6516-40a4-96a6-47da322369d1", "source": "kobo", "text": "Grondbezit was sinds de Eerste Wereldoorlog ‘een der meest spekulatieve bezitsvormen’, schreef Bertus, en alleen al daarom moest het worden afgeschaft.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-30T09:19:22.000", "color": 4}, {"id": "insta-27036648", "source": "instapaper", "text": "Landbouw • In totaal is er 20.214 km2 landbouwgrond. Dat is meer dan de helft van ons land, als je de Noordzee niet meerekent. Landbouw is bijvoorbeeld akkerland, grasland en kassen.", "note": null, "title": "Van wie is Nederland?", "author": null, "url": "https://www.kadaster.nl/documents/d/kadaster.nl/kadasterrapport-van-wie-is-nederland-30-april-2026", "created_at": "2026-05-28T22:23:09", "color": null}, {"id": "kobo-annot-0dbe8bebd8cfc822", "source": "kobo", "text": "‘Om de talrijke klasse van kleine boeren, die in de eenzaamheid der velden den rijkdom des lands scheppen, bekommert zich bijna geen mensch!", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-27T21:35:54Z", "color": null}, {"id": "kobo-c35bc546-be42-48a4-995e-1047e80c1f39", "source": "kobo", "text": "‘Om de talrijke klasse van kleine boeren, die in de eenzaamheid der velden den rijkdom des lands scheppen, bekommert zich bijna geen mensch!", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-27T21:35:54.000", "color": 4}, {"id": "kobo-annot-c9f32cfcf81eaa72", "source": "kobo", "text": "De landbouw heeft niet zozeer belang bij hooge als wel bij constante graanprijzen.’ Meteen schoot me te binnen wat Sicco me in Wapserveen had verteld: ‘De prijs van een kilo graan pinde ik vast op twee kwartjes – en dat moest zo blijven.’ Constante graanprijzen! Zo was het tijdperk Mansholt dus begonnen:", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-27T21:31:55Z", "color": null}, {"id": "kobo-42fbc6b8-81d7-4157-8c1e-f85a7c7dc7d9", "source": "kobo", "text": "De landbouw heeft niet zozeer belang bij hooge als wel bij constante graanprijzen.’ \n Meteen schoot me te binnen wat Sicco me in Wapserveen had verteld: ‘De prijs van een kilo graan pinde ik vast op twee kwartjes – en dat moest zo blijven.’ \n Constante graanprijzen! Zo was het tijdperk Mansholt dus begonnen:", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-27T21:31:55.000", "color": 4}, {"id": "kobo-annot-ccfba1c798360615", "source": "kobo", "text": "Derk betoogt dat de hoogte van de graanprijzen het ontwikkelingspeil van de mensheid aangeeft. Hoe duurder het brood, hoe beschaafder het volk.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-27T21:28:34Z", "color": null}, {"id": "kobo-8538f289-1f17-4e9f-84bc-2642d38070c7", "source": "kobo", "text": "Derk betoogt dat de hoogte van de graanprijzen het ontwikkelingspeil van de mensheid aangeeft. Hoe duurder het brood, hoe beschaafder het volk.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-27T21:28:34.000", "color": 4}, {"id": "kobo-annot-c98e62799d91eb4b", "source": "kobo", "text": "Over de internationale arbeidsverdeling en de prijsvorming van het broodkoren. Dit negentien pagina’s tellende werkje uit 1896 zag ik eerst over het hoofd. Omdat het uit elkaar gevallen was, zaten de losse blaadjes in een apart vel pakpapier gevouwen. Sicco had het letterlijk stukgelezen. Hij had de woorden van zijn grootvader met potlood onderstreept, en her en der in de kantlijn stonden instemmende uitroeptekens. Dus dit was de bron waaruit de latere landbouwhervormer van Europa had gedronken. Met deze tekst in de hand kon ik niet alleen de ideeënwereld van Derk ontsluiten, maar ook – gezien de uitroeptekens en potloodstrepen – die van Sicco.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-27T21:27:24Z", "color": null}, {"id": "kobo-0d683377-ddbf-4dd3-9666-bd7c80e17b55", "source": "kobo", "text": "Over de internationale arbeidsverdeling en de prijsvorming van het broodkoren. \n Dit negentien pagina’s tellende werkje uit 1896 zag ik eerst over het hoofd. Omdat het uit elkaar gevallen was, zaten de losse blaadjes in een apart vel pakpapier gevouwen. Sicco had het letterlijk stukgelezen. Hij had de woorden van zijn grootvader met potlood onderstreept, en her en der in de kantlijn stonden instemmende uitroeptekens. Dus dit was de bron waaruit de latere landbouwhervormer van Europa had gedronken. Met deze tekst in de hand kon ik niet alleen de ideeënwereld van Derk ontsluiten, maar ook – gezien de uitroeptekens en potloodstrepen – die van Sicco.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-27T21:27:24.000", "color": 4}, {"id": "kobo-annot-c68a9223086c43de", "source": "kobo", "text": "Alleen de boeren willen er niet aan,’ wierp ik tegen. ‘Die zweren bij “Boerenland in boerenhand”.’ ‘Boeren zien het bezit van de grond als voorwaarde voor hun bestaan,’ zei de landbouwhervormer. ‘Ik niet.’", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-25T20:30:59Z", "color": null}, {"id": "kobo-36055adf-d878-40c3-b3a5-fee4c884ca69", "source": "kobo", "text": "Alleen de boeren willen er niet aan,’ wierp ik tegen. ‘Die zweren bij “Boerenland in boerenhand”.’ \n ‘Boeren zien het bezit van de grond als voorwaarde voor hun bestaan,’ zei de landbouwhervormer. ‘Ik niet.’", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-25T20:30:59.000", "color": 4}, {"id": "kobo-annot-30703ae5292a739a", "source": "kobo", "text": "speet het Sicco Mansholt nog altijd dat hij er niet in was geslaagd de landbouwgrond in Europa te nationaliseren. ‘De grond behoort in handen van de staat,’ zei hij op absolute toon. ‘Dat is een van de grondslagen van mijn familie.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-25T20:30:27Z", "color": null}, {"id": "kobo-8a53185d-b648-4190-bd58-6cc27fcac6db", "source": "kobo", "text": "speet het Sicco Mansholt nog altijd dat hij er niet in was geslaagd de landbouwgrond in Europa te nationaliseren. \n ‘De grond behoort in handen van de staat,’ zei hij op absolute toon. ‘Dat is een van de grondslagen van mijn familie.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-25T20:30:27.000", "color": 4}, {"id": "kobo-annot-a6b713468cf46704", "source": "kobo", "text": "Op 28 mei 1904 stierf hij, vijfenveertig jaar oud, aan een hartaanval, de Stocksterhorn nalatend aan zijn zoon Jan Jacob. Postuum is er voor hem (‘dit autochtoon genie, lichamelijk en geestelijk van groot formaat’) een granieten gedenkzuil opgericht op de kop van het B.L. Tijdenskanaal.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-25T20:28:14Z", "color": null}, {"id": "kobo-920ff9e6-3a1e-4ed0-88d3-b3f4dc7e8778", "source": "kobo", "text": "Op 28 mei 1904 stierf hij, vijfenveertig jaar oud, aan een hartaanval, de Stocksterhorn nalatend aan zijn zoon Jan Jacob. Postuum is er voor hem (‘dit autochtoon genie, lichamelijk en geestelijk van groot formaat’) een granieten gedenkzuil opgericht op de kop van het B.L. Tijdenskanaal.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-25T20:28:14.000", "color": 4}, {"id": "kobo-annot-e6cfc26c517b6462", "source": "kobo", "text": "Multatuli en Domela Nieuwenhuis.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-20T20:02:20Z", "color": null}, {"id": "kobo-7c9cbd40-a136-453c-ae6c-fd6cc6d96249", "source": "kobo", "text": "Multatuli en Domela Nieuwenhuis.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-20T20:02:20.000", "color": 4}, {"id": "kobo-annot-62aa726d2150d5c8", "source": "kobo", "text": "Meer en meer weideland werd gescheurd, zodat het Oldambt van lapjes gras en groente veranderde in een groot korenveld. Het ‘breken van de griede’ luidde de teloorgang in van het gemengd bedrijf. Op het houden van melkvee, varkens en kippen werd voortaan neergekeken. Graan was aanzien – en je kon er jenever van stoken. Maar zonder dat iemand het in de gaten had sloeg de balans door: naast een arbeidspiek in de zomer ontstond er massawerkloosheid in de winter. Als in het voorjaar het land honderdvoudig groen kleurde, was er werk voor iedereen.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-19T20:20:06Z", "color": null}, {"id": "kobo-e54a1d26-dcaf-4811-89e3-2f9c938a039d", "source": "kobo", "text": "Meer en meer weideland werd gescheurd, zodat het Oldambt van lapjes gras en groente veranderde in een groot korenveld. Het ‘breken van de griede’ luidde de teloorgang in van het gemengd bedrijf. Op het houden van melkvee, varkens en kippen werd voortaan neergekeken. Graan was aanzien – en je kon er jenever van stoken. Maar zonder dat iemand het in de gaten had sloeg de balans door: naast een arbeidspiek in de zomer ontstond er massawerkloosheid in de winter. Als in het voorjaar het land honderdvoudig groen kleurde, was er werk voor iedereen.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-19T20:20:06.000", "color": 4}, {"id": "kobo-annot-d097851f303b5275", "source": "kobo", "text": "Het was alsof de landbouwers met de komst van de guano en kort daarop de uitvinding van de kunstmest – een troefkaart tegen de kanselboodschap in handen kregen. ‘Binnenkort kunnen we alles,’ zei een boer tegen de dominee, en wijzend op een zak kunstmest: ‘Daar staat mijn God.’", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-19T20:17:25Z", "color": null}, {"id": "kobo-baad26b8-4189-4f13-bb05-6231944d2ced", "source": "kobo", "text": "Het was alsof de landbouwers met de komst van de guano en kort daarop de uitvinding van de kunstmest – een troefkaart tegen de kanselboodschap in handen kregen. ‘Binnenkort kunnen we alles,’ zei een boer tegen de dominee, en wijzend op een zak kunstmest: ‘Daar staat mijn God.’", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-19T20:17:25.000", "color": 4}, {"id": "kobo-annot-c2412f7f18b00f71", "source": "kobo", "text": "Het Oldambt, dat door de januarivloed van 1277 tot een smal schiereiland in de Dollard was geslepen, veranderde van vorm en karakter. Buiten de kom van de vissersdorpen verrezen ‘opstrekkende heerden’: boerderijen die zich uitstrekten tot in zee.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-19T20:11:34Z", "color": null}, {"id": "kobo-e112248f-f748-4845-b7eb-3e1abb742a6e", "source": "kobo", "text": "Het Oldambt, dat door de januarivloed van 1277 tot een smal schiereiland in de Dollard was geslepen, veranderde van vorm en karakter. Buiten de kom van de vissersdorpen verrezen ‘opstrekkende heerden’: boerderijen die zich uitstrekten tot in zee.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-19T20:11:34.000", "color": 4}, {"id": "kobo-annot-f4d17127e9c23a45", "source": "kobo", "text": "Merkwaardig genoeg waren het de herenboeren zelf die het socialisme in het Oldambt hadden geïntroduceerd. Dat gebeurde onbedoeld. Per ongeluk. Bij wijze van historische vergissing.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-18T21:07:48Z", "color": null}, {"id": "kobo-2622e552-adaf-4815-a341-209117c31eed", "source": "kobo", "text": "Merkwaardig genoeg waren het de herenboeren zelf die het socialisme in het Oldambt hadden geïntroduceerd. Dat gebeurde onbedoeld. Per ongeluk. Bij wijze van historische vergissing.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-18T21:07:48.000", "color": 4}, {"id": "kobo-annot-d50743846aaac8e7", "source": "kobo", "text": "En toen zei hij iets waar hij later spijt van zou krijgen. In een rokerig zaaltje in een van de verste uithoeken van Nederland koos Boelo Tijdens – in de ogen van de arbeiders een van de ‘tsaren van het graan’ – voor de weg van de revolutie.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-18T21:07:08Z", "color": null}, {"id": "kobo-d7c042b8-3e8f-4018-84d1-140d9d93d8ef", "source": "kobo", "text": "En toen zei hij iets waar hij later spijt van zou krijgen. In een rokerig zaaltje in een van de verste uithoeken van Nederland koos Boelo Tijdens – in de ogen van de arbeiders een van de ‘tsaren van het graan’ – voor de weg van de revolutie.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-18T21:07:08.000", "color": 4}, {"id": "kobo-annot-0c0866eef530fa1e", "source": "kobo", "text": "Omdat de prijs van graan de spil is van de landbouw, die de boerenstand neerdrukt of verheft, dompelde de prijsval het hele Europese platteland in een crisis. Er kwam een miljoenenuittocht van armlastige boertjes en keuters op gang, die, gebruik makend van de oceaanstomer, zich in Amerika, Canada of Australië gingen vestigen. Om aldaar nog meer graan te produceren.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-18T21:04:01Z", "color": null}, {"id": "kobo-e9edb325-612e-4609-9724-6c49396998b3", "source": "kobo", "text": "Omdat de prijs van graan de spil is van de landbouw, die de boerenstand neerdrukt of verheft, dompelde de prijsval het hele Europese platteland in een crisis. Er kwam een miljoenenuittocht van armlastige boertjes en keuters op gang, die, gebruik makend van de oceaanstomer, zich in Amerika, Canada of Australië gingen vestigen. \n Om aldaar nog meer graan te produceren.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-18T21:04:01.000", "color": 4}, {"id": "kobo-annot-4d6702cfad71a995", "source": "kobo", "text": "de boeren op het faillissement afstevenden door de uitvinding van de oceaanstomer: met scheepsladingen tegelijk werd het goedkope Amerikaanse graan op de Europese markt gedumpt. Door de zo goed als gratis grond en het schaalvoordeel van de cornbelt en de Mississippidelta lag de graanprijs in Amerika tien keer lager dan de notering aan de beurs in Amsterdam – wat niet bedreigend was zolang de kosten van het maritieme lange-afstandstransport hoog bleven. Heel abrupt reeg de stoomboot de gescheiden markten aaneen.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-18T21:03:20Z", "color": null}, {"id": "kobo-b6b5b9d4-96c7-467d-9c9c-aa709ba07865", "source": "kobo", "text": "de boeren op het faillissement afstevenden door de uitvinding van de oceaanstomer: met scheepsladingen tegelijk werd het goedkope Amerikaanse graan op de Europese markt gedumpt. \n Door de zo goed als gratis grond en het schaalvoordeel van de cornbelt en de Mississippidelta lag de graanprijs in Amerika tien keer lager dan de notering aan de beurs in Amsterdam – wat niet bedreigend was zolang de kosten van het maritieme lange-afstandstransport hoog bleven. Heel abrupt reeg de stoomboot de gescheiden markten aaneen.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-18T21:03:20.000", "color": 4}, {"id": "kobo-annot-b219617e907ee163", "source": "kobo", "text": "Mansholt streefde naar maximale productiegroei, het altaar waarop hij de natuur en de romantiek van het boerenbestaan offerde.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-17T20:51:25Z", "color": null}, {"id": "kobo-d84b3a93-1914-477d-a412-f84da28fd345", "source": "kobo", "text": "Mansholt streefde naar maximale productiegroei, het altaar waarop hij de natuur en de romantiek van het boerenbestaan offerde.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-17T20:51:25.000", "color": 4}, {"id": "kobo-annot-9c648fec1878a9f7", "source": "kobo", "text": "Sicco Leendert Mansholt. Deze architect van het Brusselse landbouwbeleid was een nazaat van een Groninger herenboer. Als vice-voorzitter van de Europese Commissie had hij in 1968 een plan geschreven, het Mansholt-Memorandum, waarmee hij miljoenen keuterboertjes van hun land verjoeg. Mansholt dreef de kleine boeren als een kudde schapen naar de industrie.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-17T20:44:46Z", "color": null}, {"id": "kobo-b7ada5f8-5498-42cb-96f9-04681e3052f7", "source": "kobo", "text": "Sicco Leendert Mansholt. \n Deze architect van het Brusselse landbouwbeleid was een nazaat van een Groninger herenboer. Als vice-voorzitter van de Europese Commissie had hij in 1968 een plan geschreven, het Mansholt-Memorandum, waarmee hij miljoenen keuterboertjes van hun land verjoeg. Mansholt dreef de kleine boeren als een kudde schapen naar de industrie.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-17T20:44:46.000", "color": 4}, {"id": "kobo-annot-a792e955760c0bb4", "source": "kobo", "text": "Ik vond het fascinerend dat de bakermat van de boerenemancipatie, met als keerzijde de exploitatie van de landarbeiders, in Oost-Groningse dorpen als Finsterwolde en Beerta lag.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-13T21:30:48Z", "color": null}, {"id": "kobo-8c8cea63-6467-4722-b6e6-75777b59f21d", "source": "kobo", "text": "Ik vond het fascinerend dat de bakermat van de boerenemancipatie, met als keerzijde de exploitatie van de landarbeiders, in Oost-Groningse dorpen als Finsterwolde en Beerta lag.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-13T21:30:48.000", "color": 4}, {"id": "kobo-annot-d93c17597dbec147", "source": "kobo", "text": ". ‘In het Oldambt is de moderne boer geboren,’ schreef hij in 1937. ‘De boer, die niet meer hard slovend van de vroege morgen tot de late avond doorwerkt, zonder dat hij zich ervan bewust is waarom hij dit zo en dat zo doet, maar de boer, die rekent en overlegt, die nadenkt over de te volgen werkwijze en de te gebruiken werktuigen.’", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-13T21:29:12Z", "color": null}, {"id": "kobo-2494ec77-d465-460e-87eb-b703c06d7514", "source": "kobo", "text": ". ‘In het Oldambt is de moderne boer geboren,’ schreef hij in 1937. ‘De boer, die niet meer hard slovend van de vroege morgen tot de late avond doorwerkt, zonder dat hij zich ervan bewust is waarom hij dit zo en dat zo doet, maar de boer, die rekent en overlegt, die nadenkt over de te volgen werkwijze en de te gebruiken werktuigen.’", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-13T21:29:12.000", "color": 4}, {"id": "kobo-annot-7c5b473ec014f575", "source": "kobo", "text": "Marx had nooit geweten wat hij met de boeren aan moest. ‘Boeren zijn een zak aardappels,’ zei hij – al stop je ze bij elkaar, het blijven losse, onberekenbare elementjes.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-13T21:27:51Z", "color": null}, {"id": "kobo-902c4f38-6fac-4c80-8be5-0587ccd6daca", "source": "kobo", "text": "Marx had nooit geweten wat hij met de boeren aan moest. ‘Boeren zijn een zak aardappels,’ zei hij – al stop je ze bij elkaar, het blijven losse, onberekenbare elementjes.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-13T21:27:51.000", "color": 4}, {"id": "kobo-annot-b217b1450bd17379", "source": "kobo", "text": "Verdubbelde de prijs van een baal katoen, dan gingen ze het volgende seizoen niet meer produceren, nee, ze verwaarloosden of rooiden een deel van hun katoenstruiken. ‘Nu kunnen we immers met de helft van de moeite hetzelfde bedrag verdienen,’ zeiden ze opgewekt.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-13T21:25:20Z", "color": null}, {"id": "kobo-4fb54881-3878-4d34-aa8d-c30385a39e6f", "source": "kobo", "text": "Verdubbelde de prijs van een baal katoen, dan gingen ze het volgende seizoen niet meer produceren, nee, ze verwaarloosden of rooiden een deel van hun katoenstruiken. ‘Nu kunnen we immers met de helft van de moeite hetzelfde bedrag verdienen,’ zeiden ze opgewekt.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-13T21:25:20.000", "color": 4}, {"id": "kobo-annot-7151e90dd5141c2a", "source": "kobo", "text": "Wat een peasant van een boer onderscheidde was dat hij zijn oogst zelf opat, dat hij dus leefde van de opbrengst van het land en in de eerste plaats zelfvoorzienend was. Omdat hij alleen het overtollige naar de markt bracht, stond de peasant slechts met één been in de geldeconomie.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-13T21:24:27Z", "color": null}, {"id": "kobo-a3e6192a-8942-40f3-a6f1-baa950d84af1", "source": "kobo", "text": "Wat een peasant van een boer onderscheidde was dat hij zijn oogst zelf opat, dat hij dus leefde van de opbrengst van het land en in de eerste plaats zelfvoorzienend was. Omdat hij alleen het overtollige naar de markt bracht, stond de peasant slechts met één been in de geldeconomie.", "note": null, "title": "De graanrepubliek", "author": "Frank Westerman", "url": null, "created_at": "2026-05-13T21:24:27.000", "color": 4}, {"id": "insta-26971521", "source": "instapaper", "text": "Een goede manager creëert mensen die zelfstandig kunnen denken, beslissen en leveren. Ben jij een manager: wees zo iemand. Want bedrijven groeien niet door meer controle. Bedrijven groeien door betere leiders.", "note": null, "title": "Feed | LinkedIn", "author": null, "url": "https://www.linkedin.com/feed/", "created_at": "2026-05-12T21:37:47", "color": null}, {"id": "insta-26971520", "source": "instapaper", "text": "Hij stak met zijn leger de Rubicon over na ‘Iacta alea est’ of ‘Alea iacta est’ uitgeroepen te hebben. Hij bedoelde iets als ‘Op goed geluk dan maar!’, ‘Op hoop van zegen!’", "note": null, "title": "de teerling is geworpen (herkomst en betekenis) | Genootschap Onze Taal", "author": null, "url": "https://onzetaal.nl/schatkamer/lezen/uitdrukkingen/alea-iacta-est-de-teerling-is-geworpen", "created_at": "2026-05-12T21:36:22", "color": null}, {"id": "insta-26971518", "source": "instapaper", "text": "‘De teerling is geworpen’ is een vertaling van het Latijnse spreekwoord ‘Alea iacta est’ (ook wel gespeld
