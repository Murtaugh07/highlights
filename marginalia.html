": "kobo-annot-147fbb2a3b6a62ac", "source": "kobo", "text": "By positioning your demands within the worldview your counterpart uses to make decisions, you show them respect and that gets you attention and results.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-16T21:14:35Z", "color": null}, {"id": "kobo-949905a6-e7f9-47aa-aa3f-1d4085d82f6b", "source": "kobo", "text": "By positioning your demands within the worldview your counterpart uses to make decisions, you show them respect and that gets you attention and results.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-16T21:14:35.000", "color": 4}, {"id": "kobo-annot-4c8bc7b5bdf381c1", "source": "kobo", "text": "But we couldn’t hit on that at all; we couldn’t threaten to kill him and expect that to work. The reason for that is something called the “paradox of power”—namely, the harder we push the more likely we are to be met with resistance. That’s why you have to use negative leverage sparingly.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-15T21:48:24Z", "color": null}, {"id": "kobo-59593ad2-e25a-4d05-a8b8-318b746f9e28", "source": "kobo", "text": "But we couldn’t hit on that at all; we couldn’t threaten to kill him and expect that to work. The reason for that is something called the “paradox of power”—namely, the harder we push the more likely we are to be met with resistance. That’s why you have to use negative leverage sparingly.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-15T21:48:24.000", "color": 4}, {"id": "kobo-annot-8c0f712c4be46d76", "source": "kobo", "text": "Discovering the Black Swans that give you normative valuation can be as easy as asking what your counterpart believes and listening openly. You want to see what language they speak, and speak it back to them.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-15T21:37:54Z", "color": null}, {"id": "kobo-d24f429b-8c82-409a-bb04-e88ff0d571a8", "source": "kobo", "text": "Discovering the Black Swans that give you normative valuation can be as easy as asking what your counterpart believes and listening openly. You want to see what language they speak, and speak it back to them.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-15T21:37:54.000", "color": 4}, {"id": "kobo-annot-8328553e555863ad", "source": "kobo", "text": "Every person has a set of rules and a moral framework. Normative leverage is using the other party’s norms and standards to advance your position. If you can show inconsistencies between their beliefs and their actions, you have normative leverage. No one likes to look like a hypocrite.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-15T21:36:52Z", "color": null}, {"id": "kobo-1994fb9c-927a-46d5-a94e-84d2b8346914", "source": "kobo", "text": "Every person has a set of rules and a moral framework.\n Normative leverage is using the other party’s norms and standards to advance your position. If you can show inconsistencies between their beliefs and their actions, you have normative leverage. No one likes to look like a hypocrite.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-15T21:36:52.000", "color": 4}, {"id": "kobo-annot-9407d49a080a896d", "source": "kobo", "text": "That said, a word of warning: I do not believe in making direct threats and am extremely careful with even subtle ones. Threats can be like nuclear bombs. There will be a toxic residue that will be difficult to clean up. You have to handle the potential of negative consequences with care, or you will hurt yourself and poison or blow up the whole process.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-15T21:35:31Z", "color": null}, {"id": "kobo-2e775f4a-805c-4fe5-bafc-4edd62445017", "source": "kobo", "text": "That said, a word of warning: I do not believe in making direct threats and am extremely careful with even subtle ones. Threats can be like nuclear bombs. There will be a toxic residue that will be difficult to clean up. You have to handle the potential of negative consequences with care, or you will hurt yourself and poison or blow up the whole process.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-15T21:35:31.000", "color": 4}, {"id": "kobo-annot-d4d0303ffc389402", "source": "kobo", "text": "Negative leverage is what most civilians picture when they hear the word “leverage.” It’s a negotiator’s ability to make his counterpart suffer. And it is based on threats: you have negative leverage if you can tell your counterpart, “If you don’t fulfill your commitment/pay your bill/etc., I will destroy your reputation.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-15T21:32:34Z", "color": null}, {"id": "kobo-54d37d0c-84e9-4759-be72-26ce5ab550d6", "source": "kobo", "text": "Negative leverage is what most civilians picture when they hear the word “leverage.” It’s a negotiator’s ability to make his counterpart suffer. And it is based on threats: you have negative leverage if you can tell your counterpart, “If you don’t fulfill your commitment/pay your bill/etc., I will destroy your reputation.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-15T21:32:34.000", "color": 4}, {"id": "kobo-annot-d7ee46a2f7639907", "source": "kobo", "text": "Positive leverage is quite simply your ability as a negotiator to provide—or withhold—things that your counterpart wants. Whenever the other side says, “I want . . .” as in, “I want to buy your car,” you have positive leverage.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-14T22:10:35Z", "color": null}, {"id": "kobo-03cdcfcc-4ba0-4a0d-8268-5e65c792f989", "source": "kobo", "text": "Positive leverage is quite simply your ability as a negotiator to provide—or withhold—things that your counterpart wants. Whenever the other side says, “I want . . .” as in, “I want to buy your car,” you have positive leverage.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-14T22:10:35.000", "color": 4}, {"id": "kobo-annot-ac3fd50fc38f48ad", "source": "kobo", "text": "One way to understand leverage is as a fluid that sloshes between the parties. As a negotiator you should always be aware of which side, at any given moment, feels they have the most to lose if negotiations collapse. The party who feels they have more to lose and are the most afraid of that loss has less leverage, and vice versa. To get leverage, you have to persuade your counterpart that they have something real to lose if the deal falls through.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-14T22:10:08Z", "color": null}, {"id": "kobo-ff318f24-9b76-419c-8e19-5f430c1f65d8", "source": "kobo", "text": "One way to understand leverage is as a fluid that sloshes between the parties. As a negotiator you should always be aware of which side, at any given moment, feels they have the most to lose if negotiations collapse. The party who feels they have more to lose and are the most afraid of that loss has less leverage, and vice versa. To get leverage, you have to persuade your counterpart that they have something real to lose if the deal falls through.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-14T22:10:08.000", "color": 4}, {"id": "kobo-annot-ea5f24cacdd45dc2", "source": "kobo", "text": "In practice, where our irrational perceptions are our reality, loss and gain are slippery notions, and it often doesn’t matter what leverage actually exists against you; what really matters is the leverage they think you have on them. That’s why I say there’s always leverage: as an essentially emotional concept, it can be manufactured whether it exists or not.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-14T22:07:23Z", "color": null}, {"id": "kobo-c439412e-70f4-4c9d-b796-da7890d1380d", "source": "kobo", "text": "In practice, where our irrational perceptions are our reality, loss and gain are slippery notions, and it often doesn’t matter what leverage actually exists against you; what really matters is the leverage they think you have on them. That’s why I say there’s always leverage: as an essentially emotional concept, it can be manufactured whether it exists or not.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-14T22:07:23.000", "color": 4}, {"id": "kobo-annot-9bc8c97869b34984", "source": "kobo", "text": "The answer is leverage. Black Swans are leverage multipliers. They give you the upper hand.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-14T22:05:10Z", "color": null}, {"id": "kobo-017ccb79-2142-4bd9-8f4c-4f0a8110c4cd", "source": "kobo", "text": "The answer is leverage. Black Swans are leverage multipliers. They give you the upper hand.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-14T22:05:10.000", "color": 4}, {"id": "kobo-annot-7048bb52e0a4089c", "source": "kobo", "text": "Don’t look to verify what you expect. If you do, that’s what you’ll find. Instead, you must open yourself up to the factual reality that is in front of you.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-14T22:02:44Z", "color": null}, {"id": "kobo-e1ac1a9f-f609-4ad3-8fab-146218c3bcd7", "source": "kobo", "text": "Don’t look to verify what you expect. If you do, that’s what you’ll find. Instead, you must open yourself up to the factual reality that is in front of you.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-14T22:02:44.000", "color": 4}, {"id": "kobo-annot-a246ae3ee6b7f77d", "source": "kobo", "text": "That’s why I say that finding and understanding Black Swans requires a change of mindset. You have to open up your established pathways and embrace more intuitive and nuanced ways of listening.", "note": "Net als eragon bij zijn traning", "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-14T21:59:30Z", "color": null}, {"id": "kobo-5494663f-a6c2-43f1-a4ab-8f50d40c5786", "source": "kobo", "text": "That’s why I say that finding and understanding Black Swans requires a change of mindset. You have to open up your established pathways and embrace more intuitive and nuanced ways of listening.", "note": "Net als eragon bij zijn traning", "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-14T21:59:30.000", "color": 4}, {"id": "kobo-annot-9771aeb9fffe0455", "source": "kobo", "text": "But those were not the only important lessons of that tragic event. If an overreliance on known knowns can shackle a negotiator to assumptions that prevent him from seeing and hearing all that a situation presents, then perhaps an enhanced receptivity to the unknown unknowns can free that same negotiator to see and hear the things that can produce dramatic breakthroughs.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-14T21:56:47Z", "color": null}, {"id": "kobo-b4f182ff-bd30-4864-be5d-aa2c39a82780", "source": "kobo", "text": "But those were not the only important lessons of that tragic event. If an overreliance on known knowns can shackle a negotiator to assumptions that prevent him from seeing and hearing all that a situation presents, then perhaps an enhanced receptivity to the unknown unknowns can free that same negotiator to see and hear the things that can produce dramatic breakthroughs.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-14T21:56:47.000", "color": 4}, {"id": "kobo-annot-70a250c31b02fc0a", "source": "kobo", "text": "The lesson of what happened at 3 p.m. on June 17, 1981, in Rochester, New York, was that when bits and pieces of a case don’t add up it’s usually because our frames of reference are off; they will never add up unless we break free of our expectations.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-11T21:40:27Z", "color": null}, {"id": "kobo-1b3d5af1-47d3-49a1-b625-189f054c60e5", "source": "kobo", "text": "The lesson of what happened at 3 p.m. on June 17, 1981, in Rochester, New York, was that when bits and pieces of a case don’t add up it’s usually because our frames of reference are off; they will never add up unless we break free of our expectations.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-11T21:40:27.000", "color": 4}, {"id": "kobo-annot-7b2c65bc33b9fd35", "source": "kobo", "text": "As Taleb uses the term, the Black Swan symbolizes the uselessness of predictions based on previous experience. Black Swans are events or pieces of knowledge that sit outside our regular expectations and therefore cannot be predicted.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-11T16:02:49Z", "color": null}, {"id": "kobo-4e08a00d-60ab-455a-878f-3d42478fa21b", "source": "kobo", "text": "As Taleb uses the term, the Black Swan symbolizes the uselessness of predictions based on previous experience. Black Swans are events or pieces of knowledge that sit outside our regular expectations and therefore cannot be predicted.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-11T16:02:49.000", "color": 4}, {"id": "kobo-annot-419e3802203ec097", "source": "kobo", "text": "Prepare, prepare, prepare. When the pressure is on, you don’t rise to the occasion; you fall to your highest level of preparation. So design an ambitious but legitimate goal and then game out the labels, calibrated questions, and responses you’ll use to get there. That way, once you’re at the bargaining table, you won’t have to wing it.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-11T06:54:58Z", "color": null}, {"id": "kobo-7801c673-4936-4ecb-8b28-e34558725b46", "source": "kobo", "text": "Prepare, prepare, prepare. When the pressure is on, you don’t rise to the occasion; you fall to your highest level of preparation. So design an ambitious but legitimate goal and then game out the labels, calibrated questions, and responses you’ll use to get there. That way, once you’re at the bargaining table, you won’t have to wing it.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-11T06:54:58.000", "color": 4}, {"id": "kobo-annot-97f252750dba9500", "source": "kobo", "text": "Ka-ching! Notice this brilliant combination of decreasing Ackerman offers, nonround numbers, deep research, smart labeling, and saying no without saying “No”? That’s what gets you a rent discount when a landlord wanted to raise his monthly take.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-11T06:53:42Z", "color": null}, {"id": "kobo-20ee4694-6fbc-43b7-806f-01f522d9f0de", "source": "kobo", "text": "Ka-ching! Notice this brilliant combination of decreasing Ackerman offers, nonround numbers, deep research, smart labeling, and saying no without saying “No”? That’s what gets you a rent discount when a landlord wanted to raise his monthly take.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-11T06:53:42.000", "color": 4}, {"id": "kobo-annot-43509a47149d25ee", "source": "kobo", "text": "5.When calculating the final amount, use precise, nonround numbers like, say, $37,893 rather than $38,000. It gives the number credibility and weight. 6.On your final number, throw in a nonmonetary item (that they probably don’t want) to show you’re at your limit.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-10T21:41:39Z", "color": null}, {"id": "kobo-6eeff5af-1346-41c5-9a29-3c2a0b03f663", "source": "kobo", "text": "5.When calculating the final amount, use precise, nonround numbers like, say, $37,893 rather than $38,000. It gives the number credibility and weight.\n 6.On your final number, throw in a nonmonetary item (that they probably don’t want) to show you’re at your limit.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-10T21:41:39.000", "color": 4}, {"id": "kobo-annot-c8ac395a75667de2", "source": "kobo", "text": "The Ackerman model is an offer-counteroffer method, at least on the surface. But it is a very effective system for beating the usual lackluster bargaining dynamic, which has the predictable result of meeting in the middle. The systematized and easy-to-remember process has only four steps: 1.Set your target price (your goal). 2.Set your first offer at 65 percent of your target price. 3.Calculate three raises of decreasing increments (to 85, 95, and 100 percent). 4.Use lots of empathy and different ways of saying “No” to get the other side to counter before you increase your offer.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-10T21:41:17Z", "color": null}, {"id": "kobo-3cf793c3-b961-474d-8c5d-f87bef4ddfc5", "source": "kobo", "text": "The Ackerman model is an offer-counteroffer method, at least on the surface. But it is a very effective system for beating the usual lackluster bargaining dynamic, which has the predictable result of meeting in the middle.\n The systematized and easy-to-remember process has only four steps:\n 1.Set your target price (your goal).\n 2.Set your first offer at 65 percent of your target price.\n 3.Calculate three raises of decreasing increments (to 85, 95, and 100 percent).\n 4.Use lots of empathy and different ways of saying “No” to get the other side to counter before you increase your offer.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-10T21:41:17.000", "color": 4}, {"id": "kobo-annot-172be53044dfb9bb", "source": "kobo", "text": "In any bare-knuckle bargaining session, the most vital principle to keep in mind is never to look at your counterpart as an enemy. The person across the table is never the problem. The unsolved issue is. So focus on the issue. This is one of the most basic tactics for avoiding emotional escalations. Our culture demonizes people in movies and politics, which creates the mentality that if we only got rid of the person then everything would be okay. But this dynamic is toxic to any negotiation.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-10T21:36:09Z", "color": null}, {"id": "kobo-b26909bf-b599-48dd-986a-bc4063812916", "source": "kobo", "text": "In any bare-knuckle bargaining session, the most vital principle to keep in mind is never to look at your counterpart as an enemy.\n The person across the table is never the problem. The unsolved issue is. So focus on the issue. This is one of the most basic tactics for avoiding emotional escalations. Our culture demonizes people in movies and politics, which creates the mentality that if we only got rid of the person then everything would be okay. But this dynamic is toxic to any negotiation.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-10T21:36:09.000", "color": 4}, {"id": "kobo-annot-183758a06a757e6a", "source": "kobo", "text": "We’ve said previously that no deal is better than a bad deal. If you feel you can’t say “No” then you’ve taken yourself hostage.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-10T21:33:55Z", "color": null}, {"id": "kobo-e32326dd-98c4-430e-9374-6cd63fdac596", "source": "kobo", "text": "We’ve said previously that no deal is better than a bad deal. If you feel you can’t say “No” then you’ve taken yourself hostage.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-10T21:33:55.000", "color": 4}, {"id": "kobo-annot-40b57a29c1e42fba", "source": "kobo", "text": "The traditional “I” message is to use “I” to hit the pause button and step out of a bad dynamic. When you want to counteract unproductive statements from your counterpart, you can say, “I feel ___ when you ___ because ___,” and that demands a time-out from the other person.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-10T21:33:09Z", "color": null}, {"id": "kobo-55ea794d-a797-4797-9136-870dfee24e17", "source": "kobo", "text": "The traditional “I” message is to use “I” to hit the pause button and step out of a bad dynamic. When you want to counteract unproductive statements from your counterpart, you can say, “I feel ___ when you ___ because ___,” and that demands a time-out from the other person.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-10T21:33:09.000", "color": 4}, {"id": "kobo-annot-811984f8f1ff5397", "source": "kobo", "text": "Using the first-person singular pronoun is another great way to set a boundary without escalating into confrontation. When you say, “I’m sorry, that doesn’t work for me,” the word “I” strategically focuses your counterpart’s attention onto you long enough for you to make a point.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-10T21:32:10Z", "color": null}, {"id": "kobo-f2bf61bf-b7de-4e7e-9f7e-4114b042bdf0", "source": "kobo", "text": "Using the first-person singular pronoun is another great way to set a boundary without escalating into confrontation.\n When you say, “I’m sorry, that doesn’t work for me,” the word “I” strategically focuses your counterpart’s attention onto you long enough for you to make a point.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-10T21:32:10.000", "color": 4}, {"id": "kobo-annot-c24906d603a38c7b", "source": "kobo", "text": "client away from a competitor, you might say, “Why would you ever do business with me? Why would you ever change from your existing supplier? They’re great!” In these questions, the “Why?” coaxes your counterpart into working for you.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-10T21:31:29Z", "color": null}, {"id": "kobo-33b52a91-6385-4daf-8852-afc1aa3c6d7c", "source": "kobo", "text": "client away from a competitor, you might say, “Why would you ever do business with me? Why would you ever change from your existing supplier? They’re great!”\n In these questions, the “Why?” coaxes your counterpart into working for you.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-10T21:31:29.000", "color": 4}, {"id": "kobo-annot-ee41a85b79d5191d", "source": "kobo", "text": "The real lesson here is being aware of how this might be used on you. Please don’t allow yourself to fall victim to “strategic umbrage.”", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-10T21:27:10Z", "color": null}, {"id": "kobo-07686ecc-5cab-4488-8b01-bc0da2537434", "source": "kobo", "text": "The real lesson here is being aware of how this might be used on you. Please don’t allow yourself to fall victim to “strategic umbrage.”", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-10T21:27:10.000", "color": 4}, {"id": "kobo-annot-7c3bcf1fb217a913", "source": "kobo", "text": "And so when someone puts out a ridiculous offer, one that really pisses you off, take a deep breath, allow little anger, and channel it—at the proposal, not the person—and say, “I don’t see how that would ever work.”", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-10T21:26:16Z", "color": null}, {"id": "kobo-dfd006d5-e6f9-49f2-b2e0-975eb0239970", "source": "kobo", "text": "And so when someone puts out a ridiculous offer, one that really pisses you off, take a deep breath, allow little anger, and channel it—at the proposal, not the person—and say, “I don’t see how that would ever work.”", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-10T21:26:16.000", "color": 4}, {"id": "kobo-annot-62b82834fc656625", "source": "kobo", "text": "And if the other side pushes you to go first, wriggle from his grip. Instead of naming a price, allude to an incredibly high number that someone else might charge. Once when a hospital chain wanted me to name a price first, I said, “Well, if you go to Harvard Business School, they’re going to charge you $2,500 a day per student.” No matter what happens, the point here is to sponge up information from your counterpart. Letting your counterpart anchor first will give you a tremendous feel for him. All you need to learn is how to take the first punch.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-09T22:05:57Z", "color": null}, {"id": "kobo-900d4593-12fe-4333-930d-9a857063799c", "source": "kobo", "text": "And if the other side pushes you to go first, wriggle from his grip. Instead of naming a price, allude to an incredibly high number that someone else might charge. Once when a hospital chain wanted me to name a price first, I said, “Well, if you go to Harvard Business School, they’re going to charge you $2,500 a day per student.”\n No matter what happens, the point here is to sponge up information from your counterpart. Letting your counterpart anchor first will give you a tremendous feel for him. All you need to learn is how to take the first punch.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-09T22:05:57.000", "color": 4}, {"id": "kobo-annot-677fa797a1ce5a69", "source": "kobo", "text": "First, deflect the punch in a way that opens up your counterpart. Successful negotiators often say “No” in one of the many ways we’ve talked about (“How am I supposed to accept that?”) or deflect the anchor with questions like “What are we trying to accomplish here?” Responses like these are great ways to refocus your counterpart when you feel you’re being pulled into the compromise trap.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-09T22:05:24Z", "color": null}, {"id": "kobo-bcb6cbae-becf-4ff5-a746-40379bc46e97", "source": "kobo", "text": "First, deflect the punch in a way that opens up your counterpart. Successful negotiators often say “No” in one of the many ways we’ve talked about (“How am I supposed to accept that?”) or deflect the anchor with questions like “What are we trying to accomplish here?” Responses like these are great ways to refocus your counterpart when you feel you’re being pulled into the compromise trap.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-09T22:05:24.000", "color": 4}, {"id": "kobo-annot-735aead6ed86dd1d", "source": "kobo", "text": "You can do this directly by saying, in an encouraging tone of voice, “Let’s put price off to the side for a moment and talk about what would make this a good deal.” Or you could go at it more obliquely by asking, “What else would you be able to offer to make that a good price for me?”", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-09T22:05:17Z", "color": null}, {"id": "kobo-9ad5ef33-4c56-47f7-954a-95045e3a8e7f", "source": "kobo", "text": "You can do this directly by saying, in an encouraging tone of voice, “Let’s put price off to the side for a moment and talk about what would make this a good deal.” Or you could go at it more obliquely by asking, “What else would you be able to offer to make that a good price for me?”", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-09T22:05:17.000", "color": 4}, {"id": "kobo-annot-69e85e43fd39a6a6", "source": "kobo", "text": "The greatest obstacle to accurately identifying someone else’s style is what I call the “I am normal” paradox. That is, our hypothesis that the world should look to others as it looks to us. After all, who wouldn’t make that assumption?", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-09T21:55:16Z", "color": null}, {"id": "kobo-1539c03c-9777-433a-897d-32112309186b", "source": "kobo", "text": "The greatest obstacle to accurately identifying someone else’s style is what I call the “I am normal” paradox. That is, our hypothesis that the world should look to others as it looks to us. After all, who wouldn’t make that assumption?", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-09T21:55:16.000", "color": 4}, {"id": "kobo-annot-d02446eee3f02afe", "source": "kobo", "text": "Some people are Accommodators; others—like me—are basically Assertive; and the rest are data-loving Analysts.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-08T21:45:35Z", "color": null}, {"id": "kobo-f3d5c17b-28c2-4058-8ef6-ea88114a204d", "source": "kobo", "text": "Some people are Accommodators; others—like me—are basically Assertive; and the rest are data-loving Analysts.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-08T21:45:35.000", "color": 4}, {"id": "kobo-annot-0e58a964fa05f04d", "source": "kobo", "text": "Here it is: the clash for cash, an uneasy dance of offers and counters that send most people into a cold sweat. If you count yourself among that majority, regarding the inevitable moment as nothing more than a necessary evil, there’s a good chance you regularly get your clock cleaned by those who have learned to embrace it.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-07T22:09:35Z", "color": null}, {"id": "kobo-53df0f89-c858-46f2-aac1-c3018164872c", "source": "kobo", "text": "Here it is: the clash for cash, an uneasy dance of offers and counters that send most people into a cold sweat. If you count yourself among that majority, regarding the inevitable moment as nothing more than a necessary evil, there’s a good chance you regularly get your clock cleaned by those who have learned to embrace it.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-07T22:09:35.000", "color": 4}, {"id": "kobo-annot-c4152ed1144fcadd", "source": "kobo", "text": "to the other side and even get your own personal discount. Humor and humanity are the best ways to break the ice and remove roadblocks.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-07T07:18:04Z", "color": null}, {"id": "kobo-7fb11436-7bd8-4acc-a610-d9d068bef449", "source": "kobo", "text": "to the other side and even get your own personal discount. Humor and humanity are the best ways to break the ice and remove roadblocks.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-07T07:18:04.000", "color": 4}, {"id": "kobo-annot-72f744a18b00d8dc", "source": "kobo", "text": "Don’t just pay attention to the people you’re negotiating with directly; always identify the motivations of the players “behind the table.” You can do so by asking how a deal will affect everybody else and how on board they are.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-07T07:16:27Z", "color": null}, {"id": "kobo-3247bde7-16ff-4d09-870c-2a73f441f633", "source": "kobo", "text": "Don’t just pay attention to the people you’re negotiating with directly; always identify the motivations of the players “behind the table.” You can do so by asking how a deal will affect everybody else and how on board they are.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-07T07:16:27.000", "color": 4}, {"id": "kobo-annot-b7be7528d8d27aa7", "source": "kobo", "text": "That is, “Yes” is nothing without “How.” Asking “How,” knowing “How,” and defining “How” are all part of the effective negotiator’s arsenal. He would be unarmed without them.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-07T07:15:23Z", "color": null}, {"id": "kobo-ba4414ab-90d6-407f-8fa7-ba9a64d54447", "source": "kobo", "text": "That is, “Yes” is nothing without “How.” Asking “How,” knowing “How,” and defining “How” are all part of the effective negotiator’s arsenal. He would be unarmed without them.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-07T07:15:23.000", "color": 4}, {"id": "kobo-annot-89f637baf5565c47", "source": "kobo", "text": "Superstar negotiators—real rainmakers—know that a negotiation is a playing field beneath the words, where really getting to a good deal involves detecting and manipulating subtle, nonobvious signals beneath the surface.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-07T07:14:58Z", "color": null}, {"id": "kobo-a1f78762-5ea0-4289-8ca7-d6c0b450aece", "source": "kobo", "text": "Superstar negotiators—real rainmakers—know that a negotiation is a playing field beneath the words, where really getting to a good deal involves detecting and manipulating subtle, nonobvious signals beneath the surface.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-07T07:14:58.000", "color": 4}, {"id": "kobo-annot-54a31187c737db5e", "source": "kobo", "text": "Then you can use something like “I’m sorry but I’m afraid I just can’t do that.” It’s a little more direct, and the “can’t do that” does great double duty. By expressing an inability to perform, it can trigger the other side’s empathy toward you. “I’m sorry, no” is a slightly more succinct version for the fourth “No.” If delivered gently, it barely sounds negative at all. If you have to go further, of course, “No” is the last and most direct way. Verbally, it should be delivered with a downward inflection and a tone of regard; it’s not meant to be “NO!”", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-06T21:51:07Z", "color": null}, {"id": "kobo-d3866b34-10b8-488e-9b78-fdd903f3232c", "source": "kobo", "text": "Then you can use something like “I’m sorry but I’m afraid I just can’t do that.” It’s a little more direct, and the “can’t do that” does great double duty. By expressing an inability to perform, it can trigger the other side’s empathy toward you.\n “I’m sorry, no” is a slightly more succinct version for the fourth “No.” If delivered gently, it barely sounds negative at all.\n If you have to go further, of course, “No” is the last and most direct way. Verbally, it should be delivered with a downward inflection and a tone of regard; it’s not meant to be “NO!”", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-06T21:51:07.000", "color": 4}, {"id": "kobo-annot-9bcdf78c7c566740", "source": "kobo", "text": "You can ignore the so-called negotiating experts who say apologies are always signs of weakness.)", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-06T21:50:44Z", "color": null}, {"id": "kobo-9f231724-e7d2-45aa-a46b-0052ae468118", "source": "kobo", "text": "You can ignore the so-called negotiating experts who say apologies are always signs of weakness.)", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-06T21:50:44.000", "color": 4}, {"id": "kobo-annot-5d18ca647413adeb", "source": "kobo", "text": "After that, some version of “Your offer is very generous, I’m sorry, that just doesn’t work for me” is an elegant second way to say “No.”", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-06T21:48:36Z", "color": null}, {"id": "kobo-00599fa7-831c-464e-8691-9a7178b4d23c", "source": "kobo", "text": "After that, some version of “Your offer is very generous, I’m sorry, that just doesn’t work for me” is an elegant second way to say “No.”", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-06T21:48:36.000", "color": 4}, {"id": "kobo-annot-92ea70e1706cb40c", "source": "kobo", "text": "We’ve found that you can usually express “No” four times before actually saying the word. The first step in the “No” series is the old standby: “How am I supposed to do that?” You have to deliver it in a deferential way, so it becomes a request for help. Properly delivered, it invites the other side to participate in your dilemma and solve it with a better offer.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-06T21:48:22Z", "color": null}, {"id": "kobo-9258369f-bb1e-4429-9ccf-6e36e027e43f", "source": "kobo", "text": "We’ve found that you can usually express “No” four times before actually saying the word.\n The first step in the “No” series is the old standby:\n “How am I supposed to do that?”\n You have to deliver it in a deferential way, so it becomes a request for help. Properly delivered, it invites the other side to participate in your dilemma and solve it with a better offer.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-06T21:48:22.000", "color": 4}, {"id": "kobo-annot-1b2149919cefd325", "source": "kobo", "text": "I asked her if I got a discount for joining and she said, “No.” So I decided to try another angle. I said in a friendly manner, “My name is Chris. What’s the Chris discount?” She looked from the register, met my eyes, and gave a little laugh.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-06T21:45:20Z", "color": null}, {"id": "kobo-d49907e3-46f9-4c06-8efe-aa83b4191171", "source": "kobo", "text": "I asked her if I got a discount for joining and she said, “No.”\n So I decided to try another angle. I said in a friendly manner, “My name is Chris. What’s the Chris discount?”\n She looked from the register, met my eyes, and gave a little laugh.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-06T21:45:20.000", "color": 4}, {"id": "kobo-annot-42bb302bc7db6347", "source": "kobo", "text": "The use of pronouns by a counterpart can also help give you a feel for their actual importance in the decision and implementation chains on the other side of the table. The more in love they are with “I,” “me,” and “my” the less important they are. Conversely, the harder it is to get a first person pronoun out of a negotiator’s mouth, the more important they are.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-06T21:37:02Z", "color": null}, {"id": "kobo-9e149170-1d86-41de-8cda-61a89e44e8d9", "source": "kobo", "text": "The use of pronouns by a counterpart can also help give you a feel for their actual importance in the decision and implementation chains on the other side of the table. The more in love they are with “I,” “me,” and “my” the less important they are.\n Conversely, the harder it is to get a first person pronoun out of a negotiator’s mouth, the more important they are.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-06T21:37:02.000", "color": 4}, {"id": "kobo-annot-8a7c990eb47c1556", "source": "kobo", "text": "Or the three times might just be the same calibrated question phrased three different ways, like “What’s the biggest challenge you faced? What are we up against here? What do you see as being the most difficult thing to get around?” Either way, going at the same issue three times uncovers falsehoods as well as the incongruences between words and body language we mentioned in the last section. So next time you’re not sure your counterpart is truthful and committed, try it.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-06T21:34:38Z", "color": null}, {"id": "kobo-1d4292ac-9f11-4ef4-a789-febac09cf0a2", "source": "kobo", "text": "Or the three times might just be the same calibrated question phrased three different ways, like “What’s the biggest challenge you faced? What are we up against here? What do you see as being the most difficult thing to get around?”\n Either way, going at the same issue three times uncovers falsehoods as well as the incongruences between words and body language we mentioned in the last section. So next time you’re not sure your counterpart is truthful and committed, try it.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-06T21:34:38.000", "color": 4}, {"id": "kobo-annot-ceb152700761c0de", "source": "kobo", "text": "The first time they agree to something or give you a commitment, that’s No. 1. For No. 2 you might label or summarize what they said so they answer, “That’s right.” And No. 3 could be a calibrated “How” or “What” question about implementation that asks them to explain what will constitute success, something like “What do we do if we get off track?”", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-06T21:33:30Z", "color": null}, {"id": "kobo-62650536-8ef3-4a9d-83bb-f98efd515547", "source": "kobo", "text": "The first time they agree to something or give you a commitment, that’s No. 1. For No. 2 you might label or summarize what they said so they answer, “That’s right.” And No. 3 could be a calibrated “How” or “What” question about implementation that asks them to explain what will constitute success, something like “What do we do if we get off track?”", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-06T21:33:30.000", "color": 4}, {"id": "kobo-annot-8c7416f63f5649f2", "source": "kobo", "text": "The Rule of Three is simply getting the other guy to agree to the same thing three times in the same conversation. It’s tripling the strength of whatever dynamic you’re trying to drill into at the moment. In doing so, it uncovers problems before they happen. It’s really hard to repeatedly lie or fake conviction.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-06T21:32:02Z", "color": null}, {"id": "kobo-2e4d94cd-9ec6-4fd6-b93e-c5a86c0654ea", "source": "kobo", "text": "The Rule of Three is simply getting the other guy to agree to the same thing three times in the same conversation. It’s tripling the strength of whatever dynamic you’re trying to drill into at the moment. In doing so, it uncovers problems before they happen. It’s really hard to repeatedly lie or fake conviction.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-06T21:32:02.000", "color": 4}, {"id": "kobo-annot-c255d95c719ddb2a", "source": "kobo", "text": "This happens because there are actually three kinds of “Yes”: Commitment, Confirmation, and Counterfeit.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-06T21:30:23Z", "color": null}, {"id": "kobo-02fa712f-0d4d-4786-beb3-7a8da437e67f", "source": "kobo", "text": "This happens because there are actually three kinds of “Yes”: Commitment, Confirmation, and Counterfeit.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-06T21:30:23.000", "color": 4}, {"id": "kobo-annot-2dd981465c549c24", "source": "kobo", "text": "When someone’s tone of voice or body language does not align with the meaning of the words they say, use labels to discover the source of the incongruence. Here’s an example: You: “So we’re agreed?” Them: “Yes . . .” You: “I heard you say, ‘Yes,’ but it seemed like there was hesitation in your voice.” Them: “Oh, it’s nothing really.” You: “No, this is important, let’s make sure we get this right.” Them: “Thanks, I appreciate it.”", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-06T21:29:23Z", "color": null}, {"id": "kobo-42b02856-36df-4175-871f-1aa10c2002c7", "source": "kobo", "text": "When someone’s tone of voice or body language does not align with the meaning of the words they say, use labels to discover the source of the incongruence.\n Here’s an example:\n You: “So we’re agreed?”\n Them: “Yes . . .”\n You: “I heard you say, ‘Yes,’ but it seemed like there was hesitation in your voice.”\n Them: “Oh, it’s nothing really.”\n You: “No, this is important, let’s make sure we get this right.”\n Them: “Thanks, I appreciate it.”", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-06T21:29:23.000", "color": 4}, {"id": "kobo-annot-e24a05a347165e12", "source": "kobo", "text": "So how do you use this rule? First, pay very close attention to tone and body language to make sure they match up with the literal meaning of the words. If they don’t align, it’s quite possible that the speaker is lying or at least unconvinced.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-06T21:27:57Z", "color": null}, {"id": "kobo-1b0ab7f8-749d-4872-b319-c88616ef252b", "source": "kobo", "text": "So how do you use this rule? First, pay very close attention to tone and body language to make sure they match up with the literal meaning of the words. If they don’t align, it’s quite possible that the speaker is lying or at least unconvinced.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-06T21:27:57.000", "color": 4}, {"id": "kobo-annot-e53f1214cbd4d101", "source": "kobo", "text": "In two famous studies on what makes us like or dislike somebody,1 UCLA psychology professor Albert Mehrabian created the 7-38-55 rule. That is, only 7 percent of a message is based on the words while 38 percent comes from the tone of voice and 55 percent from the speaker’s body language and face.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-06T21:26:34Z", "color": null}, {"id": "kobo-a4adcc4b-034c-4c1d-a959-ef116efb0f61", "source": "kobo", "text": "In two famous studies on what makes us like or dislike somebody,1 UCLA psychology professor Albert Mehrabian created the 7-38-55 rule. That is, only 7 percent of a message is based on the words while 38 percent comes from the tone of voice and 55 percent from the speaker’s body language and face.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-06T21:26:34.000", "color": 4}, {"id": "kobo-annot-123fffc2d0f85f8a", "source": "kobo", "text": "the art of letting someone else have your way.” There are two key questions you can ask to push your counterparts to think they are defining success their way: “How will we know we’re on track?” and “How will we address things if we find we’re off track?” When they answer, you summarize their answers until you get a “That’s right.” Then you’ll know they’ve bought in. On the flip side, be wary of two telling signs that your counterpart doesn’t believe the idea is theirs. As I’ve noted, when they say, “You’re right,” it’s often a good indicator they are not vested in what is being discussed. And when you push for implementation and they say, “I’ll try,” you should get a sinking feeling in your stomach. Because this really means, “I plan to fail.” When you hear either of these, dive back in with calibrated “How” questions until they define the terms of successful implementation in their own voice. Follow up by summarizing what they have said to get a “That’s right.”", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-04T22:21:10Z", "color": null}, {"id": "kobo-492a831c-2130-4df0-8c79-4d0615d7b4fb", "source": "kobo", "text": "the art of letting someone else have your way.”\n There are two key questions you can ask to push your counterparts to think they are defining success their way: “How will we know we’re on track?” and “How will we address things if we find we’re off track?” When they answer, you summarize their answers until you get a “That’s right.” Then you’ll know they’ve bought in.\n On the flip side, be wary of two telling signs that your counterpart doesn’t believe the idea is theirs. As I’ve noted, when they say, “You’re right,” it’s often a good indicator they are not vested in what is being discussed. And when you push for implementation and they say, “I’ll try,” you should get a sinking feeling in your stomach. Because this really means, “I plan to fail.”\n When you hear either of these, dive back in with calibrated “How” questions until they define the terms of successful implementation in their own voice. Follow up by summarizing what they have said to get a “That’s right.”", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-04T22:21:10.000", "color": 4}, {"id": "kobo-annot-b3db81726ebb628f", "source": "kobo", "text": "“forced empathy,”", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-04T22:14:35Z", "color": null}, {"id": "kobo-43859016-89be-4947-8ec8-f5c99c85b084", "source": "kobo", "text": "“forced empathy,”", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-04T22:14:35.000", "color": 4}, {"id": "kobo-annot-4f1e9cc30577383f", "source": "kobo", "text": "As Julie did, the first and most common “No” question you’ll use is some version of “How am I supposed to do that?” (for example, “How can we raise that much?”). Your tone of voice is critical as this phrase can be delivered as either an accusation or a request for assistance. So pay attention to your voice.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-04T22:13:39Z", "color": null}, {"id": "kobo-b46fbc8c-cb79-4169-9620-aeca818216b3", "source": "kobo", "text": "As Julie did, the first and most common “No” question you’ll use is some version of “How am I supposed to do that?” (for example, “How can we raise that much?”). Your tone of voice is critical as this phrase can be delivered as either an accusation or a request for assistance. So pay attention to your voice.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-04T22:13:39.000", "color": 4}, {"id": "kobo-annot-bb07111b085e6f4f", "source": "kobo", "text": "to develop a better solution—your solution. A gentle How/No invites collaboration and leaves your counterpart with a feeling of having been treated with respect.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-04T22:12:47Z", "color": null}, {"id": "kobo-c959c76c-830d-4ab2-852b-adccbc609c10", "source": "kobo", "text": "to develop a better solution—your solution. A gentle How/No invites collaboration and leaves your counterpart with a feeling of having been treated with respect.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-04T22:12:47.000", "color": 4}, {"id": "kobo-annot-010327a6e7d29b2c", "source": "kobo", "text": "The trick to “How” questions is that, correctly used, they are", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-04T22:11:05Z", "color": null}, {"id": "kobo-e0cd2962-67a7-4a2a-b131-fe78ca62bf4c", "source": "kobo", "text": "The trick to “How” questions is that, correctly used, they are", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-04T22:11:05.000", "color": 4}, {"id": "kobo-annot-128dc68b3d550eca", "source": "kobo", "text": "“Yes” is nothing without “How.”", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-03T21:34:11Z", "color": null}, {"id": "kobo-d3d4c06b-8cde-431c-8be4-e17b3cba0667", "source": "kobo", "text": "“Yes” is nothing without “How.”", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-03T21:34:11.000", "color": 4}, {"id": "kobo-annot-deb6025295f03c39", "source": "kobo", "text": "■Bite your tongue. When you’re attacked in a negotiation, pause and avoid angry emotional reactions. Instead, ask your counterpart a calibrated question.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-03T21:29:22Z", "color": null}, {"id": "kobo-ad7da04e-828f-4f79-9d12-c9d9bcda589f", "source": "kobo", "text": "■Bite your tongue. When you’re attacked in a negotiation, pause and avoid angry emotional reactions. Instead, ask your counterpart a calibrated question.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-03T21:29:22.000", "color": 4}, {"id": "kobo-annot-65da696c67c53f9b", "source": "kobo", "text": "listener’s judo.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-03T21:27:26Z", "color": null}, {"id": "kobo-a8716f48-08c1-486a-9faa-f34d20fdd10a", "source": "kobo", "text": "listener’s judo.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-03T21:27:26.000", "color": 4}, {"id": "kobo-annot-65bee937d50a7700", "source": "kobo", "text": "The listener, of course. That’s because the talker is revealing information while the listener, if he’s trained well, is directing the conversation toward his own goals. He’s harnessing the talker’s energy for his own ends.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-03T21:26:19Z", "color": null}, {"id": "kobo-dce50529-b1d7-4794-83ee-b3f445ef338e", "source": "kobo", "text": "The listener, of course.\n That’s because the talker is revealing information while the listener, if he’s trained well, is directing the conversation toward his own goals. He’s harnessing the talker’s energy for his own ends.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-03T21:26:19.000", "color": 4}, {"id": "kobo-annot-c510168d4e23e858", "source": "kobo", "text": "Who has control in a conversation, the guy listening or the guy", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-03T21:25:50Z", "color": null}, {"id": "kobo-be32617f-36ce-4930-943f-746701d7b7b7", "source": "kobo", "text": "Who has control in a conversation, the guy listening or the guy", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-03T21:25:50.000", "color": 4}, {"id": "kobo-annot-9d5bee6f86328daa", "source": "kobo", "text": "In a negotiation, like in the one between my client and the CEO, this always produces a negative outcome. So we have to train our neocortex to override the emotions from the other two brains. That means biting your tongue and learning how to mindfully change your state to something more positive. And it means lowering the hostage mentality in your counterpart by asking a question or even offering an apology. (“You’re right. That was a bit harsh.”)", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-03T21:25:14Z", "color": null}, {"id": "kobo-a51b4c1b-5d0e-4096-8afa-500664153d7a", "source": "kobo", "text": "In a negotiation, like in the one between my client and the CEO, this always produces a negative outcome. So we have to train our neocortex to override the emotions from the other two brains.\n That means biting your tongue and learning how to mindfully change your state to something more positive. And it means lowering the hostage mentality in your counterpart by asking a question or even offering an apology. (“You’re right. That was a bit harsh.”)", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-03T21:25:14.000", "color": 4}, {"id": "kobo-annot-9810e90cf75ecd08", "source": "kobo", "text": "Another simple rule is, when you are verbally assaulted, do not counterattack. Instead, disarm your counterpart by asking a calibrated question. The next time a waiter or salesclerk tries to engage you in a verbal skirmish, try this out. I promise you it will change the entire tenor of the conversation.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-03T21:23:08Z", "color": null}, {"id": "kobo-42ca035f-1ad0-4454-b84f-5bd516ea2470", "source": "kobo", "text": "Another simple rule is, when you are verbally assaulted, do not counterattack. Instead, disarm your counterpart by asking a calibrated question. The next time a waiter or salesclerk tries to engage you in a verbal skirmish, try this out. I promise you it will change the entire tenor of the conversation.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-03T21:23:08.000", "color": 4}, {"id": "kobo-annot-f955288c3c23addb", "source": "kobo", "text": "With that in mind, I want to end this chapter with some advice on how to remain rational in a negotiation. Even with all the best techniques and strategy, you need to regulate your emotions if you want to have any hope of coming out on top. The first and most basic rule of keeping your emotional cool is to bite your tongue. Not literally, of course. But you have to keep away from knee-jerk, passionate reactions. Pause. Think. Let the passion dissipate. That allows you to collect your thoughts and be more circumspect in what you say. It also lowers your chance of saying more than you want to.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-03T21:22:25Z", "color": null}, {"id": "kobo-b6fa8449-368c-4e3e-be21-121877d9afb6", "source": "kobo", "text": "With that in mind, I want to end this chapter with some advice on how to remain rational in a negotiation. Even with all the best techniques and strategy, you need to regulate your emotions if you want to have any hope of coming out on top.\n The first and most basic rule of keeping your emotional cool is to bite your tongue. Not literally, of course. But you have to keep away from knee-jerk, passionate reactions. Pause. Think. Let the passion dissipate. That allows you to collect your thoughts and be more circumspect in what you say. It also lowers your chance of saying more than you want to.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-03T21:22:25.000", "color": 4}, {"id": "kobo-annot-92b47b669bd4782e", "source": "kobo", "text": "You’ve not only implicitly asked for help—triggering goodwill and less defensiveness—but you’ve engineered a situation in which your formerly recalcitrant counterpart is now using his mental and emotional resources to overcome your challenges. It is the first step in your counterpart internalizing your way—and the obstacles in it—as his own. And that guides the other party toward designing a solution. Your solution.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-03T21:07:53Z", "color": null}, {"id": "kobo-496f9dd3-21a1-407b-a4f5-d5641b7a961e", "source": "kobo", "text": "You’ve not only implicitly asked for help—triggering goodwill and less defensiveness—but you’ve engineered a situation in which your formerly recalcitrant counterpart is now using his mental and emotional resources to overcome your challenges. It is the first step in your counterpart internalizing your way—and the obstacles in it—as his own. And that guides the other party toward designing a solution.\n Your solution.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-03T21:07:53.000", "color": 4}, {"id": "kobo-annot-52b54fe48f010c70", "source": "kobo", "text": "The implication of any well-designed calibrated question is that you want what the other guy wants but you need his intelligence to overcome the problem. This really appeals to very aggressive or egotistical counterparts.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-03T21:06:15Z", "color": null}, {"id": "kobo-33e6edc1-2d33-499a-9ef9-e007dba02386", "source": "kobo", "text": "The implication of any well-designed calibrated question is that you want what the other guy wants but you need his intelligence to overcome the problem. This really appeals to very aggressive or egotistical counterparts.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-03T21:06:15.000", "color": 4}, {"id": "kobo-annot-8fc7a82562c6f01b", "source": "kobo", "text": "The real beauty of calibrated questions is the fact that they offer no target for attack like statements do. Calibrated questions have the power to educate your counterpart on what the problem is rather than causing conflict by telling them what the problem is.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-01T21:47:46Z", "color": null}, {"id": "kobo-030568ab-3856-4bad-81c5-5c2d69e5fcc4", "source": "kobo", "text": "The real beauty of calibrated questions is the fact that they offer no target for attack like statements do. Calibrated questions have the power to educate your counterpart on what the problem is rather than causing conflict by telling them what the problem is.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-01T21:47:46.000", "color": 4}, {"id": "kobo-annot-59d0c3d8af968c7c", "source": "kobo", "text": "My advice for her was simple: I told her to engage them in a conversation where she summarized the situation and then asked, “How am I supposed to do that?”", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-01T21:44:50Z", "color": null}, {"id": "kobo-8a2cb26f-54ba-40c2-8a57-15277b15ce4e", "source": "kobo", "text": "My advice for her was simple: I told her to engage them in a conversation where she summarized the situation and then asked, “How am I supposed to do that?”", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-01T21:44:50.000", "color": 4}, {"id": "kobo-annot-7baf195f052c046f", "source": "kobo", "text": "technique for transforming encounters from confrontational showdowns into joint problem-solving sessions. And calibrated questions are the best tool.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-01T21:42:31Z", "color": null}, {"id": "kobo-f67ee028-a598-4240-bc32-65eb0aec18f9", "source": "kobo", "text": "technique for transforming encounters from confrontational showdowns into joint problem-solving sessions. And calibrated questions are the best tool.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-01T21:42:31.000", "color": 4}, {"id": "kobo-annot-0ad5a7d183d5cc1c", "source": "kobo", "text": "ask for help with one of the greatest-of-all-time calibrated questions: “How am I supposed to do that?” The critical part of this approach is that you really are asking for help and your delivery must convey that. With this negotiating scheme, instead of bullying the clerk, you’re asking for their advice and giving them the illusion of control. Asking for help in this manner, after you’ve already been engaged in a dialogue, is an incredibly powerful negotiating", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-01T21:42:03Z", "color": null}, {"id": "kobo-4f875a5c-d05f-4b7f-b228-265412540474", "source": "kobo", "text": "ask for help with one of the greatest-of-all-time calibrated questions: “How am I supposed to do that?” The critical part of this approach is that you really are asking for help and your delivery must convey that. With this negotiating scheme, instead of bullying the clerk, you’re asking for their advice and giving them the illusion of control.\n Asking for help in this manner, after you’ve already been engaged in a dialogue, is an incredibly powerful negotiating", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-01T21:42:03.000", "color": 4}, {"id": "kobo-annot-052a9418e4a059c1", "source": "kobo", "text": "Giving your counterpart the illusion of control by asking calibrated questions—by asking for help—is one of the most powerful tools for suspending unbelief.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-01T21:37:16Z", "color": null}, {"id": "kobo-e638ce13-b6f1-431e-9e22-7953626ae90e", "source": "kobo", "text": "Giving your counterpart the illusion of control by asking calibrated questions—by asking for help—is one of the most powerful tools for suspending unbelief.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-01T21:37:16.000", "color": 4}, {"id": "kobo-annot-c72a432cfb0eb4a7", "source": "kobo", "text": "Unbelief is the friction that keeps persuasion in check,” Dutton says. “Without it, there’d be no limits.”", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-01T21:35:06Z", "color": null}, {"id": "kobo-d22ce68e-f6aa-44d6-970a-5996e3660a3a", "source": "kobo", "text": "Unbelief is the friction that keeps persuasion in check,” Dutton says. “Without it, there’d be no limits.”", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-01T21:35:06.000", "color": 4}, {"id": "kobo-annot-3273e30db0899585", "source": "kobo", "text": "Our job as persuaders is easier than we think. It’s not to get others believing what we say. It’s just to stop them unbelieving.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-01T21:34:38Z", "color": null}, {"id": "kobo-41ef5e48-942b-4029-803f-469330e8ae8e", "source": "kobo", "text": "Our job as persuaders is easier than we think. It’s not to get others believing what we say. It’s just to stop them unbelieving.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-01T21:34:38.000", "color": 4}, {"id": "kobo-annot-29e1cc63fb725d36", "source": "kobo", "text": ". But if you can get the other side to drop their unbelief, you can slowly work them to your point of view on the back of their energy, just like the drug dealer’s question got the kidnapper to volunteer to do what the drug dealer wanted. You don’t directly persuade them to see your ideas. Instead, you ride them to your ideas. As the saying goes, the best way to ride a horse is in the direction in which it is going.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-01T21:34:13Z", "color": null}, {"id": "kobo-bed665e2-17b2-41ee-b91f-03a89caf0c04", "source": "kobo", "text": ". But if you can get the other side to drop their unbelief, you can slowly work them to your point of view on the back of their energy, just like the drug dealer’s question got the kidnapper to volunteer to do what the drug dealer wanted. You don’t directly persuade them to see your ideas. Instead, you ride them to your ideas. As the saying goes, the best way to ride a horse is in the direction in which it is going.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-01T21:34:13.000", "color": 4}, {"id": "kobo-annot-c7e749e2cd0671b5", "source": "kobo", "text": "The genius of this technique is really well explained by something that the psychologist Kevin Dutton says in his book Split-Second Persuasion.1 He talks about what he calls “unbelief,” which is active resistance to what the other side is saying, complete rejection. That’s where the two parties in a negotiation usually start.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-01T21:29:41Z", "color": null}, {"id": "kobo-48eb8551-ad72-4a58-bfea-e1eb6e89fd88", "source": "kobo", "text": "The genius of this technique is really well explained by something that the psychologist Kevin Dutton says in his book Split-Second Persuasion.1 He talks about what he calls “unbelief,” which is active resistance to what the other side is saying, complete rejection. That’s where the two parties in a negotiation usually start.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-01T21:29:41.000", "color": 4}, {"id": "kobo-annot-954d70727f80c9c1", "source": "kobo", "text": "Whether we like to recognize it or not, a universal rule of human nature, across all cultures, is that when somebody gives you something, they expect something in return. And they won’t give anything else until you pay them back.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-01T21:25:43Z", "color": null}, {"id": "kobo-58c9ec40-cfbd-43c6-ac36-4945f1567790", "source": "kobo", "text": "Whether we like to recognize it or not, a universal rule of human nature, across all cultures, is that when somebody gives you something, they expect something in return. And they won’t give anything else until you pay them back.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-01T21:25:43.000", "color": 4}, {"id": "kobo-annot-cb797f914181895d", "source": "kobo", "text": "The tool we developed is something I call the calibrated, or open-ended, question. What it does is remove aggression from conversations by acknowledging the other side openly, without resistance. In doing so, it lets you introduce ideas and requests without sounding pushy. It allows you to nudge.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-01T08:02:20Z", "color": null}, {"id": "kobo-6e3aeddc-e49b-4aff-9bc5-da419a5a30c2", "source": "kobo", "text": "The tool we developed is something I call the calibrated, or open-ended, question. What it does is remove aggression from conversations by acknowledging the other side openly, without resistance. In doing so, it lets you introduce ideas and requests without sounding pushy. It allows you to nudge.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-01T08:02:20.000", "color": 4}, {"id": "kobo-annot-e2f82f229b7510bf", "source": "kobo", "text": "When your counterpart drops the F-bomb, don’t get suckered into a concession. Instead, ask them to explain how you’re mistreating them.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-01T07:57:21Z", "color": null}, {"id": "kobo-2230a06d-71b1-4624-84e6-6aa44728686e", "source": "kobo", "text": "When your counterpart drops the F-bomb, don’t get suckered into a concession. Instead, ask them to explain how you’re mistreating them.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-03-01T07:57:21.000", "color": 4}, {"id": "kobo-annot-d22792d67153ed95", "source": "kobo", "text": "By far the best theory for describing the principles of our irrational decisions is something called Prospect Theory. Created in 1979 by the psychologists Daniel Kahneman and Amos Tversky, prospect theory describes how people choose between options that involve risk, like in a negotiation. The theory argues that people are drawn to sure things over probabilities, even when the probability is a better choice. That’s called the Certainty Effect. And people will take greater risks to avoid losses than to achieve gains. That’s called Loss Aversion.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-28T21:29:45Z", "color": null}, {"id": "kobo-1318ad61-c2e3-47c1-b081-09f06c294fa2", "source": "kobo", "text": "By far the best theory for describing the principles of our irrational decisions is something called Prospect Theory. Created in 1979 by the psychologists Daniel Kahneman and Amos Tversky, prospect theory describes how people choose between options that involve risk, like in a negotiation. The theory argues that people are drawn to sure things over probabilities, even when the probability is a better choice. That’s called the Certainty Effect. And people will take greater risks to avoid losses than to achieve gains. That’s called Loss Aversion.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-28T21:29:45.000", "color": 4}, {"id": "kobo-annot-d9abccd54c6cefb6", "source": "kobo", "text": "If you find yourself in this situation, the best reaction is to simply mirror the “F” that has just been lobbed at you. “Fair?” you’d respond, pausing to let the word’s power do to them as it was intended to do to you. Follow that with a label: “It seems like you’re ready to provide the evidence that supports that,” which alludes to opening their books or otherwise handing over information that will either contradict their claim to fairness or give you more data to work with than you had previously. Right away, you declaw the attack.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-28T21:23:16Z", "color": null}, {"id": "kobo-20c993f0-1d0b-4eec-b134-cbbc4233416f", "source": "kobo", "text": "If you find yourself in this situation, the best reaction is to simply mirror the “F” that has just been lobbed at you. “Fair?” you’d respond, pausing to let the word’s power do to them as it was intended to do to you. Follow that with a label: “It seems like you’re ready to provide the evidence that supports that,” which alludes to opening their books or otherwise handing over information that will either contradict their claim to fairness or give you more data to work with than you had previously. Right away, you declaw the attack.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-28T21:23:16.000", "color": 4}, {"id": "kobo-annot-bcc1f7c6155faf21", "source": "kobo", "text": "The best response either way is to take a deep breath and restrain your desire to concede. Then say, “Okay, I apologize. Let’s stop everything and go back to where I started treating you unfairly and we’ll fix it.”", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-28T11:52:46Z", "color": null}, {"id": "kobo-86853309-9095-455c-b844-e99d58b01947", "source": "kobo", "text": "The best response either way is to take a deep breath and restrain your desire to concede. Then say, “Okay, I apologize. Let’s stop everything and go back to where I started treating you unfairly and we’ll fix it.”", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-28T11:52:46.000", "color": 4}, {"id": "kobo-annot-bfe81e347f84df4c", "source": "kobo", "text": ". Most people make an irrational choice to let the dollar slip through their fingers rather than to accept a derisory offer, because the negative emotional value of unfairness outweighs the positive rational value of the money.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-28T11:47:58Z", "color": null}, {"id": "kobo-8d329a61-54e2-4c63-9b6a-ec9f0079f833", "source": "kobo", "text": ". Most people make an irrational choice to let the dollar slip through their fingers rather than to accept a derisory offer, because the negative emotional value of unfairness outweighs the positive rational value of the money.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-28T11:47:58.000", "color": 4}, {"id": "kobo-annot-e2cb3557f0c8a30e", "source": "kobo", "text": "The most powerful word in negotiations is “Fair.” As human beings, we’re mightily swayed by how much we feel we have been respected. People comply with agreements if they feel they’ve been treated fairly and lash out if they don’t.", "note": null, "title": "Never Split the Difference", "author": "Chris Voss", "url": null, "created_at": "2026-02-28T11:47:50Z", "color": null}, {"id": "kobo-cfcd8bc0-a9f0-42d8-9b9a-6508c06e1929", "source": "kobo", "text": "The most power
