e": "kobo", "text": "When someone makes a decision, he is really diving into a strong current that will carry him to places he had never dreamed of when he first made the decision.", "note": null, "title": "The Alchemist", "author": "Paolo Coelho", "url": null, "created_at": "2026-01-13T20:59:24Z", "color": null}, {"id": "kobo-7b4371ae-9be1-44d1-99b4-0cb39d923478", "source": "kobo", "text": "When someone makes a decision, he is really diving into a strong current that will carry him to places he had never dreamed of when he first made the decision.", "note": null, "title": "The Alchemist", "author": "Paolo Coelho", "url": null, "created_at": "2026-01-13T20:59:24.000", "color": 4}, {"id": "kobo-annot-c8e1839c848e45b5", "source": "kobo", "text": "He suddenly felt tremendously happy. He could always go back to being a shepherd. He could always become a crystal salesman again.", "note": null, "title": "The Alchemist", "author": "Paolo Coelho", "url": null, "created_at": "2026-01-13T19:46:37Z", "color": null}, {"id": "kobo-5777bcb3-1687-46d5-beb8-75d2ce79eeed", "source": "kobo", "text": "He suddenly felt tremendously happy. He could always go back to being a shepherd. He could always become a crystal salesman again.", "note": null, "title": "The Alchemist", "author": "Paolo Coelho", "url": null, "created_at": "2026-01-13T19:46:37.000", "color": 4}, {"id": "kobo-annot-b4547689d7912721", "source": "kobo", "text": "It's called the principle of favorability. Or beginner's luck.", "note": null, "title": "The Alchemist", "author": "Paolo Coelho", "url": null, "created_at": "2026-01-13T19:29:48Z", "color": null}, {"id": "kobo-1434152e-3871-429b-8ed6-022e746062af", "source": "kobo", "text": "It's called the principle of favorability. Or beginner's luck.", "note": null, "title": "The Alchemist", "author": "Paolo Coelho", "url": null, "created_at": "2026-01-13T19:29:48.000", "color": 4}, {"id": "kobo-annot-66657e7c21408186", "source": "kobo", "text": "But the crystal merchant had no choice. He had lived thirty years of his life buying and selling crystal pieces, and now it was too late to do anything else.", "note": null, "title": "The Alchemist", "author": "Paolo Coelho", "url": null, "created_at": "2026-01-13T19:22:14Z", "color": null}, {"id": "kobo-243a6002-6b2f-470e-9e0e-9c208027caf8", "source": "kobo", "text": "But the crystal merchant had no choice. He had lived thirty years of his life buying and selling crystal pieces, and now it was too late to do anything else.", "note": null, "title": "The Alchemist", "author": "Paolo Coelho", "url": null, "created_at": "2026-01-13T19:22:14.000", "color": 4}, {"id": "kobo-annot-e3b04e76cb1410f4", "source": "kobo", "text": "All things are one,\" the old man had said.", "note": null, "title": "The Alchemist", "author": "Paolo Coelho", "url": null, "created_at": "2026-01-13T19:20:36Z", "color": null}, {"id": "kobo-9daa1ec3-a309-4db8-8935-02ad2ef66a89", "source": "kobo", "text": "All things are one,\" the old man had said.", "note": null, "title": "The Alchemist", "author": "Paolo Coelho", "url": null, "created_at": "2026-01-13T19:20:36.000", "color": 4}, {"id": "kobo-annot-eb34a45dfb52c3f9", "source": "kobo", "text": "This candy merchant isn't making candy so that later he can travel or marry a shopkeeper's daughter. He's doing it because it's what he wants to do,\" thought the boy.", "note": null, "title": "The Alchemist", "author": "Paolo Coelho", "url": null, "created_at": "2026-01-13T19:18:48Z", "color": null}, {"id": "kobo-9f30d8c0-1a57-4c86-a205-d5a6fd163c46", "source": "kobo", "text": "This candy merchant isn't making candy so that later he can travel or marry a shopkeeper's daughter. He's doing it because it's what he wants to do,\" thought the boy.", "note": null, "title": "The Alchemist", "author": "Paolo Coelho", "url": null, "created_at": "2026-01-13T19:18:48.000", "color": 4}, {"id": "kobo-annot-e8cdeee72cbe418d", "source": "kobo", "text": "He looked around at the empty plaza again, feeling less desperate than before. This wasn't a strange place; it was a new one.", "note": null, "title": "The Alchemist", "author": "Paolo Coelho", "url": null, "created_at": "2026-01-13T19:16:05Z", "color": null}, {"id": "kobo-2282dbfa-4fc8-43d4-bf9b-9ef2c775b81e", "source": "kobo", "text": "He looked around at the empty plaza again, feeling less desperate than before. This wasn't a strange place; it was a new one.", "note": null, "title": "The Alchemist", "author": "Paolo Coelho", "url": null, "created_at": "2026-01-13T19:16:05.000", "color": 4}, {"id": "kobo-annot-ab4372532c2cb4aa", "source": "kobo", "text": "Well, there is only one piece of advice I can give you,' said the wisest of wise men. 'The secret of happiness is to see all the marvels of the world, and never to forget the drops of oil on the spoon.", "note": null, "title": "The Alchemist", "author": "Paolo Coelho", "url": null, "created_at": "2026-01-13T18:55:43Z", "color": null}, {"id": "kobo-89c2c56d-b225-4d85-a39c-cb5f6c975c25", "source": "kobo", "text": "Well, there is only one piece of advice I can give you,' said the wisest of wise men. 'The secret of happiness is to see all the marvels of the world, and never to forget the drops of oil on the spoon.", "note": null, "title": "The Alchemist", "author": "Paolo Coelho", "url": null, "created_at": "2026-01-13T18:55:43.000", "color": 4}, {"id": "kobo-annot-2209de000eb97aac", "source": "kobo", "text": "and when each day is the same as the next, it's because people fail to recognize the good things that happen in their lives every day that the sun rises. I", "note": null, "title": "The Alchemist", "author": "Paolo Coelho", "url": null, "created_at": "2026-01-13T18:48:18Z", "color": null}, {"id": "kobo-66fe9c59-e248-4e0b-b0d7-cd9541ec89a2", "source": "kobo", "text": "and when each day is the same as the next, it's because people fail to recognize the good things that happen in their lives every day that the sun rises. I", "note": null, "title": "The Alchemist", "author": "Paolo Coelho", "url": null, "created_at": "2026-01-13T18:48:18.000", "color": 4}, {"id": "kobo-annot-966c0ba89f1eb49b", "source": "kobo", "text": "The old man continued, \"In the long run, what people think about shepherds and bakers becomes more important for them than their own destinies.", "note": null, "title": "The Alchemist", "author": "Paolo Coelho", "url": null, "created_at": "2026-01-12T21:07:50Z", "color": null}, {"id": "kobo-481c50f5-f527-4322-8444-0c4208844b53", "source": "kobo", "text": "The old man continued, \"In the long run, what people think about shepherds and bakers becomes more important for them than their own destinies.", "note": null, "title": "The Alchemist", "author": "Paolo Coelho", "url": null, "created_at": "2026-01-12T21:07:50.000", "color": 4}, {"id": "kobo-annot-5ab37f9a0a09e7cc", "source": "kobo", "text": ". That was what made traveling appeal to him—he always made new friends, and he didn't need to spend all of his time with them. When someone sees the same people every day, as had happened with him at the seminary, they wind up becoming a part of that person's life. And then they want the person to change. If someone isn't what others want them to be, the others become angry. Everyone seems to have a clear idea of how other people should lead their lives, but none about his or her own.", "note": null, "title": "The Alchemist", "author": "Paolo Coelho", "url": null, "created_at": "2026-01-12T20:55:49Z", "color": null}, {"id": "kobo-0c43bb96-3af0-4fa0-8a55-becb0b9bf797", "source": "kobo", "text": ". That was what made traveling appeal to him—he always made new friends, and he didn't need to spend all of his time with them. When someone sees the same people every day, as had happened with him at the seminary, they wind up becoming a part of that person's life. And then they want the person to change. If someone isn't what others want them to be, the others become angry. Everyone seems to have a clear idea of how other people should lead their lives, but none about his or her own.", "note": null, "title": "The Alchemist", "author": "Paolo Coelho", "url": null, "created_at": "2026-01-12T20:55:49.000", "color": 4}, {"id": "kobo-annot-b4e27fab1b566c24", "source": "kobo", "text": "We have to be prepared for change, he thought, and he was grateful for the jacket's weight and warmth.", "note": null, "title": "The Alchemist", "author": "Paolo Coelho", "url": null, "created_at": "2026-01-12T20:39:02Z", "color": null}, {"id": "kobo-c8514a64-2549-4ab4-a7bf-0b9a0652883f", "source": "kobo", "text": "We have to be prepared for change, he thought, and he was grateful for the jacket's weight and warmth.", "note": null, "title": "The Alchemist", "author": "Paolo Coelho", "url": null, "created_at": "2026-01-12T20:39:02.000", "color": 4}, {"id": "kobo-annot-dbc4b86454da13f1", "source": "kobo", "text": "De ouderdom is niet beter en nauwelijks even bevoegd tot onderricht geven dan de jeugd, want hij heeft meer verloren dan gewonnen.", "note": null, "title": "Walden", "author": "Henry David Thoreau", "url": null, "created_at": "2026-01-12T19:32:47Z", "color": null}, {"id": "kobo-a994430c-58ae-4003-8a7a-f5c07e2f15a5", "source": "kobo", "text": "De ouderdom is niet beter en nauwelijks even bevoegd tot onderricht geven dan de jeugd, want hij heeft meer verloren dan gewonnen.", "note": null, "title": "Walden", "author": "Henry David Thoreau", "url": null, "created_at": "2026-01-12T19:32:47.000", "color": 4}, {"id": "kobo-annot-62cedcbf60d671b1", "source": "kobo", "text": ". Maar zij die wakker en gezond van aard zijn, beseffen dat de zon helder is opgekomen. Het is nooit te laat om onze vooroordelen te laten varen. Geen enkele manier van denken of doen, hoe oud ook, is te vertrouwen zonder bewijs. Wat iedereen vandaag de dag napraat of in stilte voor waarheid houdt, kan morgen vals blijken, en alleen maar wat rook van meningen die sommigen vol vertrouwen aanzagen voor een wolk die hun velden met vruchtbare regen zou besprenkelen. Je probeert iets te doen wat je volgens mensen van vroeger niet kunt, en je merkt dat je het kunt. Oude daden voor oude mensen, en nieuwe daden voor nieuwe.", "note": null, "title": "Walden", "author": "Henry David Thoreau", "url": null, "created_at": "2026-01-12T19:32:03Z", "color": null}, {"id": "kobo-57f1a170-0f08-4116-954d-85aabc763510", "source": "kobo", "text": ". Maar zij die wakker en gezond van aard zijn, beseffen dat de zon helder is opgekomen. Het is nooit te laat om onze vooroordelen te laten varen. Geen enkele manier van denken of doen, hoe oud ook, is te vertrouwen zonder bewijs. Wat iedereen vandaag de dag napraat of in stilte voor waarheid houdt, kan morgen vals blijken, en alleen maar wat rook van meningen die sommigen vol vertrouwen aanzagen voor een wolk die hun velden met vruchtbare regen zou besprenkelen. Je probeert iets te doen wat je volgens mensen van vroeger niet kunt, en je merkt dat je het kunt. Oude daden voor oude mensen, en nieuwe daden voor nieuwe.", "note": null, "title": "Walden", "author": "Henry David Thoreau", "url": null, "created_at": "2026-01-12T19:32:03.000", "color": 4}, {"id": "kobo-annot-f6582c10de286d2f", "source": "kobo", "text": "Feitelijk heeft de zwoegende mens geen gelegenheid om van dag tot dag zijn ware zelf te zijn; hij kan zich de menselijkste verhoudingen tot de mensen niet veroorloven; de marktwaarde van zijn arbeid zou erdoor dalen. Hij heeft geen tijd om iets anders te zijn dan een machine. Hoe kan degene die zijn kennis zo vaak moet benutten zich goed bewust worden van zijn onkunde – wat nodig is voor zijn groei?", "note": null, "title": "Walden", "author": "Henry David Thoreau", "url": null, "created_at": "2026-01-11T20:33:21Z", "color": null}, {"id": "kobo-5226d4aa-5c5d-41e4-afe0-3e341f95381c", "source": "kobo", "text": "Feitelijk heeft de zwoegende mens geen gelegenheid om van dag tot dag zijn ware zelf te zijn; hij kan zich de menselijkste verhoudingen tot de mensen niet veroorloven; de marktwaarde van zijn arbeid zou erdoor dalen. Hij heeft geen tijd om iets anders te zijn dan een machine. Hoe kan degene die zijn kennis zo vaak moet benutten zich goed bewust worden van zijn onkunde – wat nodig is voor zijn groei?", "note": null, "title": "Walden", "author": "Henry David Thoreau", "url": null, "created_at": "2026-01-11T20:33:21.000", "color": 4}, {"id": "kobo-annot-dc53b5a717e2908d", "source": "kobo", "text": "From thence our kind hard-hearted is, enduring pain and care, Approving that our bodies of a stony nature are.", "note": null, "title": "Walden", "author": "Henry David Thoreau", "url": null, "created_at": "2026-01-09T21:51:01Z", "color": null}, {"id": "kobo-c2d8fd24-d66b-477e-8b95-97c1524de9de", "source": "kobo", "text": "From thence our kind hard-hearted is, enduring pain and care, Approving that our bodies of a stony nature are.", "note": null, "title": "Walden", "author": "Henry David Thoreau", "url": null, "created_at": "2026-01-09T21:51:01.000", "color": 4}, {"id": "kobo-annot-b057ba3cf83244b0", "source": "kobo", "text": ", waarin je slapen kunt, als je niet wordt voortgejaagd door het besef te moeten inhalen wat je overdag verzuimd hebt, te moeten goedmaken wat je hebt verknoeid.", "note": null, "title": "Nooit meer slapen", "author": "Willem Frederik Hermans", "url": null, "created_at": "2025-12-27T19:33:05Z", "color": null}, {"id": "kobo-fab22813-001b-43f3-9779-9c27528d335f", "source": "kobo", "text": ", waarin je slapen kunt, als je niet wordt voortgejaagd door het besef te moeten inhalen wat je overdag verzuimd hebt, te moeten goedmaken wat je hebt verknoeid.", "note": null, "title": "Nooit meer slapen", "author": "Willem Frederik Hermans", "url": null, "created_at": "2025-12-27T19:33:05.090", "color": 4}, {"id": "kobo-annot-8fcf001c679be676", "source": "kobo", "text": "Arne is beter toegerust om succes te hebben dan ik en zelfs hij gunt zichzelf niets, uit angst dat het hem niet zal lukken een belangrijke wetenschappelijke prestatie te verrichten.", "note": null, "title": "Nooit meer slapen", "author": "Willem Frederik Hermans", "url": null, "created_at": "2025-12-23T21:24:20Z", "color": null}, {"id": "kobo-f96adf6d-05ee-4c8a-9c0f-d7e678c839bf", "source": "kobo", "text": "Arne is beter toegerust om succes te hebben dan ik en zelfs hij gunt zichzelf niets, uit angst dat het hem niet zal lukken een belangrijke wetenschappelijke prestatie te verrichten.", "note": null, "title": "Nooit meer slapen", "author": "Willem Frederik Hermans", "url": null, "created_at": "2025-12-23T21:24:20.455", "color": 4}, {"id": "kobo-annot-b1a8a77157772a16", "source": "kobo", "text": "der ewig Betrogene des Universums.", "note": null, "title": "Nooit meer slapen", "author": "Willem Frederik Hermans", "url": null, "created_at": "2025-12-17T21:05:45Z", "color": null}, {"id": "kobo-6b189d24-78bd-4b5c-9719-bbf2869a77eb", "source": "kobo", "text": "der ewig Betrogene des Universums.", "note": null, "title": "Nooit meer slapen", "author": "Willem Frederik Hermans", "url": null, "created_at": "2025-12-17T21:05:45.218", "color": 4}, {"id": "kobo-annot-cec9d28ce8d6564b", "source": "kobo", "text": "Wie durft vertrouwen dat het op een wereld waar al zoveel offers totaal voor niets gebracht zijn, mogelijk is ook maar een enkel offer te brengen dat zin heeft?", "note": null, "title": "Nooit meer slapen", "author": "Willem Frederik Hermans", "url": null, "created_at": "2025-12-15T21:31:48Z", "color": null}, {"id": "kobo-a4dd3eae-67b4-4c93-80ca-f9a6c21d4333", "source": "kobo", "text": "Wie durft vertrouwen dat het op een wereld waar al zoveel offers totaal voor niets gebracht zijn, mogelijk is ook maar een enkel offer te brengen dat zin heeft?", "note": null, "title": "Nooit meer slapen", "author": "Willem Frederik Hermans", "url": null, "created_at": "2025-12-15T21:31:48.716", "color": 4}, {"id": "kobo-annot-138f12f445dc598b", "source": "kobo", "text": "Maar wat een beproeving: te moeten ondervinden hoever de wonderlijk em Frederik Hermans", "url": null, "created_at": "2025-12-09T21:26:57Z", "color": null}, {"id": "kobo-516922a7-80f3-4c64-947b-c4334f769b54", "source": "kobo", "text": "De meeste mensen baseren hun zelfrespect op een of ander gebrek aan comfort.", "note": "Mooie zin", "title": "Nooit meer slapen", "author": "Willem Frederik Hermans", "url": null, "created_at": "2025-12-09T21:26:57.000", "color": 4}]};</script>
<script>
/* =========================================================================
 *  Marginalia — viewer voor highlights.json
 *
 *  Alle state (cached data, favorieten, view-keuze) staat in localStorage.
 *  Geen netwerkcalls behalve een poging tot fetch('highlights.json') op load.
 * ========================================================================= */

const LS = {
  data:   "marg.data.v1",      // gecachete highlights (volledige JSON)
  favs:   "marg.favs.v1",      // Set<string>: id's van favoriete highlights
  tab:    "marg.tab.v1",
  daily:  "marg.daily.v1",     // { date: 'YYYY-MM-DD', ids: [...] }
};

const DAILY_COUNT = 5;

const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => [...root.querySelectorAll(sel)];

let STATE = {
  data: null,            // { generated_at, count, highlights: [] }
  favs: new Set(),
  tab:  "daily",
  search: "",
  filter: "all",         // all | kobo | instapaper
};

/* ---------- storage helpers ---------- */
function loadFavs(){
  try{
    const raw = localStorage.getItem(LS.favs);
    return new Set(raw ? JSON.parse(raw) : []);
  }catch{ return new Set(); }
}
function saveFavs(){
  localStorage.setItem(LS.favs, JSON.stringify([...STATE.favs]));
}
function loadCachedData(){
  try{
    const raw = localStorage.getItem(LS.data);
    return raw ? JSON.parse(raw) : null;
  }catch{ return null; }
}
function saveCachedData(d){
  try{ localStorage.setItem(LS.data, JSON.stringify(d)); }
  catch(e){ console.warn("Kon data niet cachen (te groot voor localStorage?):", e); }
}

/* ---------- seedable PRNG (mulberry32) ---------- */
function hashStr(s){
  let h = 2166136261 >>> 0;
  for (let i=0;i<s.length;i++){
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function pickRandom(arr, n, rng){
  // Fisher–Yates op een kopie, eerste n nemen
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a.slice(0, n);
}

/* ---------- data ingestion ---------- */
async function tryFetchLocal(){
  try{
    const r = await fetch("highlights.json", {cache:"no-store"});
    if (!r.ok) return null;
    return await r.json();
  }catch{
    return null;
  }
}

function ingestData(d){
  if (!d || !Array.isArray(d.highlights)){
    alert("Dit bestand bevat geen highlights-array.");
    return;
  }
  STATE.data = d;
  saveCachedData(d);
  render();
}

/* ---------- rendering ---------- */
function escapeHtml(s){
  return (s ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  })[c]);
}
function highlightText(text, q){
  const safe = escapeHtml(text);
  if (!q) return safe;
  const re = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
  return safe.replace(re, "<mark>$1</mark>");
}

function highlightCard(h, q=""){
  const isFav = STATE.favs.has(h.id);
  const titlePart = h.url
    ? `<a href="${escapeHtml(h.url)}" target="_blank" rel="noreferrer noopener" class="title">${escapeHtml(h.title)}</a>`
    : `<span class="title">${escapeHtml(h.title)}</span>`;
  const authorPart = h.author ? `<span class="author">${escapeHtml(h.author)}</span>` : "";
  const noteHtml = h.note ? `<div class="note">${highlightText(h.note, q)}</div>` : "";
  return `
    <article class="hl" data-id="${escapeHtml(h.id)}">
      <p class="text">${highlightText(h.text, q)}</p>
      ${noteHtml}
      <footer>
        <span class="src">
          <span class="badge ${h.source}">${h.source === "kobo" ? "Kobo" : "Instapaper"}</span>
          ${titlePart}${authorPart}
        </span>
        <span class="actions">
          <button class="fav ${isFav ? "on" : ""}" data-act="fav">${isFav ? "★ favoriet" : "☆ favoriet"}</button>
          <button data-act="copy">kopieer</button>
        </span>
      </footer>
    </article>`;
}

function renderLoader(message){
  return `
    <div class="loader" id="loader">
      <h2>Highlights laden</h2>
      <p>${message}</p>
      <label class="filebtn">
        Kies highlights.json
        <input type="file" id="filein" accept=".json,application/json" hidden>
      </label>
      <p style="margin-top:14px;font-size:13px;color:var(--ink-muted)">
        of sleep het bestand op deze pagina
      </p>
    </div>`;
}

function renderDaily(){
  const all = STATE.data.highlights;
  if (all.length === 0){
    return `<div class="empty">Nog geen highlights in deze dataset.</div>`;
  }

  const today = new Date().toISOString().slice(0,10); // YYYY-MM-DD
  let dailyState;
  try{
    dailyState = JSON.parse(localStorage.getItem(LS.daily) || "null");
  }catch{ dailyState = null; }

  let ids;
  if (dailyState && dailyState.date === today && Array.isArray(dailyState.ids) && !dailyState.shuffled){
    ids = dailyState.ids;
  } else {
    const seedBase = dailyState && dailyState.date === today && dailyState.shuffled
      ? today + "-" + dailyState.shuffleCount
      : today;
    const rng = mulberry32(hashStr(seedBase));
    const picks = pickRandom(all, Math.min(DAILY_COUNT, all.length), rng);
    ids = picks.map(p => p.id);
    localStorage.setItem(LS.daily, JSON.stringify({
      date: today, ids,
      shuffled: !!(dailyState && dailyState.shuffled),
      shuffleCount: dailyState?.shuffleCount || 0,
    }));
  }

  const byId = new Map(all.map(h => [h.id, h]));
  const items = ids.map(id => byId.get(id)).filter(Boolean);

  const dateLabel = new Date().toLocaleDateString("nl-NL", {
    weekday:"long", day:"numeric", month:"long", year:"numeric"
  });

  return `
    <section>
      <div class="daily-head">
        <h2>${dateLabel}</h2>
        <button class="reshuffle" id="reshuffle">Nieuwe set</button>
      </div>
      ${items.map(h => highlightCard(h)).join("")}
    </section>`;
}

function renderBrowse(){
  const all = STATE.data.highlights;
  const q = STATE.search.trim().toLowerCase();
  const f = STATE.filter;

  let pool = all;
  if (f === "kobo" || f === "instapaper") pool = pool.filter(h => h.source === f);

  if (q){
    pool = pool.filter(h =>
      (h.text  || "").toLowerCase().includes(q) ||
      (h.title || "").toLowerCase().includes(q) ||
      (h.author|| "").toLowerCase().includes(q) ||
      (h.note  || "").toLowerCase().includes(q)
    );
  }

  // Group by title
  const groups = new Map();
  for (const h of pool){
    const key = h.title || "Onbekend";
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(h);
  }

  const filterChips = `
    <div class="filters">
      ${["all","kobo","instapaper"].map(k =>
        `<button class="chip ${STATE.filter === k ? "active":""}" data-filter="${k}">${
          k==="all" ? "Alles" : k==="kobo" ? "Kobo" : "Instapaper"
        }</button>`
      ).join("")}
    </div>`;

  const head = `
    <div class="browse-head">
      <div class="search">
        <input id="searchbox" type="search" placeholder="Zoek in tekst, titel, auteur, aantekening…" value="${escapeHtml(STATE.search)}">
        <span class="count">${pool.length} / ${all.length}</span>
      </div>
      ${filterChips}
    </div>`;

  if (pool.length === 0){
    return head + `<div class="empty">Geen highlights gevonden.</div>`;
  }

  // Sort groups by name
  const sortedGroups = [...groups.entries()].sort((a,b) => a[0].localeCompare(b[0], "nl"));
  const openIfSearching = q ? "open" : "";

  const body = sortedGroups.map(([title, items]) => {
    const author = items[0].author;
    return `
      <details class="book" ${openIfSearching}>
        <summary>
          <span class="booktitle">${escapeHtml(title)}</span>
          ${author ? `<span class="bookauthor">${escapeHtml(author)}</span>` : ""}
          <span class="bookcount">${items.length}</span>
        </summary>
        <div class="book-items">
          ${items.map(h => highlightCard(h, q)).join("")}
        </div>
      </details>`;
  }).join("");

  return head + body;
}

function renderFavs(){
  const all = STATE.data.highlights;
  const items = all.filter(h => STATE.favs.has(h.id));
  if (items.length === 0){
    return `<div class="empty">Nog geen favorieten — markeer een highlight met ☆ favoriet.</div>`;
  }
  return `
    <div class="daily-head">
      <h2>${items.length} favoriet${items.length===1?"":"en"}</h2>
    </div>
    ${items.map(h => highlightCard(h)).join("")}`;
}

function render(){
  const root = $("#root");

  if (!STATE.data){
    root.innerHTML = renderLoader("Sleep <code>highlights.json</code> hierheen, of kies het bestand.");
    $("#tabs").hidden = true;
    $("#footbar").hidden = true;
    $("#meta").textContent = "geen data geladen";
    return;
  }

  $("#tabs").hidden = false;
  $("#footbar").hidden = false;
  const total = STATE.data.highlights.length;
  $("#meta").textContent = `${total} highlights`;
  const gen = STATE.data.generated_at
    ? new Date(STATE.data.generated_at).toLocaleString("nl-NL", {dateStyle:"medium", timeStyle:"short"})
    : "onbekend";
  $("#datastamp").textContent = `gegenereerd: ${gen}`;

  // Tab buttons state
  for (const b of $$("nav.tabs button")){
    b.classList.toggle("active", b.dataset.tab === STATE.tab);
  }

  if (STATE.tab === "daily"){
    root.innerHTML = renderDaily();
  } else if (STATE.tab === "browse"){
    root.innerHTML = renderBrowse();
    // restore focus on search if user was typing
    const sb = $("#searchbox");
    if (sb && document.activeElement?.id !== "searchbox" && STATE.search){
      // place caret at end
      sb.setSelectionRange(sb.value.length, sb.value.length);
    }
  } else if (STATE.tab === "favs"){
    root.innerHTML = renderFavs();
  }
}

/* ---------- event delegation ---------- */
document.addEventListener("click", (e) => {
  // Tab switch
  const tabBtn = e.target.closest("nav.tabs button");
  if (tabBtn){
    STATE.tab = tabBtn.dataset.tab;
    localStorage.setItem(LS.tab, STATE.tab);
    render();
    return;
  }

  // Filter chip
  const chip = e.target.closest(".chip");
  if (chip){
    STATE.filter = chip.dataset.filter;
    render();
    return;
  }

  // Reshuffle daily
  if (e.target.id === "reshuffle"){
    const today = new Date().toISOString().slice(0,10);
    let prev;
    try{ prev = JSON.parse(localStorage.getItem(LS.daily) || "null"); }catch{ prev = null; }
    const count = (prev?.shuffleCount || 0) + 1;
    localStorage.setItem(LS.daily, JSON.stringify({
      date: today, ids: [], shuffled: true, shuffleCount: count
    }));
    render();
    return;
  }

  // Per-card actions
  const actBtn = e.target.closest(".actions button");
  if (actBtn){
    const card = actBtn.closest("article.hl");
    const id = card?.dataset.id;
    if (!id) return;
    const h = STATE.data.highlights.find(x => x.id === id);
    if (!h) return;

    if (actBtn.dataset.act === "fav"){
      if (STATE.favs.has(id)) STATE.favs.delete(id); else STATE.favs.add(id);
      saveFavs();
      // local toggle without full re-render
      actBtn.classList.toggle("on");
      actBtn.textContent = STATE.favs.has(id) ? "★ favoriet" : "☆ favoriet";
    } else if (actBtn.dataset.act === "copy"){
      const blob = h.text + (h.author ? `\n— ${h.author}` : "") + (h.title ? ` (${h.title})` : "");
      navigator.clipboard.writeText(blob).then(() => {
        const t = actBtn.textContent;
        actBtn.textContent = "gekopieerd!";
        setTimeout(() => { actBtn.textContent = t; }, 1200);
      });
    }
    return;
  }

  // Reload
  if (e.target.id === "reload"){
    $("#filein-hidden")?.click();
    return;
  }
  if (e.target.id === "exportfavs"){
    exportFavs();
    return;
  }
  if (e.target.id === "wipe"){
    if (confirm("Lokale opslag wissen? Hiermee verdwijnen je gecachete data, favorieten en dagstaat.")){
      localStorage.removeItem(LS.data);
      localStorage.removeItem(LS.favs);
      localStorage.removeItem(LS.daily);
      localStorage.removeItem(LS.tab);
      STATE = { data:null, favs:new Set(), tab:"daily", search:"", filter:"all" };
      render();
    }
    return;
  }
});

document.addEventListener("input", (e) => {
  if (e.target.id === "searchbox"){
    STATE.search = e.target.value;
    render();
    // re-focus and put caret at end
    const sb = $("#searchbox");
    if (sb){ sb.focus(); sb.setSelectionRange(sb.value.length, sb.value.length); }
  }
});

document.addEventListener("change", (e) => {
  if (e.target.id === "filein" || e.target.id === "filein-hidden"){
    const f = e.target.files?.[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{ ingestData(JSON.parse(r.result)); }
      catch(err){ alert("Kan JSON niet lezen: " + err.message); }
    };
    r.readAsText(f);
  }
});

/* ---------- drag & drop ---------- */
["dragenter","dragover"].forEach(ev =>
  document.addEventListener(ev, e => {
    e.preventDefault();
    $("#loader")?.classList.add("drag");
  })
);
["dragleave","drop"].forEach(ev =>
  document.addEventListener(ev, e => {
    e.preventDefault();
    $("#loader")?.classList.remove("drag");
  })
);
document.addEventListener("drop", (e) => {
  const f = e.dataTransfer?.files?.[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{ ingestData(JSON.parse(r.result)); }
    catch(err){ alert("Kan JSON niet lezen: " + err.message); }
  };
  r.readAsText(f);
});

/* ---------- favorites export ---------- */
function exportFavs(){
  if (!STATE.data){ alert("Geen data."); return; }
  const items = STATE.data.highlights.filter(h => STATE.favs.has(h.id));
  if (items.length === 0){ alert("Nog geen favorieten."); return; }
  const out = {
    exported_at: new Date().toISOString(),
    count: items.length,
    highlights: items,
  };
  const blob = new Blob([JSON.stringify(out, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `marginalia-favorites-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}

/* ---------- hidden file input for "reload" link ---------- */
{
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json,application/json";
  inp.id = "filein-hidden"; inp.hidden = true;
  document.body.appendChild(inp);
}

/* ---------- boot ---------- */
(async function init(){
  STATE.favs = loadFavs();
  STATE.tab  = localStorage.getItem(LS.tab) || "daily";

  // 1) embedded data wins (used by --bundle output)
  let data = (typeof window.__EMBEDDED_DATA__ !== "undefined") ? window.__EMBEDDED_DATA__ : null;
  // 2) try fetch (works when served via http(s))
  if (!data) data = await tryFetchLocal();
  // 3) fall back to localStorage cache
  if (!data) data = loadCachedData();

  if (data){
    STATE.data = data;
    // also refresh cache if fetch succeeded
    saveCachedData(data);
  }
  render();
})();
</script>
